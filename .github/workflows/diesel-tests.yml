# ARENCON Test Agent — automated QA for the toolkit's flagships.
# Runs on: every push to main touching Diesel or FRT (any writer, including the
# concurrent Training-Center bot) AND nightly at 09:00 UTC (~4am Toronto).
# On failure it FILES A BUG: opens a GitHub Issue labeled `test-agent` with the
# exact FAIL lines (or appends to the open one). Check the repo's Issues tab —
# that is the agent's bug list, readable by Mark or any Claude session.
name: test-agent
on:
  push:
    branches: [ main ]
    paths:
      - 'ARENCON_Diesel_Fire_Pump_Commissioning.html'
      - 'frt/**'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/diesel-tests.yml'
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install harness deps
        working-directory: tests
        run: npm install --no-fund --no-audit
      - name: Diesel harness (Tier 1 + 2 + explorer)
        working-directory: tests
        run: |
          set -o pipefail
          node diesel.test.js 2>&1 | tee -a agent-report.txt
      - name: FRT harness (Tier 1 + explorer)
        if: always()
        working-directory: tests
        run: |
          set -o pipefail
          node frt.test.js 2>&1 | tee -a agent-report.txt
      - name: File bug issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '(no report captured)';
            try { report = fs.readFileSync('tests/agent-report.txt', 'utf8'); } catch (e) {}
            const fails = report.split('\n').filter(l => l.startsWith('FAIL')).join('\n') || '(see full log)';
            const body = 'Automated test-agent failure\n' +
              '- Commit: ' + context.sha.substring(0, 8) + '\n' +
              '- Trigger: ' + context.eventName + '\n' +
              '- Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '\n\n' +
              '**Failing checks:**\n```\n' + fails.slice(0, 4000) + '\n```';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'test-agent' });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '🐛 Test agent: failures detected', labels: ['test-agent'], body });
            }
