name: Daily tool_data Backup

# Daily backup of the Supabase tool_data table to backups/tool_data.json.
# Git history preserves every prior version — rollback is `git checkout HEAD~N`.
# Service-role key reads bypass RLS to capture ALL projects (FRT + all other tools).
#
# Required repo secrets:
#   SUPABASE_SERVICE_ROLE_KEY — Supabase Project Settings → API Keys → service_role
#
# Manual trigger anytime via Actions tab → "Daily tool_data Backup" → Run workflow.

on:
  schedule:
    - cron: '0 4 * * *'  # 4am UTC daily (~midnight Eastern in May)
  workflow_dispatch: {}  # allow manual trigger from Actions tab

permissions:
  contents: write  # needed to commit the backup file back

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch tool_data from Supabase
        env:
          SUPABASE_URL: https://xsemvinxsyphjiaqgywv.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY repo secret is not set."
            echo "Add it in Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          mkdir -p backups
          curl -fsS \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/tool_data?select=*" \
            -o backups/tool_data.raw.json
          # Sanity check: valid JSON, at least 1 row
          if ! jq -e 'type == "array" and length > 0' backups/tool_data.raw.json > /dev/null 2>&1; then
            echo "::error::Backup empty or invalid JSON — aborting commit so we don't overwrite a good backup."
            head -c 500 backups/tool_data.raw.json || true
            exit 1
          fi
          # Pretty-print for git diff readability
          jq '.' backups/tool_data.raw.json > backups/tool_data.json
          rm backups/tool_data.raw.json
          BYTES=$(wc -c < backups/tool_data.json)
          ROWS=$(jq 'length' backups/tool_data.json)
          echo "Backup: $ROWS rows, $BYTES bytes"
          echo "BACKUP_ROWS=$ROWS" >> "$GITHUB_ENV"
          echo "BACKUP_BYTES=$BYTES" >> "$GITHUB_ENV"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/tool_data.json
          if git diff --staged --quiet; then
            echo "No changes since last backup — skipping commit."
            exit 0
          fi
          STAMP=$(date -u +'%Y-%m-%dT%H:%MZ')
          git commit -m "Backup ${STAMP}: ${BACKUP_ROWS} rows, ${BACKUP_BYTES} bytes"
          git push
