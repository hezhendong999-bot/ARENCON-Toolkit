name: Nightly Retention Report

# S495 STAGE 2 — the 90-day retention ELIGIBILITY report.
# Copies the photo-integrity pattern exactly: the scheduled job REPORTS,
# it does not delete. tools/retention_sweep.mjs contains no delete verb.
# Purge stays manual, admin-only, in the Hub, type-to-confirm, and every
# purged row is snapshot-archived by the DB trigger before it goes.
#
# A red run means ANOMALY (eligible count spiked past the expected cap),
# not "items expired" — eligibility alone is a normal green run.
#
# Required repo secret:
#   SUPABASE_SERVICE_ROLE_KEY — same secret the backup + photo sweeps use.
#
# Manual run: Actions tab → "Nightly Retention Report" → Run workflow.

on:
  schedule:
    - cron: '45 5 * * *'   # 5:45am UTC daily (after backup at 4:00 and photo sweep at 5:30)
  workflow_dispatch: {}

permissions:
  contents: write   # to commit the report file

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run retention eligibility report
        env:
          SUPABASE_URL: https://xsemvinxsyphjiaqgywv.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node tools/retention_sweep.mjs

      - name: Commit report (always, even on failure)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/retention.json || true
          if git diff --staged --quiet; then
            echo "No report change."
            exit 0
          fi
          STAMP=$(date -u +'%Y-%m-%dT%H:%MZ')
          git commit -m "Retention report ${STAMP}"
          git push
