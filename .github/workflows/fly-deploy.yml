name: Deploy mupdf renderer to Fly.io

# Manual trigger only. Creates the Fly.io app if it doesn't exist (idempotent),
# syncs secrets from GitHub Secrets to Fly.io app secrets, then deploys.

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Fly.io app name to deploy to"
        required: true
        default: "arencon-render-staging"
        type: choice
        options:
          - arencon-render-staging
          - arencon-render
      tile_prefix:
        description: "R2 tile path prefix (separates staging tiles from prod)"
        required: true
        default: "tiles-mupdf-staging"
        type: choice
        options:
          - tiles-mupdf-staging
          - tiles

jobs:
  deploy:
    name: Deploy ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly.io app (idempotent — ignores "already taken")
        # `flyctl apps create` returns non-zero if the app already exists.
        # We swallow that specific error case and continue. Any other failure
        # (e.g., auth) will surface in the next step (Sync secrets).
        run: |
          if flyctl apps create "${{ inputs.app_name }}" --org personal 2>&1 | tee /tmp/create.log; then
            echo "✅ App ${{ inputs.app_name }} created."
          elif grep -q "already been taken\|already exists" /tmp/create.log; then
            echo "ℹ️  App ${{ inputs.app_name }} already exists — continuing."
          else
            echo "❌ App create failed for unexpected reason."
            cat /tmp/create.log
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Sync secrets to Fly.io app
        # `--stage` saves secrets without triggering an immediate redeploy.
        run: |
          flyctl secrets set --stage --app "${{ inputs.app_name }}" \
            API_KEY='${{ secrets.API_KEY }}' \
            R2_ACCOUNT_ID='${{ secrets.R2_ACCOUNT_ID }}' \
            R2_ACCESS_KEY_ID='${{ secrets.R2_ACCESS_KEY_ID }}' \
            R2_SECRET_ACCESS_KEY='${{ secrets.R2_SECRET_ACCESS_KEY }}' \
            R2_TILE_PREFIX='${{ inputs.tile_prefix }}' \
            SELF_URL="https://${{ inputs.app_name }}.fly.dev"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        # Run from container-render/ so the Docker build context contains
        # Dockerfile + server.js + package.json + fly.toml.
        working-directory: container-render
        run: |
          flyctl deploy \
            --app "${{ inputs.app_name }}" \
            --remote-only \
            --strategy immediate \
            --wait-timeout 600
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment
        run: |
          echo "Waiting 15s for app to fully start..."
          sleep 15
          echo "Hitting /api/health on https://${{ inputs.app_name }}.fly.dev"
          curl -sf "https://${{ inputs.app_name }}.fly.dev/api/health" | tee /tmp/health.json
          echo ""
          if grep -q '"renderer":"mupdf-mutool-s107"' /tmp/health.json; then
            echo "✅ New mupdf renderer is live."
          else
            echo "⚠️  Health endpoint returned but renderer label is unexpected — check manually."
            exit 1
          fi
