name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      regenerate_baselines:
        description: 'Visual regression: regenerate baselines instead of testing against them. Output PNGs are uploaded as artifact for download/commit.'
        required: false
        type: boolean
        default: false

jobs:
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      # S129 Item 4.3 — coverage gate. Threshold defined in vitest.config.js
      # (50/60/50/50). Fails the run if any tested file regresses below.
      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  contracts:
    name: Contract tests (real Supabase + R2)
    runs-on: ubuntu-latest
    # Contract tests intentionally hit production. Failures here indicate
    # shape drift between mocks and reality. Non-blocking for now — they
    # report status but don't fail the workflow's required status.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run contract tests
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run test:contracts

  # S129 Item 4.1 — Playwright E2E foundation.
  # Tests run against the LIVE deployed Pages site (no local server
  # orchestration needed). Foundation scope: smoke tests for index/FRT/Hub
  # boot + zero JS errors, on Chromium desktop and Pixel 5 mobile.
  #
  # NON-BLOCKING on first deploy — same pattern as contract tests. Flip
  # to required once we've watched a few runs. Auth-required tests and
  # viewer/gesture tests come in follow-up phases.
  #
  # S129 Item 4.2 — Visual regression tests bundled in same job. RUN_VISUAL=1
  # opts them in. Carlito font installed below for baseline stability.
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # S129 Item 4.2 — Visual regression baseline stability.
      # Carlito is metric-compatible with Calibri (same glyph widths). Without
      # it Chromium falls back to DejaVu and the committed baselines don't
      # match. Real Calibri (ttf-mscorefonts-installer) requires EULA
      # acceptance; Carlito is the right open-source equivalent.
      - name: Install Calibri-compatible fonts (Carlito)
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # S130 Item 4.2 — Visual baseline regeneration on CI.
      # Normal runs: execute visual tests against committed PNG baselines.
      # workflow_dispatch with regenerate_baselines=true: regenerate the PNGs
      # under CI's exact font rendering (Carlito), then upload as artifact.
      # Mark downloads the zip → drops into e2e/visual.spec.js-snapshots/ →
      # commits → pushes. Eliminates the local-vs-CI font-parity problem and
      # makes CI's environment the single source of truth for baselines.
      - name: Run E2E tests (smoke + visual)
        if: github.event_name != 'workflow_dispatch' || inputs.regenerate_baselines != true
        env:
          RUN_VISUAL: '1'
        run: npm run test:e2e

      - name: Regenerate visual baselines (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.regenerate_baselines == true
        run: npm run test:e2e:visual:update

      - name: Upload regenerated baselines (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.regenerate_baselines == true
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-regenerated
          path: e2e/visual.spec.js-snapshots/
          retention-days: 30

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
