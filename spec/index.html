<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARENCON · Specification Generator</title>
<script src="../shared/auth-gate.js"></script>
<style>
:root, [data-theme="dark"] {
  --b-chrome-bg:#1d1b24; --b-chrome-rule:rgba(244,243,246,.14); --b-chrome-hover:rgba(255,255,255,.07);
  --b-chrome-fg:#f4f3f6; --b-chrome2:#25222d; --b-btn-shadow:0 1px 3px rgba(0,0,0,.5);
  --brand:#C9476A; --ok:#3FD08A; --fail:#E26076; --warn:#E0A36A; --info:#46C5E8;
  --ink:#f4f3f6; --ink2:#a09aa8; --ink3:#6b6674;
  --bg:#0b0a0d; --line:rgba(255,255,255,.10); --sw-off:#2a2731;
  --surface:#16141c; --surface2:#1d1b24; --surface3:#262330; --deck:#0b0a0d;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
[data-theme="light"] {
  --b-chrome-bg:#E6E3E9; --b-chrome-rule:#D2CEDB; --b-chrome-hover:rgba(0,0,0,.05);
  --b-chrome-fg:#1B1A22; --b-chrome2:#EFEDF0; --b-btn-shadow:0 1px 2px rgba(0,0,0,.08);
  --brand:#9C2742; --ok:#2E9E72; --fail:#C0445F; --warn:#C98A4A; --info:#2C7FB8;
  --ink:#1B1A22; --ink2:#5E5B68; --ink3:#928E9C;
  --bg:#EFEDF0; --line:rgba(27,26,34,.12); --sw-off:#cfcbd6;
  --surface:#F4F2F6; --surface2:#E6E3E9; --surface3:#DAD6DF; --deck:#C9C5D0;
  --shadow:0 8px 28px rgba(27,26,34,.10);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
body{font:11pt/1.5 Calibri,Carlito,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);
     --chrome-h:100px;--rail-w:300px;--insp-w:300px}
button,input,select,textarea{font:inherit;color:inherit}

/* chrome — the bar itself is drawn by the shared engine inside a shadow root.
   The host owns only where it sits. Nothing else here styles the header, and
   that emptiness is the proof the conversion is real rather than a lookalike. */
#spec-header{position:fixed;inset:0 0 auto 0;z-index:600}
.spacer{flex:1 1 auto;min-width:0}
.cbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;background:transparent;
      border:1px solid var(--b-chrome-rule);border-radius:8px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.cbtn:hover{background:var(--b-chrome-hover);color:var(--ink)}
.cbtn.icon{width:32px;padding:0;justify-content:center}
.cbtn.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
/* .stat survives the header deletion: the master counts move OUT of the bar
   and into the rail, beside the sections they describe. Wrapping is allowed
   there — it is a paragraph now, not a single-line status strip. */
.stat{color:var(--ink2);font-size:10pt}
.stat b{color:var(--ink);font-weight:600}
.primary{height:32px;padding:0 16px;border:0;border-radius:8px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
.primary:disabled{background:var(--sw-off);color:var(--ink3);cursor:not-allowed}

/* work area */
#work{position:fixed;left:0;right:0;bottom:0;top:var(--chrome-h);
      display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr) var(--insp-w);overflow:hidden}
.panel{background:var(--surface);overflow-y:auto;position:relative}
.rail{border-right:1px solid var(--line)}
.inspector{border-left:1px solid var(--line)}
body[data-rail="fold"]{--rail-w:46px}
body[data-insp="fold"]{--insp-w:46px}
.strip{display:none;position:absolute;inset:0;cursor:pointer;align-items:flex-start;justify-content:center;padding-top:14px}
.strip{padding-top:52px}
.strip span{writing-mode:vertical-rl;letter-spacing:.10em;font-size:9.5pt;color:var(--ink3);text-transform:uppercase}
body[data-rail="fold"] .rail .strip,body[data-insp="fold"] .inspector .strip{display:flex}
body[data-rail="fold"] .rail .body,body[data-insp="fold"] .inspector .body{display:none}
/* The counts fold away with the sections they describe — a folded rail must
   collapse to the strip and nothing else, or the fold buys no width back. */
body[data-rail="fold"] .rail .railhead{display:none}
.railhead{padding:12px 12px 0;border-bottom:1px solid var(--line);padding-bottom:12px}
.railhead .stat{line-height:1.6}
.dochdr-btn{display:block;width:100%;text-align:left;margin:0 0 10px;padding:9px 11px;
  border:1px solid var(--line);border-radius:9px;background:var(--surface2);
  color:var(--ink);font:600 10.5pt Calibri,sans-serif;cursor:pointer}
.dochdr-btn:hover{border-color:var(--brand)}
.dochdr-btn .miss{display:block;font-weight:400;font-size:9.5pt;color:var(--warn);margin-top:3px}
.dochdr-btn .set{display:block;font-weight:400;font-size:9.5pt;color:var(--ink3);margin-top:3px}
/* Form grid for the Document details panel. Two columns on a desktop screen,
   one on anything narrow — the panel is reachable from a tablet too. */
.dh-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.dh-grid .wide{grid-column:1 / -1}
.dh-f label{display:block;font-size:9.5pt;color:var(--ink2);margin-bottom:4px}
.dh-f input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--ink);font:11pt Calibri,sans-serif}
.dh-f input:focus{outline:none;border-color:var(--brand)}
.dh-f .hint{font-size:9pt;color:var(--ink3);margin-top:4px}
@media (max-width:640px){.dh-grid{grid-template-columns:1fr}}
.edge{position:absolute;top:8px;z-index:5;width:22px;height:34px;border:1px solid var(--line);
      background:var(--surface2);color:var(--ink3);cursor:pointer;border-radius:6px;font-size:11px;line-height:1}
.rail .edge{right:-1px;border-radius:6px 0 0 6px}
.inspector .edge{left:-1px;border-radius:0 6px 6px 0}
.body{padding:12px 12px 24px}

/* section list */
.sec{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink2)}
.sec:hover{background:var(--b-chrome-hover);color:var(--ink)}
.sec.on{background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--ink);
        outline:1px solid color-mix(in srgb,var(--brand) 40%,transparent)}
.sec .code{font:9.5pt ui-monospace,Consolas,monospace;color:var(--ink3);flex:none;width:74px}
.sec .t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.divh{font-size:9pt;letter-spacing:.10em;text-transform:uppercase;color:var(--ink3);margin:14px 0 4px 10px}
.pill{flex:none;font-size:8.5pt;padding:1px 7px;border-radius:20px;border:1px solid}
.pill.approved{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pill.draft{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pill.carried{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent);background:color-mix(in srgb,var(--info) 12%,transparent)}
.sec.off{opacity:.45}
.sec .fixed{flex:none;color:var(--ink3);font-size:8pt}
.sw{flex:none;width:32px;height:18px;border-radius:10px;background:var(--sw-off);border:0;position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{transform:translateX(14px)}
.pill.empty{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 45%,transparent);background:color-mix(in srgb,var(--fail) 12%,transparent)}

/* paper — matches the generated Word file: Letter, 1in sides, running header */
.paper-col{overflow-y:auto;overflow-x:hidden;background:var(--deck);padding:22px 0 90px}
.stage{transform-origin:top center}
.page{width:8.5in;height:11in;margin:0 auto 22px;padding:1in 0.75in 0.4in;background:#fff;color:#1B1A22;
      box-shadow:0 6px 26px rgba(0,0,0,.35);font:11pt/1.42 Calibri,Carlito,sans-serif;
      position:relative;overflow:hidden}
.pg-head{position:absolute;left:0.75in;right:0.75in;top:0.72in;font-size:11pt;color:#1B1A22;
         border-bottom:.5pt solid #000;padding-bottom:2px}
.pg-head .r{display:flex;gap:10px;line-height:1.25}
/* Rows 2 and 3 are the supporting lines in the firm's header block: smaller
   and quieter than row 1 so the client and section stay the things you read
   first. Empty middle cells still hold their column so the right-hand values
   stay aligned down all three rows. */
.pg-head .r + .r{font-size:9.5pt;color:#5E5B68}
.pg-head .r span:first-child{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap}
.pg-head .r .c{flex:0 0 auto}
.pg-head .r .e{margin-left:auto;text-align:right;flex:0 0 auto}
.sec-title{font-weight:700;margin:0 0 0 0}
.eos{font-weight:700;text-align:center;margin:0}
/* ladder: each level's NUMBER starts where its parent's TEXT starts */
.ln{display:grid;align-items:start;column-gap:0;padding:0}
.ln .num{font-variant-numeric:tabular-nums}
.ln .tx{min-width:0}
.ln[data-lvl="1"]{grid-template-columns:.5in minmax(0,1fr);margin-left:0}
.ln[data-lvl="2"]{grid-template-columns:.5in minmax(0,1fr);margin-left:.5in}
.ln[data-lvl="3"]{grid-template-columns:.5in minmax(0,1fr);margin-left:1in}
.ln[data-lvl="4"]{grid-template-columns:.75in minmax(0,1fr);margin-left:1.5in}
.ln[data-lvl="5"]{grid-template-columns:.9in minmax(0,1fr);margin-left:2.25in}
.ln[data-lvl="1"] .tx,.ln[data-lvl="2"] .tx{font-weight:700}
.ln.sel{background:color-mix(in srgb,var(--brand) 12%,transparent);
        outline:1px solid color-mix(in srgb,var(--brand) 40%,transparent)}
.ln.draft .tx{box-shadow:inset 3px 0 0 var(--warn);padding-left:6px}
.ln.carried .tx{box-shadow:inset 3px 0 0 var(--info);padding-left:6px}
.ln.empty .tx{box-shadow:inset 3px 0 0 var(--fail);padding-left:6px;color:#7a7684}
.ln.free{display:grid;grid-template-columns:minmax(0,1fr)}
.ln.free.bul{grid-template-columns:.25in minmax(0,1fr)}
.ln.free .dot{text-align:left}
.spec-tbl{border-collapse:collapse;margin:0 auto;width:5.8in}
.spec-tbl td{border:.5pt solid #000;padding:2px 6px;font-size:11pt;text-align:center}
.spec-tbl td.h{font-weight:700;text-decoration:underline}
.spec-tbl td.l{text-align:left}
.blank{height:15.6px}
.tx[contenteditable="true"]{outline:2px solid var(--info);outline-offset:3px;border-radius:3px;background:#fff}
.edhint{font-size:9pt;color:#6b6674;padding:3px 0 2px .5in}
.edhint kbd{font:9pt ui-monospace,Consolas,monospace;background:#eceaf0;border:1px solid #d6d2dc;border-radius:4px;padding:0 4px}
.empty-state{color:var(--ink3);text-align:center;padding:60px 20px}

/* inspector */
.insp-h{font-size:9pt;letter-spacing:.10em;text-transform:uppercase;color:var(--ink3);margin:16px 0 6px}
.insp-h:first-child{margin-top:0}
.mono{font:10pt ui-monospace,Consolas,monospace;color:var(--ink2);word-break:break-all}
.note{border:1px solid color-mix(in srgb,var(--info) 35%,transparent);background:color-mix(in srgb,var(--info) 10%,transparent);
      border-radius:10px;padding:10px 12px;font-size:10pt}
.hist{font-size:10pt;color:var(--ink2);padding:5px 0;border-top:1px solid var(--line)}
.hist b{color:var(--ink);font-weight:600}

/* overlays */
.veil{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.card{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(560px,92vw);box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:13pt}
.card p{color:var(--ink2);margin:0 0 14px}
.fld{width:100%;height:34px;padding:0 10px;background:var(--surface3);color:var(--ink);
     border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.drop{border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--ink3);cursor:pointer}
.drop.over{border-color:var(--brand);color:var(--ink)}
.msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:950;background:var(--surface3);
     border:1px solid var(--line);border-radius:20px;padding:7px 16px;font-size:10pt;box-shadow:var(--shadow);
     opacity:0;pointer-events:none;transition:opacity .18s}
.msg.on{opacity:1}
.err{color:var(--fail)}
</style>
</head>
<body data-rail="open" data-insp="open">

<!-- SHARED HEADER ENGINE MOUNT. The hand-rolled two-row bar that used to live
     here is gone on purpose — it was a second header system imitating the one
     the toolkit already has. Everything it carried now comes from
     lib/ui/headerEngine2.js via lib/ui/specHeaderConfig.js. -->
<div id="spec-header"></div>

<div id="work">
  <aside class="panel rail" id="rail">
    <button class="edge" id="edgeRail" title="Hide sections">◀</button>
    <div class="strip" data-open="rail"><span>Sections</span></div>
    <!-- The master counts used to be a single ellipsised line in the header's
         second row, where they competed with the buttons and got truncated.
         They describe the sections, so they live above the sections. -->
    <div class="railhead">
      <!-- The job data has to live SOMEWHERE the user can reach it. This is
           that place: it sits above the sections because it applies to all of
           them, and it shows what is still blank rather than hiding it. -->
      <button class="dochdr-btn" id="btnDocHdr">Document details&hellip;</button>
      <div class="stat" id="railStat">Loading&hellip;</div>
    </div>
    <div class="body" id="railBody"></div>
  </aside>

  <section class="paper-col" id="paperCol">
    <div class="stage" id="stage"><div id="pages"></div></div>
  </section>

  <aside class="panel inspector" id="insp">
    <button class="edge" id="edgeInsp" title="Hide review">▶</button>
    <div class="strip" data-open="insp"><span>Review</span></div>
    <div class="body" id="inspBody"></div>
  </aside>
</div>

<div class="msg" id="msg"></div>

   under the toolkit's shared keys. This tool never asks for a password. */
const TOK_KEY = 'sb-access-token';

const sb = (() => {
  const token = () => { try { return localStorage.getItem(TOK_KEY); } catch { return null; } };

  const head = (extra) => Object.assign({
    apikey: SUPA_KEY,
    Authorization: 'Bearer ' + (token() || SUPA_KEY),
    'Content-Type': 'application/json',
  }, extra || {});

  async function rest(path, opts = {}) {
    const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, { ...opts, headers: head(opts.headers) });
    const text = await res.text();
    let body = null;
    try { body = text ? JSON.parse(text) : null; } catch { body = text; }
    if (!res.ok) throw new Error((body && body.message) || res.statusText || 'request failed');
    return { body, res };
  }

  return {
    get token() { return token(); },
    async me() {
      const res = await fetch(`${SUPA_URL}/auth/v1/user`,
        { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + token() } });
      if (!res.ok) return null;
      return res.json();
    },
    select: (table, query = '') => rest(`${table}?${query}`).then(r => r.body),
    insert: (table, rows) => rest(table, { method: 'POST',
      headers: { Prefer: 'return=minimal' }, body: JSON.stringify(rows) }).then(() => true),
    update: (table, match, patch) => rest(`${table}?${match}`, { method: 'PATCH',
      headers: { Prefer: 'return=minimal' }, body: JSON.stringify(patch) }).then(() => true),
    /* Insert-or-update in one round trip, resolved on the table's primary key.
       Needed because the document header is a single row per scope that must
       be created the first time and overwritten every time after, and doing
       that as select-then-insert-or-update races with a second tab. */
    upsert: (table, row) => rest(table, { method: 'POST',
      headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(row) }).then(() => true),
  };
})();

/* ── messages: never a browser alert ─────────────────────────────────── */
let msgT;
function msg(t, bad) {
  const m = $('#msg'); m.textContent = t; m.classList.toggle('err', !!bad); m.classList.add('on');
  clearTimeout(msgT); msgT = setTimeout(() => m.classList.remove('on'), 2600);
}
const nowTor = () => new Date().toLocaleString('en-CA',

/* ── numbering follows the source document ───────────────────────────────
   Numbers are still never STORED — they are computed here every render, so
   moving or deleting a clause renumbers everything below it. What changed is
   HOW they are computed.

   Counting tree position cannot reproduce Word. Where a source document jumps
   from Part straight to a clause with no article between, the tree has no rung
   at the middle level to count, so counting produced 1.1 where the Word file
   prints 1.1.1. Word does not count position: it keeps a counter per outline
   level and prints every rung, substituting 1 for any rung that has no item of
   its own. A clause carries its own level from the document it came from
   (source_level), so that is what drives the number.

   Clauses authored inside the tool have no source level. For those, depth in
   the tree is the level — which is the same answer, because nothing the tool
   creates can skip a rung. */
function numbered(rows) {
  const kids = new Map();
  rows.forEach(r => {
    const k = r.parent_id || '_root';
    if (!kids.has(k)) kids.set(k, []);
    kids.get(k).push(r);
  });
  kids.forEach(a => a.sort((x, y) => x.sort_order - y.sort_order));
  const out = [];
  const count = [];          // count[i] = current number at outline level i+1
  (function walk(parent, depth) {
    const list = kids.get(parent) || [];
    for (const r of list) {
      const isNum = ['part', 'article', 'clause'].includes(r.kind);
      let num = '', lvl = depth;
      if (isNum) {
        lvl = r.source_level || depth;
        count[lvl - 1] = (count[lvl - 1] || 0) + 1;
        count.length = lvl;                       // a number resets all deeper levels
        /* Fill any rung with no item of its own with 1 — this is the step that
           reproduces the source, and the reason a clause can read 1.1.1 in a
           section that has no 1.1 heading. */
        num = Array.from({ length: lvl }, (_, i) => count[i] || 1).join('.');
      }
      out.push({ ...r, num, lvl });
      walk(r.id, isNum ? lvl + 1 : depth);
    }
  })('_root', 1);
  return out;
}

/* ── render ──────────────────────────────────────────────────────────── */
function renderRail() {
  const byDiv = {};
  state.sections.forEach(s => (byDiv[s.division] = byDiv[s.division] || []).push(s));
  const counts = (s) => {
    const p = s._counts || {};
    const worst = p.empty ? 'empty' : p.draft ? 'draft' : p.carried ? 'carried' : 'approved';
    const n = (p.approved || 0) + (p.draft || 0) + (p.carried || 0) + (p.empty || 0);
    return `<span class="pill ${worst}">${n || 0}</span>`;
  };
  $('#railBody').innerHTML = Object.keys(byDiv).sort().map(d =>
    `<div class="divh">Division ${d}</div>` + byDiv[d].map(s => {
      const sys = !!s.system_tag;
      const on = !sys || state.systems[s.system_tag] !== false;
      return `<div class="sec ${on ? '' : 'off'}" data-id="${s.id}" data-code="${s.code}"
                   data-tag="${s.system_tag || ''}">
        <span class="code">${s.code}</span>
        <span class="t">${s.title}</span>
        ${counts(s)}
        ${sys ? `<button class="sw" data-tag="${s.system_tag}" aria-checked="${on}"
                   title="Include this system"></button>`
              : '<span class="fixed" title="Template section — always included">■</span>'}
      </div>`;
    }).join('')).join('');
}

/* The document is the WHOLE master, in section order — the same thing the
   Word file prints. Template sections are always present; only sections that
   belong to a system can be switched off. */
function activeSections() {
  return state.sections.filter(s => !s.system_tag || state.systems[s.system_tag] !== false);
}

/* ── running page header ─────────────────────────────────────────────────
   Three rows, laid out to match the header block in the firm's Word template:

     row 1   ARENCON INC. — <client>        <section title>  Section <code>
     row 2   <doc title>                                     Page <n>
     row 3   <site>, <city>                 Project #: <no> <rev>   <date>

   Every left-hand value is job data the user enters once in Document details;
   every right-hand value is document position and fills itself. A field left
   blank collapses rather than printing a stray separator, so a half-filled
   header still reads as a header instead of as a fault. */
const secTitle = code => (state.sections.find(s => s.code === code) || {}).title || '';

/* Toronto local, long form — matches the date written on the firm's covers.
   Parsed as a plain calendar date, NOT as an instant: 'YYYY-MM-DD' through
   the Date constructor is read as UTC midnight, which prints as the PREVIOUS
   day for everyone in Eastern Time. */
function issueDateLong(iso) {
  if (!iso) return '';
  const [y, m, d] = String(iso).split('-').map(Number);
  if (!y || !m || !d) return '';
  return new Date(y, m - 1, d).toLocaleDateString('en-CA',
    { year: 'numeric', month: 'long', day: 'numeric' });
}

const HEAD_HTML = (sec, page) => {
  const h = state.header || {};
  /* NO "ARENCON INC." HERE (Mark, this session). The running header identifies
     the JOB, not the firm — the firm's identity belongs on the cover and in the
     letterhead, and repeating it on every page costs the line that should carry
     the client. The A03 draft and 7033.11 both put the firm's name here; both
     are wrong, and 7310.17 governs. Left column is client, then document, then
     where the work is. */
  const who = h.client || 'Master Content';
  const where = [h.site, h.city].filter(Boolean).join(', ');
  const proj = [h.project_no, h.revision].filter(Boolean).join(' ');
  return `<div class="pg-head">
    <div class="r"><span>${escapeHtml(who)}</span>
      <span class="c">${escapeHtml(secTitle(sec))}</span>
      <span class="e">Section ${sec}</span></div>
    <div class="r"><span>${escapeHtml(h.doc_title || '')}</span>
      <span class="c"></span><span class="e">Page ${page}</span></div>
    <div class="r"><span>${escapeHtml(where)}</span>
      <span class="c">${escapeHtml(issueDateLong(h.issue_date))}</span>
      <span class="e">${proj ? 'Project #: ' + escapeHtml(proj) : ''}</span></div>
  </div>`;
};

/* ── document details ────────────────────────────────────────────────────
   The job data behind every page header, and later the cover and the TOC.
   Entered once, applied everywhere: change the revision here and all 23
   sections reprint with it. Scope is the project in project mode, or the
   literal 'MASTER' for firm master content, so a job's details can never
   leak into the master or into another job. */
const HDR_SCOPE = () => PROJECT || 'MASTER';

const DH_FIELDS = [
  ['client',       'Client / Owner',       'Full legal name, as it appears on the contract.', 'wide'],
  ['short_client', 'Short name for header','Fits the running header — e.g. a plant or site name.', 'wide'],
  ['site',         'Site address',         '', ''],
  ['city',         'City, Province',       '', ''],
  ['project_no',   'Project number',       'e.g. 7310.17', ''],
  ['revision',     'Revision',             'e.g. B01 — kept separate from the project number.', ''],
  ['doc_title',    'Document title',       'Prints on the header and the cover.', 'wide'],
];

async function loadDocHeader() {
  try {
    const rows = await sb.select('sg_doc_header',
      `select=*&scope=eq.${encodeURIComponent(HDR_SCOPE())}&limit=1`);
    state.header = rows[0] || { scope: HDR_SCOPE() };
  } catch { state.header = { scope: HDR_SCOPE() }; }
  /* A spec issued with no date is a spec nobody can place in a sequence, so
     today is offered rather than left blank. It is only a DEFAULT — it is not
     written to the database until the user saves, so nothing is invented on
     their behalf behind their back. Today in Toronto, never UTC: after 8pm
     Eastern a UTC date is already tomorrow. */
  if (!state.header.issue_date) state.header.issue_date = todayTor();
  renderDocHdrBtn();
}

const todayTor = () => new Intl.DateTimeFormat('en-CA',
  { timeZone: 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit' })
  .format(new Date());

function renderDocHdrBtn() {
  const b = $('#btnDocHdr'); if (!b) return;
  const h = state.header || {};
  const missing = DH_FIELDS.filter(f => !h[f[0]]).length;
  b.innerHTML = 'Document details&hellip;' + (missing
    ? `<span class="miss">${missing} field${missing > 1 ? 's' : ''} still blank — the page header is incomplete</span>`
    : `<span class="set">${escapeHtml(h.project_no || '')} ${escapeHtml(h.revision || '')} · ${escapeHtml(h.client || '')}</span>`);
}

async function docHeaderScreen() {
  /* The dialog engine is the toolkit's ONLY dialog. No confirm(), no alert(),
     and no per-tool lookalike panel. */
  const { Dlg } = await import('../lib/ui/dialogEngine.js');
  const h = Object.assign({}, state.header || {});
  const field = ([key, label, hint, cls]) => `
    <div class="dh-f ${cls}"><label for="dh-${key}">${label}</label>
      <input id="dh-${key}" type="text" value="${escapeHtml(h[key] || '')}">
      ${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
  Dlg.panel({
    title: 'Document details', icon: '¶', accent: 'slate', width: 720,
    build(bd) {
      bd.innerHTML = `<div class="dh-grid">
        ${DH_FIELDS.map(field).join('')}
        <div class="dh-f"><label for="dh-issue_date">Date of issuance</label>
          <input id="dh-issue_date" type="date" value="${escapeHtml(h.issue_date || '')}">
          <div class="hint">Defaults to today — click to pick a date.</div></div>
      </div>`;
      /* type="date" is the browser's own calendar: it opens on click, it is
         reachable by keyboard, and it hands back an unambiguous YYYY-MM-DD
         rather than a typed string whose format we would have to guess. */
    },
    buttons: [
      { label: 'Cancel', kind: 'cancel' },
      { label: 'Save', kind: 'primary', async onClick(api) {
          const patch = { scope: HDR_SCOPE(), updated_at: new Date().toISOString() };
          DH_FIELDS.forEach(([k]) => {
            const el = $('#dh-' + k, api.body); patch[k] = el ? el.value.trim() : '';
          });
          const d = $('#dh-issue_date', api.body);
          patch.issue_date = (d && d.value) ? d.value : null;
          try { patch.updated_by = state.me.id; } catch {}
          try {
            await sb.upsert('sg_doc_header', patch);
            state.header = patch;
            renderDocHdrBtn();
            renderPage();          /* every page header reprints immediately */
            setFresh(true);
            msg('Document details saved.');
            api.close();
          } catch (e) { msg('Could not save — you may not have permission.', true); }
          return false;            /* the panel closes on success, not on click */
        } },
    ],
  });
}

function tableHtml(r) {
  let t; try { t = JSON.parse(r.body); } catch { return ''; }
  const cell = (v, head, left) =>
    `<td class="${head ? 'h' : ''} ${left ? 'l' : ''}">${escapeHtml(v)}</td>`;
  return `<table class="spec-tbl" data-id="${r.id}">
    <tr>${(t.head || []).map(h => cell(h, true)).join('')}</tr>
    ${(t.rows || []).map(row => `<tr>${row.map((c, i) =>
      cell(String(c).replace(/\|\|/g, ' · '), false, i > 0)).join('')}</tr>`).join('')}
  </table>`;
}

function buildBlocks() {
  const blocks = [];
  for (const sec of activeSections()) {
    const rows = numbered(state.clauses.filter(c => c.section_id === sec.id));
    blocks.push({ section: sec.code, keepNext: true,
      html: `<div class="sec-title" data-sec="${sec.id}">Section ${sec.code} – ${escapeHtml(sec.title)}</div>` });
    if (!rows.length) {
      blocks.push({ section: sec.code, html: '<div class="blank"></div>' });
      blocks.push({ section: sec.code,
        html: `<div class="ln empty" data-lvl="3"><div class="num"></div><div class="tx">[-] No wording written for this section yet.</div></div>` });
    }
    rows.forEach(r => {
      for (let i = 0; i < (r.blank_before ?? 1); i++)
        blocks.push({ section: sec.code, keepNext: true, html: '<div class="blank"></div>' });
      const prov = r.provenance === 'approved' ? '' : r.provenance;
      const sel = state.sel === r.id ? 'sel' : '';

      if (r.kind === 'table') { blocks.push({ section: sec.code, id: r.id, html: tableHtml(r) }); return; }

      if (r.kind === 'para' || r.kind === 'bullet') {
        const ind = r.indent == null ? (r.lvl - 1) * 0.5 : r.indent;
        const bullet = r.kind === 'bullet';
        blocks.push({ section: sec.code, id: r.id,
          html: `<div class="ln free ${bullet ? 'bul' : ''} ${prov} ${sel}" data-id="${r.id}"
                   style="margin-left:${ind}in">${bullet ? '<div class="dot">\u2022</div>' : ''}<div class="tx">${escapeHtml(r.body)}</div></div>` });
        return;
      }

      const title = r.lvl <= 2 || (r.body.length <= 72 && !/[.,;:]$/.test(r.body));
      blocks.push({ section: sec.code, keepNext: title, id: r.id,
        html: `<div class="ln ${prov} ${sel}" data-lvl="${r.lvl}" data-id="${r.id}"><div class="num">${r.num}</div><div class="tx">${escapeHtml(r.body)}</div></div>` });
    });
    blocks.push({ section: sec.code, html: '<div class="blank"></div>' });
    blocks.push({ section: sec.code, html: `<div class="eos">END OF SECTION ${sec.code}</div>` });
    blocks.push({ section: sec.code, pageBreak: true, html: '' });
  }
  return blocks;
}

/* Lay the blocks into Letter pages. A block is never split, so a clause can
   never break across a page; keepNext travels with the block after it, so a
   heading is never stranded at a page foot. */
function paginate() {
  const host = $('#pages');
  host.innerHTML = '';
  const blocks = buildBlocks();
  if (!blocks.length) {
    host.innerHTML = '<div class="page"><div class="empty-state">Nothing to show.</div></div>';
    return;
  }
  const USABLE = (11 - 1 - 0.4) * 96;
  let page = null, used = 0, pageNo = 0;

  const newPage = (sec) => {
    pageNo++;
    page = document.createElement('div');
    page.className = 'page';
    page.innerHTML = HEAD_HTML(sec, pageNo);
    host.appendChild(page);
    used = 0;
  };
  newPage(blocks[0].section);

  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    if (b.pageBreak) { if (i < blocks.length - 1) newPage(blocks[i + 1].section); continue; }
    const holder = document.createElement('div');
    holder.innerHTML = b.html;
    const node = holder.firstElementChild;
    if (!node) continue;
    page.appendChild(node);
    let h = node.offsetHeight;

    if (b.keepNext && blocks[i + 1] && !blocks[i + 1].pageBreak) {
      const probe = document.createElement('div');
      probe.innerHTML = blocks[i + 1].html;
      const pn = probe.firstElementChild;
      if (pn) { page.appendChild(pn); h += pn.offsetHeight; page.removeChild(pn); }
    }
    if (used + h > USABLE && used > 0) {
      page.removeChild(node);
      newPage(b.section);
      page.appendChild(node);
      used = node.offsetHeight;
    } else {
      used += node.offsetHeight;
    }
  }
}

function renderPage() { paginate(); fitPage(); }

const escapeHtml = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function renderInspector() {
  const el = $('#inspBody');
  const r = state.clauses.find(c => c.id === state.sel);
  if (!r) {
    el.innerHTML = `<div class="insp-h">Review</div>
      <div style="color:var(--ink3);font-size:10pt">Click a clause. Everything known about it appears here —
      how it got into the master, whether it has been approved, and who changed it last.</div>`;
    return;
  }
  const provText = { approved: 'Approved firm wording (7310.17)', carried: 'Carried from 7033.11 — not reviewed',
                     draft: 'Drafted — never reviewed', empty: 'No wording written' }[r.provenance];
  el.innerHTML = `
    <div class="insp-h">Clause</div><div class="mono">${r.id.slice(0, 8)}</div>
    <div class="insp-h">Provenance</div>
    <div><span class="pill ${r.provenance}">${provText}</span></div>
    <div class="insp-h">Lock</div>
    <div style="font-size:10pt;color:var(--ink2)">${r.lock_level === 'master'
      ? 'Firm master — principals only' : 'Project scope — editable on a job'}</div>
    ${r.spec_note ? `<div class="insp-h">Guidance</div><div class="note">${escapeHtml(r.spec_note)}</div>` : ''}
    <div class="insp-h">History</div><div id="hist" class="hist">Loading…</div>`;
  loadHistory(r.id);
}

async function loadHistory(id) {
  let data = [];
  try {
    data = await sb.select('sg_clause_event',
      `select=action,at&clause_id=eq.${id}&order=at.desc&limit=6`);
  } catch {}

    : '<span style="color:var(--ink3)">No changes recorded yet.</span>';

/* ── editing on the page ─────────────────────────────────────────────── */
function canEdit() { return ['admin', 'super_admin'].includes(state.role); }

function startEdit(id) {
  if (!canEdit()) { msg('Master wording is principals only.', true); return; }
  const row = $(`.ln[data-id="${id}"]`); if (!row) return;
  const tx = $('.tx', row);
  const rec = state.clauses.find(c => c.id === id);
  state.editing = { id, before: rec.body };
  tx.textContent = rec.body;
  tx.setAttribute('contenteditable', 'true');
  tx.focus();
  const rg = document.createRange(); rg.selectNodeContents(tx); rg.collapse(false);
  const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg);
  const hint = document.createElement('div');
  hint.className = 'edhint'; hint.id = 'edhint';
  hint.innerHTML = '<kbd>Ctrl</kbd>+<kbd>Enter</kbd> save · <kbd>Esc</kbd> cancel';
  row.after(hint);
}

async function commitEdit(save) {
  const e = state.editing; if (!e) return;
  state.editing = null;
  $('#edhint')?.remove();
  const row = $(`.ln[data-id="${e.id}"]`);
  const tx = row && $('.tx', row);
  if (!tx) return;
  const val = tx.textContent.trim();
  tx.removeAttribute('contenteditable');
  if (!save || val === e.before) { renderPage(); return; }

  const rec = state.clauses.find(c => c.id === e.id);
  try {
    await sb.update('sg_clause', `id=eq.${e.id}`, {
      body: val, provenance: 'approved', approved_by: state.me.id,
      approved_at: new Date().toISOString(), updated_at: new Date().toISOString() });
    await sb.insert('sg_clause_event', {
      clause_id: e.id, section_code: currentCode(), action: 'edit',
      before: { body: e.before, provenance: rec.provenance },
      after: { body: val, provenance: 'approved' }, actor: state.me.id });
  } catch (err) { msg('Not saved: ' + err.message, true); renderPage(); return; }
  rec.body = val; rec.provenance = 'approved';
  renderPage(); renderInspector(); renderCounts();
  const back = $(`.ln[data-id="${e.id}"]`);
  if (back) back.scrollIntoView({ block: 'center' });
  setFresh(true);
  msg('Saved to the master. Published versions are unaffected.');
}

const currentCode = () => (state.sections.find(s => s.id === state.sectionId) || {}).code;

/* ── data ────────────────────────────────────────────────────────────── */
async function loadSections() {
  state.sections = await sb.select('sg_section', 'select=*&order=sort_order');
  await loadDocHeader();      /* page headers need this before the first paint */
  const counts = await sb.select('sg_clause', 'select=section_id,provenance');
  const map = {};
  (counts || []).forEach(c => {
    map[c.section_id] = map[c.section_id] || {};
    map[c.section_id][c.provenance] = (map[c.section_id][c.provenance] || 0) + 1;
  });
  state.sections.forEach(s => (s._counts = map[s.id] || {}));
}

async function loadAllClauses() {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const page = await sb.select('sg_clause',
      `select=*&order=section_id,sort_order&offset=${from}&limit=1000`);
    rows.push(...page);
    if (page.length < 1000) break;
  }
  state.clauses = rows;
}

function renderCounts() {
  const all = state.sections.reduce((a, s) => {
    Object.entries(s._counts || {}).forEach(([k, v]) => (a[k] = (a[k] || 0) + v)); return a; }, {});
  const sec = state.sections.find(s => s.id === state.sectionId);
  const local = state.clauses.filter(c => !sec || c.section_id === sec.id).length;
  $('#railStat').innerHTML = `<b>${state.sections.length}</b> sections · ` +
    `<b>${all.approved || 0}</b> approved · <b>${all.carried || 0}</b> carried · ` +
    `<b>${all.draft || 0}</b> drafted · <b>${all.empty || 0}</b> unwritten` +
    (sec ? `<br>${sec.code}: <b>${local}</b> clauses` : '');
}

/* Freshness is an ENGINE slot, not a host pill. Cloud status must always be
   visible (Bold canon) and the engine already paints it the same way on every
   tool, so this tool does not get to invent a second dialect for it. Times are
   Toronto local via nowTor() — never raw UTC. */
function setFresh(dirty) {
  const h = window.__specHdr; if (!h) return;
  try {
    h.setCloud({ visible: true, state: dirty ? 'sync' : 'ok', text: 'Cloud' });
    h.setSaveStamp(dirty ? `Saved ${nowTor()}` : `Loaded ${nowTor()}`);
  } catch {}
}

/* ── import ──────────────────────────────────────────────────────────── */
function importScreen() {
  if (!canEdit()) { msg('Import is principals only.', true); return; }
  const v = document.createElement('div');
  v.className = 'veil';
  v.innerHTML = `<div class="card">
    <h2>Import content</h2>
    <p>Drop the merged master file. Nothing is written until you confirm what it will do.</p>
    <div class="drop" id="drop">Drop a .json file here, or click to choose</div>
    <div id="preview" style="margin-top:14px;font-size:10pt;color:var(--ink2)"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="cbtn" id="cancel">Cancel</button>
      <button class="primary" id="apply" disabled>Import</button>
    </div></div>`;
  document.body.appendChild(v);
  let payload = null;
  const drop = $('#drop', v);
  const take = async (file) => {
    try {
      payload = JSON.parse(await file.text());
      const secs = payload.filter(n => n.kind === 'division').length;
      /* COUNT EVERYTHING, NOT JUST NUMBERED CLAUSES. The old preview showed
         only 'clause', so a file carrying hundreds of paragraphs, bullets and
         tables reported a number that looked like a loss. Showing the real
         mix is also the only way you can tell, before writing anything,
         whether the file lost items on the way in. */
      const k = (t) => payload.filter(n => n.kind === t).length;
      const cls = k('clause'), other = k('para') + k('bullet') + k('table');
      $('#preview', v).innerHTML =
        `<b>${secs}</b> sections · <b>${cls}</b> numbered clauses · ` +
        `<b>${other}</b> paragraphs, bullets and tables ` +
        `(<b>${cls + other}</b> items in total).<br>` +
        `Sections already in the master keep their existing clauses; only empty ones are filled. ` +
        `Nothing is deleted.`;
      $('#apply', v).disabled = false;
    } catch (err) { $('#preview', v).innerHTML = `<span class="err">Could not read that file.</span>`; }
  };
  drop.onclick = () => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.json';
    i.onchange = () => i.files[0] && take(i.files[0]); i.click();
  };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over');
                       e.dataTransfer.files[0] && take(e.dataTransfer.files[0]); };
  $('#cancel', v).onclick = () => v.remove();
  $('#apply', v).onclick = async () => {
    $('#apply', v).disabled = true;
    $('#preview', v).textContent = 'Importing…';
    try {
      const n = await runImport(payload, t => ($('#preview', v).textContent = t));
      v.remove(); await loadSections(); await loadAllClauses();
      renderRail(); renderPage(); renderCounts();
      msg(`Imported ${n} clauses.`);
    } catch (err) {
      $('#preview', v).innerHTML = `<span class="err">${err.message}</span>`;
      $('#apply', v).disabled = false;
    }
  };
}

async function runImport(nodes, progress) {
  const secByCode = Object.fromEntries(state.sections.map(s => [s.code, s]));
  let written = 0, cur = null, stack = {}, order = 0, batch = [];

  const flush = async () => {
    if (!batch.length) return;
    await sb.insert('sg_clause', batch);          // parents ride in the same insert
    written += batch.length; batch = [];
    progress(`Imported ${written} items…`);
  };

  for (const n of nodes) {
    if (n.kind === 'division') {
      await flush();
      const code = (n.text.match(/Section (\S+(?: \S+)*?) –/) || [])[1];
      cur = secByCode[code] || null; stack = {}; order = 0;
      if (cur) {
        const existing = await sb.select('sg_clause', `select=id&section_id=eq.${cur.id}&limit=1`);
        if (existing.length) cur = null;           // already populated: leave it alone
      }
      continue;
    }
    if (!cur || n.kind === 'enddiv') continue;

    const id = crypto.randomUUID();
    const blank = n.blank == null ? 1 : n.blank;
    /* PROVENANCE DEFAULT IS 'carried', NOT 'approved'. Importing content is
       not reviewing it. The old default silently asserted that every imported
       clause was Mark-reviewed 7310.17 wording, which no import can know — the
       merged files carry no record of which parent a clause came from. A false
       'approved' is unrecoverable (nothing later flags it); a 'carried' that
       should have been approved is one promotion away. */
    const shape = (over) => Object.assign({
      id, section_id: cur.id, parent_id: null, sort_order: ++order,
      kind: 'clause', body: '', lock_level: 'master',
      blank_before: blank, indent: null, provenance: 'carried',
    }, over);
    let row;

    if (n.kind === 'clause') {
      const lvl = n.level;
      const body = (n.runs || []).map(r => r[0]).join('').trim();
      /* PARENT = NEAREST SHALLOWER LEVEL THAT IS ACTUALLY OPEN. Demanding
         exactly lvl-1 detached whole runs of clauses: several sections jump
         from Part straight to clause with no article between, and every one
         of those landed at the root instead of under its Part. An orphan here
         is not cosmetic — the tree is what derives the printed numbering. */
      const open = Object.keys(stack).map(Number).filter(k => k < lvl);
      row = shape({ parent_id: (open.length ? stack[Math.max(...open)] : null),
        kind: lvl === 1 ? 'part' : lvl === 2 ? 'article' : 'clause', body,
        provenance: n._drafted ? 'draft' : body.startsWith('[-]') ? 'empty' : 'carried' });
      stack[lvl] = id;
      Object.keys(stack).forEach(k => { if (+k > lvl) delete stack[k]; });
    } else if (n.kind === 'para' || n.kind === 'bullet') {
      // an unnumbered paragraph hangs off whatever clause it sits under
      const body = (n.runs || []).map(r => r[0]).join('').trim();
      if (!body) continue;
      const deepest = Math.max(0, ...Object.keys(stack).map(Number));
      row = shape({ parent_id: stack[deepest] || null, kind: n.kind, body,
        indent: n.x == null ? null : Math.round(((n.x - 72) / 72) * 100) / 100,
        provenance: n._drafted ? 'draft'
                  : body.startsWith('[-]') ? 'empty' : 'carried' });
    } else if (n.kind === 'table') {
      const deepest = Math.max(0, ...Object.keys(stack).map(Number));
      row = shape({ parent_id: stack[deepest] || null, kind: 'table',
        body: JSON.stringify({ head: n.head, rows: n.rows, style: n.style }) });
    } else continue;

    batch.push(row);
    if (batch.length >= 120) await flush();
  }
  await flush();
  return written;
}

/* ── layout plumbing ─────────────────────────────────────────────────── */
function measureChrome() {
  /* The engine's bar is one row, not the two the hand-rolled chrome had, and
     it can change height when controls fold on a narrow window. Measure it
     rather than assuming — a wrong number here puts the paper under the bar.
     The 54px floor covers the instant before the engine has painted. */
  const el = $('#spec-header');
  const h = Math.max(54, Math.ceil(el ? el.getBoundingClientRect().height : 0));
  document.body.style.setProperty('--chrome-h', h + 'px');
}
function fitPage() {
  const col = $('#paperCol'), stage = $('#stage'), host = $('#pages');
  const s = Math.min(1, Math.max(.55, (col.clientWidth - 24) / (8.5 * 96)));
  stage.style.transform = s < 1 ? `scale(${s.toFixed(4)})` : 'none';
  stage.style.marginBottom = s < 1 ? Math.round(-(1 - s) * (host.offsetHeight || 0)) + 'px' : '0px';
}
// Narrow windows fold the side panels rather than squeezing the page.
let narrow = null;
function fitWindow() {
  const n = innerWidth < 1400;
  if (n !== narrow) {
    narrow = n;
    document.body.setAttribute('data-rail', n ? 'fold' : 'open');
    document.body.setAttribute('data-insp', n ? 'fold' : 'open');
    $('#edgeRail').textContent = n ? '\u25b6' : '\u25c0';
    $('#edgeInsp').textContent = n ? '\u25c0' : '\u25b6';
  }
  measureChrome();
  requestAnimationFrame(fitPage);
}

function toggleFold(which) {
  const k = which === 'rail' ? 'data-rail' : 'data-insp';
  document.body.setAttribute(k, document.body.getAttribute(k) === 'fold' ? 'open' : 'fold');
  $('#edgeRail').textContent = document.body.getAttribute('data-rail') === 'fold' ? '▶' : '◀';
  $('#edgeInsp').textContent = document.body.getAttribute('data-insp') === 'fold' ? '◀' : '▶';
  fitPage();
}
/* THEME BRIDGE. The HOST owns painting and persistence; the engine's day/night
   button is mirrored to match. One source of truth, and 'arencon-theme' is the
   shared device key, so this tool agrees with every other ARENCON tool on the
   same device. Wiring the button straight to ctl.setTheme would let the button
   and the page disagree. */
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('arencon-theme', t); } catch {}
  try { window.__specHdr && window.__specHdr.setTheme(t); } catch {}
}

/* ── events ──────────────────────────────────────────────────────────── */
$('#railBody').addEventListener('click', e => {
  const sw = e.target.closest('.sw');
  if (sw) {
    const tag = sw.dataset.tag;
    state.systems[tag] = state.systems[tag] === false;
    renderRail(); renderPage();
    msg(state.systems[tag] === false
      ? 'System excluded — its section is out of the document.'
      : 'System included.');
    return;
  }
  const row = e.target.closest('.sec');
  if (!row) return;
  state.sectionId = row.dataset.id;
  const t = $(`.sec-title[data-sec="${row.dataset.id}"]`);
  if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' });
  else msg('That section is switched off.');
  renderCounts();
});
$('#pages').addEventListener('click', e => {
  const row = e.target.closest('.ln'); if (!row) return;
  const id = row.dataset.id;
  if (state.editing && state.editing.id === id) return;
  if (state.editing) commitEdit(true);
  if (state.sel === id) { startEdit(id); return; }
  state.sel = id;
  $$('.ln.sel').forEach(n => n.classList.remove('sel'));
  row.classList.add('sel');
  renderInspector();
});
document.addEventListener('keydown', e => {
  if (state.editing) {
    if (e.key === 'Escape') { e.preventDefault(); commitEdit(false); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commitEdit(true); }
  }
});
document.addEventListener('focusout', e => {
  if (state.editing && e.target.matches('.tx[contenteditable="true"]')) commitEdit(true);
});
$('#edgeRail').onclick = () => toggleFold('rail');
$('#edgeInsp').onclick = () => toggleFold('insp');
$$('.strip').forEach(s => (s.onclick = () => toggleFold(s.dataset.open)));
/* Theme / Import / Hub / Sign out / Publish are no longer host buttons. Their
   behaviour did not change — it moved into the shared header config, which is
   the only place those controls exist now. Sign out in particular is gone as a
   bare button on purpose: it lives in the engine's avatar menu, one deliberate
   step away rather than one mis-tap. */
function goBack() {
  location.href = PROJECT ? `../index.html?project=${PROJECT}` : '../index.html';
}
$('#btnDocHdr').onclick = docHeaderScreen;
addEventListener('resize', fitWindow);

/* ── shared header engine ────────────────────────────────────────────────
   Sealed engine + one per-tool config, the same shape as the Hub (S492) and
   the portal (S497c). A failure here must never take the tool down: if the
   module will not load you lose the bar, not the document — so the mount is
   guarded and boot() runs either way. */
async function mountHeader() {
  const { buildHeader2 }     = await import('../lib/ui/headerEngine2.js');
  const { specHeaderConfig } = await import('../lib/ui/specHeaderConfig.js');

  /* Help ships as the engine's own coming-soon state. No spec card set is
     Owner-reviewed yet, and a guide with nothing in it is worse than a guide
     that says so. */
  async function openHelp() {
    try {
      const { Dlg } = await import('../lib/ui/dialogEngine.js');
      window.Dlg = window.Dlg || Dlg;
      const { hasCards, comingSoonHtml, mountHelp } = await import('../lib/ui/helpEngine.js');
      window.Dlg.panel({
        title: 'Help & guide', icon: '?', accent: 'slate', width: 880,
        build(bd) {
          try {   /* the engine's shadow root blocks host CSS — link the sheet inside */
            const sr = bd.getRootNode();
            if (sr && sr.querySelector && !sr.querySelector('link[data-help-css]')) {
              const lk = document.createElement('link');
              lk.rel = 'stylesheet';
              lk.href = '/lib/ui/helpPanel.css?v=508a';
              lk.setAttribute('data-help-css', '1');
              sr.appendChild(lk);
            }
          } catch {}
          if (hasCards('spec')) { try { mountHelp(bd, { scope: 'spec' }); } catch {} }
          else { bd.innerHTML = comingSoonHtml('Specification Generator'); }
        }
      });
    } catch (e) { msg('Help is unavailable right now.', true); }
  }

  const cfg = specHeaderConfig({
    logoSrc: LOGO_SRC,
    onBack: goBack,
    onImport: importScreen,
    onPublish: () => msg('Publishing arrives with the version navigator.'),
    onHelp: openHelp,
    /* Flip the HOST, then mirror — setTheme() already does both. */
    onToggleTheme: () =>
      setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')
  });

  window.__specHdr = buildHeader2($('#spec-header'), cfg);
  try { window.__specHdr.setTheme(document.documentElement.getAttribute('data-theme')); } catch {}

  /* RE-FIT AFTER LAYOUT. The engine decides how many controls fit on the bar
     by measuring its container. Mounting happens before the three-pane shell
     has been laid out and while the sign-in veil is still up, so that first
     measurement sees almost no width and folds the logo and EVERY button away
     — which is why the bar arrived carrying only a title. Measuring once more
     after the browser has actually laid the page out is what puts them back.
     Guarded because a missing refit must not cost us the header entirely. */
  const refit = () => { try { window.__specHdr.refit(); } catch {} measureChrome(); fitWindow(); };
  requestAnimationFrame(() => requestAnimationFrame(refit));
  addEventListener('resize', refit);
  try { new ResizeObserver(refit).observe($('#spec-header')); } catch {}
  window.__specRefit = refit;   /* boot() calls this again once auth resolves */
  measureChrome(); fitWindow();
}

/* ── boot ────────────────────────────────────────────────────────────── */
async function boot() {
  try { setTheme(localStorage.getItem('arencon-theme') || 'dark'); } catch { setTheme('dark'); }
  try { await mountHeader(); }
  catch (e) { console.warn('[Spec] shared header failed to mount — document unaffected:', e); }
  measureChrome();
  if (!sb.token) { msg('Not signed in.', true); return; }   // the gate handles this
  state.me = await sb.me();
  if (!state.me) { msg('Session expired — reload to sign in again.', true); return; }
  let prof = null;
  try {
    const rows = await sb.select('profiles', `select=role,full_name&id=eq.${state.me.id}`);
    prof = rows[0] || null;
  } catch (err) { msg('Could not read your profile: ' + err.message, true); }
  state.role = prof?.role || 'inspector';
  /* WHERE YOU ARE goes in the engine's breadcrumb; WHO YOU ARE is the avatar,
     which the engine resolves and badges by role on its own. The old modeTag
     said both at once and repeated identity the avatar already carries. */
  try {
    window.__specHdr && window.__specHdr.setBreadcrumb(
      PROJECT
        ? [{ label: 'Project', onClick: goBack }, { label: 'Specification' }]
        : [{ label: 'Firm master' }]);
  } catch {}
  /* Publish stays disabled for anyone who cannot publish globally. Only
     principals put wording in front of every future job. */
  try { window.__specHdr && window.__specHdr.setControlHidden('publish', !canEdit()); } catch {}
  /* The veil is down and the panes are real by now — measure against the
     layout the user actually sees, not the one that existed at mount. */
  try { window.__specRefit && window.__specRefit(); } catch {}
  try {
    await loadSections();
  } catch (err) { msg('Could not load the master: ' + err.message, true); return; }
  renderRail(); renderCounts(); setFresh(false);
  await loadAllClauses();
  renderRail(); renderPage();
  fitWindow();
  setTimeout(fitWindow, 120);
}
boot();
</script>
</body>
</html>
