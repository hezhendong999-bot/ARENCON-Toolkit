<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARENCON · Specification Generator</title>
<script src="../shared/auth-gate.js"></script>
<style>
:root, [data-theme="dark"] {
  --b-chrome-bg:#1d1b24; --b-chrome-rule:rgba(244,243,246,.14); --b-chrome-hover:rgba(255,255,255,.07);
  --brand:#C9476A; --ok:#3FD08A; --fail:#E26076; --warn:#E0A36A; --info:#46C5E8;
  --ink:#f4f3f6; --ink2:#a09aa8; --ink3:#6b6674;
  --bg:#0b0a0d; --line:rgba(255,255,255,.10); --sw-off:#2a2731;
  --surface:#16141c; --surface2:#1d1b24; --surface3:#262330; --deck:#0b0a0d;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
[data-theme="light"] {
  --b-chrome-bg:#E6E3E9; --b-chrome-rule:#D2CEDB; --b-chrome-hover:rgba(0,0,0,.05);
  --brand:#9C2742; --ok:#2E9E72; --fail:#C0445F; --warn:#C98A4A; --info:#2C7FB8;
  --ink:#1B1A22; --ink2:#5E5B68; --ink3:#928E9C;
  --bg:#EFEDF0; --line:rgba(27,26,34,.12); --sw-off:#cfcbd6;
  --surface:#F4F2F6; --surface2:#E6E3E9; --surface3:#DAD6DF; --deck:#C9C5D0;
  --shadow:0 8px 28px rgba(27,26,34,.10);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
body{font:11pt/1.5 Calibri,Carlito,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);
     --chrome-h:100px;--rail-w:300px;--insp-w:300px}
button,input,select,textarea{font:inherit;color:inherit}

/* chrome */
#chrome{position:fixed;inset:0 0 auto 0;z-index:600;background:var(--b-chrome-bg);
        border-bottom:1px solid var(--b-chrome-rule);box-shadow:0 2px 12px rgba(0,0,0,.3)}
.rowA{display:flex;align-items:center;gap:14px;padding:0 16px;height:54px;border-bottom:1px solid var(--b-chrome-rule)}
.mark{display:flex;align-items:baseline;gap:7px}
.mark .a{font-weight:700;letter-spacing:.06em;font-size:12.5pt}
.mark .i{font-size:8pt;letter-spacing:.10em;color:var(--ink3)}
.rowA .sep{width:1px;height:22px;background:var(--b-chrome-rule)}
.rowA h1{font-size:12pt;font-weight:600;margin:0;white-space:nowrap}
.spacer{flex:1 1 auto;min-width:0}
.cbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;background:transparent;
      border:1px solid var(--b-chrome-rule);border-radius:8px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.cbtn:hover{background:var(--b-chrome-hover);color:var(--ink)}
.cbtn.icon{width:32px;padding:0;justify-content:center}
.cbtn.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.rowB{display:flex;align-items:center;gap:14px;padding:0 16px;height:44px;background:var(--surface2)}
.stat{color:var(--ink2);font-size:10pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{color:var(--ink);font-weight:600}
.freshness{display:inline-flex;align-items:center;gap:6px;font-size:9.5pt;color:var(--ink3);white-space:nowrap}
.freshness .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.freshness.dirty .dot{background:var(--warn)}
.primary{height:32px;padding:0 16px;border:0;border-radius:8px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
.primary:disabled{background:var(--sw-off);color:var(--ink3);cursor:not-allowed}

/* work area */
#work{position:fixed;left:0;right:0;bottom:0;top:var(--chrome-h);
      display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr) var(--insp-w);overflow:hidden}
.panel{background:var(--surface);overflow-y:auto;position:relative}
.rail{border-right:1px solid var(--line)}
.inspector{border-left:1px solid var(--line)}
body[data-rail="fold"]{--rail-w:46px}
body[data-insp="fold"]{--insp-w:46px}
.strip{display:none;position:absolute;inset:0;cursor:pointer;align-items:flex-start;justify-content:center;padding-top:14px}
.strip{padding-top:52px}
.strip span{writing-mode:vertical-rl;letter-spacing:.10em;font-size:9.5pt;color:var(--ink3);text-transform:uppercase}
body[data-rail="fold"] .rail .strip,body[data-insp="fold"] .inspector .strip{display:flex}
body[data-rail="fold"] .rail .body,body[data-insp="fold"] .inspector .body{display:none}
.edge{position:absolute;top:8px;z-index:5;width:22px;height:34px;border:1px solid var(--line);
      background:var(--surface2);color:var(--ink3);cursor:pointer;border-radius:6px;font-size:11px;line-height:1}
.rail .edge{right:-1px;border-radius:6px 0 0 6px}
.inspector .edge{left:-1px;border-radius:0 6px 6px 0}
.body{padding:12px 12px 24px}

/* section list */
.sec{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink2)}
.sec:hover{background:var(--b-chrome-hover);color:var(--ink)}
.sec.on{background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--ink);
        outline:1px solid color-mix(in srgb,var(--brand) 40%,transparent)}
.sec .code{font:9.5pt ui-monospace,Consolas,monospace;color:var(--ink3);flex:none;width:74px}
.sec .t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.divh{font-size:9pt;letter-spacing:.10em;text-transform:uppercase;color:var(--ink3);margin:14px 0 4px 10px}
.pill{flex:none;font-size:8.5pt;padding:1px 7px;border-radius:20px;border:1px solid}
.pill.approved{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pill.draft{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pill.carried{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent);background:color-mix(in srgb,var(--info) 12%,transparent)}
.pill.empty{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 45%,transparent);background:color-mix(in srgb,var(--fail) 12%,transparent)}

/* paper */
.paper-col{overflow-y:auto;overflow-x:hidden;background:var(--deck);padding:22px 0 90px}
.stage{transform-origin:top center}
.page{width:8.5in;min-height:11in;margin:0 auto 22px;padding:1in .75in;background:#fff;color:#1B1A22;
      box-shadow:0 6px 26px rgba(0,0,0,.35);font:11pt/1.42 Calibri,Carlito,sans-serif}
.pg-head{display:flex;gap:10px;font-size:9pt;color:#555;border-bottom:.5pt solid #999;padding-bottom:4px;margin-bottom:22px}
.pg-head .r{margin-left:auto;text-align:right}
.ln{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:6px;padding:1px 0;border-radius:4px}
.ln .num{font-variant-numeric:tabular-nums;text-align:left}
.ln .tx{min-width:0}
.ln[data-lvl="1"] .tx{font-weight:700}
.ln[data-lvl="2"] .tx{font-weight:700}
.ln[data-lvl="1"],.ln[data-lvl="2"]{grid-template-columns:44px minmax(0,1fr)}
.ln[data-lvl="2"]{margin-top:10px}
.ln[data-lvl="3"]{padding-left:36px}
.ln[data-lvl="4"]{padding-left:72px}
.ln[data-lvl="5"]{padding-left:108px}
.ln.sel{background:color-mix(in srgb,var(--brand) 12%,transparent);
        outline:1px solid color-mix(in srgb,var(--brand) 40%,transparent)}
.ln.draft .tx{box-shadow:inset 3px 0 0 var(--warn);padding-left:8px}
.ln.carried .tx{box-shadow:inset 3px 0 0 var(--info);padding-left:8px}
.ln.empty .tx{box-shadow:inset 3px 0 0 var(--fail);padding-left:8px;color:#7a7684}
.blank{height:13.4px}
.tx[contenteditable="true"]{outline:2px solid var(--info);outline-offset:3px;border-radius:3px;background:#fff}
.edhint{font-size:9pt;color:#6b6674;padding:3px 0 2px 44px}
.edhint kbd{font:9pt ui-monospace,Consolas,monospace;background:#eceaf0;border:1px solid #d6d2dc;border-radius:4px;padding:0 4px}
.empty-state{color:var(--ink3);text-align:center;padding:60px 20px}

/* inspector */
.insp-h{font-size:9pt;letter-spacing:.10em;text-transform:uppercase;color:var(--ink3);margin:16px 0 6px}
.insp-h:first-child{margin-top:0}
.mono{font:10pt ui-monospace,Consolas,monospace;color:var(--ink2);word-break:break-all}
.note{border:1px solid color-mix(in srgb,var(--info) 35%,transparent);background:color-mix(in srgb,var(--info) 10%,transparent);
      border-radius:10px;padding:10px 12px;font-size:10pt}
.hist{font-size:10pt;color:var(--ink2);padding:5px 0;border-top:1px solid var(--line)}
.hist b{color:var(--ink);font-weight:600}

/* overlays */
.veil{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.card{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(560px,92vw);box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:13pt}
.card p{color:var(--ink2);margin:0 0 14px}
.fld{width:100%;height:34px;padding:0 10px;background:var(--surface3);color:var(--ink);
     border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.drop{border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--ink3);cursor:pointer}
.drop.over{border-color:var(--brand);color:var(--ink)}
.msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:950;background:var(--surface3);
     border:1px solid var(--line);border-radius:20px;padding:7px 16px;font-size:10pt;box-shadow:var(--shadow);
     opacity:0;pointer-events:none;transition:opacity .18s}
.msg.on{opacity:1}
.err{color:var(--fail)}
</style>
</head>
<body data-rail="open" data-insp="open">

<div id="chrome">
  <div class="rowA">
    <span class="mark"><span class="a">ARENCON</span><span class="i">INC.</span></span>
    <span class="sep"></span>
    <h1>Specification Generator</h1>
    <span class="spacer"></span>
    <span id="modeTag" class="stat"></span>
    <button class="cbtn icon" id="btnTheme" title="Light / dark">☾</button>
    <button class="cbtn" id="btnHub">Hub</button>
    <button class="cbtn" id="btnOut">Sign out</button>
  </div>
  <div class="rowB">
    <span class="stat" id="stat">Loading…</span>
    <span class="spacer"></span>
    <span class="freshness" id="fresh"><span class="dot"></span><span id="freshT">—</span></span>
    <button class="cbtn" id="btnImport">Import…</button>
    <button class="primary" id="btnPublish" disabled>Publish…</button>
  </div>
</div>

<div id="work">
  <aside class="panel rail" id="rail">
    <button class="edge" id="edgeRail" title="Hide sections">◀</button>
    <div class="strip" data-open="rail"><span>Sections</span></div>
    <div class="body" id="railBody"></div>
  </aside>

  <section class="paper-col" id="paperCol">
    <div class="stage" id="stage"><div class="page" id="page"></div></div>
  </section>

  <aside class="panel inspector" id="insp">
    <button class="edge" id="edgeInsp" title="Hide review">▶</button>
    <div class="strip" data-open="insp"><span>Review</span></div>
    <div class="body" id="inspBody"></div>
  </aside>
</div>

<div class="msg" id="msg"></div>

<script type="module">
/* Supabase reached over plain fetch — no CDN module, nothing to load at
   runtime, and the tool keeps working if a third-party host is down. */
const SUPA_URL = 'https://xsemvinxsyphjiaqgywv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzZW12aW54c3lwaGppYXFneXd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyNzkxNzMsImV4cCI6MjA4ODg1NTE3M30.1WhVv3kPeO0igzcZswbNT-u1tUvEKNP6lk1DivKoDHU';
/* The universal auth gate has already signed the user in and stored the token
   under the toolkit's shared keys. This tool never asks for a password. */
const TOK_KEY = 'sb-access-token';

const sb = (() => {
  const token = () => { try { return localStorage.getItem(TOK_KEY); } catch { return null; } };

  const head = (extra) => Object.assign({
    apikey: SUPA_KEY,
    Authorization: 'Bearer ' + (token() || SUPA_KEY),
    'Content-Type': 'application/json',
  }, extra || {});

  async function rest(path, opts = {}) {
    const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, { ...opts, headers: head(opts.headers) });
    const text = await res.text();
    let body = null;
    try { body = text ? JSON.parse(text) : null; } catch { body = text; }
    if (!res.ok) throw new Error((body && body.message) || res.statusText || 'request failed');
    return { body, res };
  }

  return {
    get token() { return token(); },
    async me() {
      const res = await fetch(`${SUPA_URL}/auth/v1/user`,
        { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + token() } });
      if (!res.ok) return null;
      return res.json();
    },
    select: (table, query = '') => rest(`${table}?${query}`).then(r => r.body),
    insert: (table, rows) => rest(table, { method: 'POST',
      headers: { Prefer: 'return=minimal' }, body: JSON.stringify(rows) }).then(() => true),
    update: (table, match, patch) => rest(`${table}?${match}`, { method: 'PATCH',
      headers: { Prefer: 'return=minimal' }, body: JSON.stringify(patch) }).then(() => true),
  };
})();

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const PROJECT = new URLSearchParams(location.search).get('project');

const state = {
  me: null, role: null, sections: [], sectionId: null,
  clauses: [], sel: null, editing: null, dirty: 0,
};

/* ── messages: never a browser alert ─────────────────────────────────── */
let msgT;
function msg(t, bad) {
  const m = $('#msg'); m.textContent = t; m.classList.toggle('err', !!bad); m.classList.add('on');
  clearTimeout(msgT); msgT = setTimeout(() => m.classList.remove('on'), 2600);
}
const nowTor = () => new Date().toLocaleString('en-CA',
  { timeZone: 'America/Toronto', hour: '2-digit', minute: '2-digit' });

/* ── numbering is derived, never stored ──────────────────────────────── */
function numbered(rows) {
  const kids = new Map();
  rows.forEach(r => {
    const k = r.parent_id || '_root';
    if (!kids.has(k)) kids.set(k, []);
    kids.get(k).push(r);
  });
  kids.forEach(a => a.sort((x, y) => x.sort_order - y.sort_order));
  const out = [];
  (function walk(parent, prefix, lvl) {
    const list = kids.get(parent) || [];
    let n = 0;
    for (const r of list) {
      n++;
      const num = prefix ? `${prefix}.${n}` : String(n);
      out.push({ ...r, num, lvl });
      walk(r.id, num, lvl + 1);
    }
  })('_root', '', 1);
  return out;
}

/* ── render ──────────────────────────────────────────────────────────── */
function renderRail() {
  const byDiv = {};
  state.sections.forEach(s => (byDiv[s.division] = byDiv[s.division] || []).push(s));
  const html = Object.keys(byDiv).sort().map(d => `<div class="divh">Division ${d}</div>` +
    byDiv[d].map(s => {
      const p = s._counts || {};
      const worst = p.empty ? 'empty' : p.draft ? 'draft' : p.carried ? 'carried' : 'approved';
      const n = (p.approved || 0) + (p.draft || 0) + (p.carried || 0) + (p.empty || 0);
      return `<div class="sec ${s.id === state.sectionId ? 'on' : ''}" data-id="${s.id}">
        <span class="code">${s.code}</span><span class="t">${s.title}</span>
        <span class="pill ${worst}">${n || 0}</span></div>`;
    }).join('')).join('');
  $('#railBody').innerHTML = html;
}

function renderPage() {
  const sec = state.sections.find(s => s.id === state.sectionId);
  if (!sec) { $('#page').innerHTML = '<div class="empty-state">Choose a section.</div>'; return; }
  const rows = numbered(state.clauses);
  const head = `<div class="pg-head"><div><b>ARENCON INC.</b><br>Master content</div>
    <div class="r">Section ${sec.code}<br>${sec.title}</div></div>`;
  if (!rows.length) {
    $('#page').innerHTML = head +
      `<div class="empty-state">No wording in this section yet.<br>
       Use <b>Import</b> to load content, or add a clause once editing is enabled.</div>`;
    fitPage(); return;
  }
  $('#page').innerHTML = head + rows.map(r => {
    const prov = r.provenance === 'approved' ? '' : r.provenance;
    return (r.lvl <= 2 ? '<div class="blank"></div>' : '') +
      `<div class="ln ${prov} ${state.sel === r.id ? 'sel' : ''}" data-lvl="${r.lvl}" data-id="${r.id}">
        <div class="num">${r.num}</div><div class="tx">${escapeHtml(r.body)}</div></div>`;
  }).join('');
  fitPage();
}

const escapeHtml = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function renderInspector() {
  const el = $('#inspBody');
  const r = state.clauses.find(c => c.id === state.sel);
  if (!r) {
    el.innerHTML = `<div class="insp-h">Review</div>
      <div style="color:var(--ink3);font-size:10pt">Click a clause. Everything known about it appears here —
      how it got into the master, whether it has been approved, and who changed it last.</div>`;
    return;
  }
  const provText = { approved: 'Approved firm wording (7310.17)', carried: 'Carried from 7033.11 — not reviewed',
                     draft: 'Drafted — never reviewed', empty: 'No wording written' }[r.provenance];
  el.innerHTML = `
    <div class="insp-h">Clause</div><div class="mono">${r.id.slice(0, 8)}</div>
    <div class="insp-h">Provenance</div>
    <div><span class="pill ${r.provenance}">${provText}</span></div>
    <div class="insp-h">Lock</div>
    <div style="font-size:10pt;color:var(--ink2)">${r.lock_level === 'master'
      ? 'Firm master — principals only' : 'Project scope — editable on a job'}</div>
    ${r.spec_note ? `<div class="insp-h">Guidance</div><div class="note">${escapeHtml(r.spec_note)}</div>` : ''}
    <div class="insp-h">History</div><div id="hist" class="hist">Loading…</div>`;
  loadHistory(r.id);
}

async function loadHistory(id) {
  let data = [];
  try {
    data = await sb.select('sg_clause_event',
      `select=action,at&clause_id=eq.${id}&order=at.desc&limit=6`);
  } catch {}
  const el = $('#hist'); if (!el) return;
  el.innerHTML = (data && data.length)
    ? data.map(e => `<div class="hist"><b>${e.action}</b> · ${new Date(e.at)
        .toLocaleString('en-CA', { timeZone: 'America/Toronto' })}</div>`).join('')
    : '<span style="color:var(--ink3)">No changes recorded yet.</span>';
}

/* ── editing on the page ─────────────────────────────────────────────── */
function canEdit() { return ['admin', 'super_admin'].includes(state.role); }

function startEdit(id) {
  if (!canEdit()) { msg('Master wording is principals only.', true); return; }
  const row = $(`.ln[data-id="${id}"]`); if (!row) return;
  const tx = $('.tx', row);
  const rec = state.clauses.find(c => c.id === id);
  state.editing = { id, before: rec.body };
  tx.textContent = rec.body;
  tx.setAttribute('contenteditable', 'true');
  tx.focus();
  const rg = document.createRange(); rg.selectNodeContents(tx); rg.collapse(false);
  const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg);
  const hint = document.createElement('div');
  hint.className = 'edhint'; hint.id = 'edhint';
  hint.innerHTML = '<kbd>Ctrl</kbd>+<kbd>Enter</kbd> save · <kbd>Esc</kbd> cancel';
  row.after(hint);
}

async function commitEdit(save) {
  const e = state.editing; if (!e) return;
  state.editing = null;
  $('#edhint')?.remove();
  const row = $(`.ln[data-id="${e.id}"]`);
  const tx = row && $('.tx', row);
  if (!tx) return;
  const val = tx.textContent.trim();
  tx.removeAttribute('contenteditable');
  if (!save || val === e.before) { renderPage(); return; }

  const rec = state.clauses.find(c => c.id === e.id);
  try {
    await sb.update('sg_clause', `id=eq.${e.id}`, {
      body: val, provenance: 'approved', approved_by: state.me.id,
      approved_at: new Date().toISOString(), updated_at: new Date().toISOString() });
    await sb.insert('sg_clause_event', {
      clause_id: e.id, section_code: currentCode(), action: 'edit',
      before: { body: e.before, provenance: rec.provenance },
      after: { body: val, provenance: 'approved' }, actor: state.me.id });
  } catch (err) { msg('Not saved: ' + err.message, true); renderPage(); return; }
  rec.body = val; rec.provenance = 'approved';
  renderPage(); renderInspector(); renderCounts();
  setFresh(true);
  msg('Saved to the master. Published versions are unaffected.');
}

const currentCode = () => (state.sections.find(s => s.id === state.sectionId) || {}).code;

/* ── data ────────────────────────────────────────────────────────────── */
async function loadSections() {
  state.sections = await sb.select('sg_section', 'select=*&order=sort_order');
  const counts = await sb.select('sg_clause', 'select=section_id,provenance');
  const map = {};
  (counts || []).forEach(c => {
    map[c.section_id] = map[c.section_id] || {};
    map[c.section_id][c.provenance] = (map[c.section_id][c.provenance] || 0) + 1;
  });
  state.sections.forEach(s => (s._counts = map[s.id] || {}));
}

async function loadSection(id) {
  state.sectionId = id; state.sel = null;
  try {
    state.clauses = await sb.select('sg_clause', `select=*&section_id=eq.${id}&order=sort_order`);
  } catch (err) { msg(err.message, true); return; }
  renderRail(); renderPage(); renderInspector(); renderCounts();
}

function renderCounts() {
  const all = state.sections.reduce((a, s) => {
    Object.entries(s._counts || {}).forEach(([k, v]) => (a[k] = (a[k] || 0) + v)); return a; }, {});
  const sec = state.sections.find(s => s.id === state.sectionId);
  const local = state.clauses.length;
  $('#stat').innerHTML = `<b>${state.sections.length}</b> sections · master holds ` +
    `<b>${all.approved || 0}</b> approved · <b>${all.carried || 0}</b> carried · ` +
    `<b>${all.draft || 0}</b> drafted · <b>${all.empty || 0}</b> unwritten` +
    (sec ? ` &nbsp;·&nbsp; ${sec.code}: <b>${local}</b> clauses` : '');
}

function setFresh(dirty) {
  $('#fresh').classList.toggle('dirty', !!dirty);
  $('#freshT').textContent = dirty ? `Saved ${nowTor()} · Cloud` : `Loaded ${nowTor()} · Cloud`;
}

/* ── import ──────────────────────────────────────────────────────────── */
function importScreen() {
  if (!canEdit()) { msg('Import is principals only.', true); return; }
  const v = document.createElement('div');
  v.className = 'veil';
  v.innerHTML = `<div class="card">
    <h2>Import content</h2>
    <p>Drop the merged master file. Nothing is written until you confirm what it will do.</p>
    <div class="drop" id="drop">Drop a .json file here, or click to choose</div>
    <div id="preview" style="margin-top:14px;font-size:10pt;color:var(--ink2)"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="cbtn" id="cancel">Cancel</button>
      <button class="primary" id="apply" disabled>Import</button>
    </div></div>`;
  document.body.appendChild(v);
  let payload = null;
  const drop = $('#drop', v);
  const take = async (file) => {
    try {
      payload = JSON.parse(await file.text());
      const secs = payload.filter(n => n.kind === 'division').length;
      const cls = payload.filter(n => n.kind === 'clause').length;
      $('#preview', v).innerHTML =
        `<b>${secs}</b> sections · <b>${cls}</b> clauses found.<br>` +
        `Sections already in the master keep their existing clauses; only empty ones are filled. ` +
        `Nothing is deleted.`;
      $('#apply', v).disabled = false;
    } catch (err) { $('#preview', v).innerHTML = `<span class="err">Could not read that file.</span>`; }
  };
  drop.onclick = () => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.json';
    i.onchange = () => i.files[0] && take(i.files[0]); i.click();
  };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over');
                       e.dataTransfer.files[0] && take(e.dataTransfer.files[0]); };
  $('#cancel', v).onclick = () => v.remove();
  $('#apply', v).onclick = async () => {
    $('#apply', v).disabled = true;
    $('#preview', v).textContent = 'Importing…';
    try {
      const n = await runImport(payload, t => ($('#preview', v).textContent = t));
      v.remove(); await loadSections(); renderRail(); renderCounts();
      msg(`Imported ${n} clauses.`);
    } catch (err) {
      $('#preview', v).innerHTML = `<span class="err">${err.message}</span>`;
      $('#apply', v).disabled = false;
    }
  };
}

async function runImport(nodes, progress) {
  const secByCode = Object.fromEntries(state.sections.map(s => [s.code, s]));
  let written = 0, cur = null, stack = {}, order = 0;
  const batch = [];
  const flush = async () => {
    if (!batch.length) return;
    await sb.insert('sg_clause', batch);
    written += batch.length; batch.length = 0;
    progress(`Imported ${written} clauses…`);
  };
  for (const n of nodes) {
    if (n.kind === 'division') {
      const code = (n.text.match(/Section (\S+(?: \S+)*?) –/) || [])[1];
      cur = secByCode[code] || null; stack = {}; order = 0;
      if (cur) {
        const existing = await sb.select('sg_clause',
          `select=id&section_id=eq.${cur.id}&limit=1`);
        if (existing.length) cur = null;             // already populated: leave it alone
      }
      continue;
    }
    if (n.kind !== 'clause' || !cur) continue;
    await flush();
    const lvl = n.level;
    const body = (n.runs || []).map(r => r[0]).join('').trim();
    const prov = n._drafted ? 'draft' : body.startsWith('[-]') ? 'empty' : 'approved';
    const id = crypto.randomUUID();
    const row = { id, section_id: cur.id, parent_id: stack[lvl - 1] || null,
      sort_order: ++order, kind: lvl === 1 ? 'part' : lvl === 2 ? 'article' : 'clause',
      body, lock_level: 'master', provenance: prov };
    await sb.insert('sg_clause', row);
    written++; if (written % 25 === 0) progress(`Imported ${written} clauses…`);
    stack[lvl] = id;
    Object.keys(stack).forEach(k => { if (+k > lvl) delete stack[k]; });
  }
  return written;
}

/* ── layout plumbing ─────────────────────────────────────────────────── */
function measureChrome() {
  const h = Math.ceil($('#chrome').getBoundingClientRect().height);
  document.body.style.setProperty('--chrome-h', h + 'px');
}
function fitPage() {
  const col = $('#paperCol'), stage = $('#stage'), page = $('#page');
  const s = Math.min(1, Math.max(.55, (col.clientWidth - 24) / (8.5 * 96)));
  stage.style.transform = s < 1 ? `scale(${s.toFixed(4)})` : 'none';
  stage.style.marginBottom = s < 1 ? Math.round(-(1 - s) * page.offsetHeight) + 'px' : '0px';
}
// Narrow windows fold the side panels rather than squeezing the page.
let narrow = null;
function fitWindow() {
  const n = innerWidth < 1400;
  if (n !== narrow) {
    narrow = n;
    document.body.setAttribute('data-rail', n ? 'fold' : 'open');
    document.body.setAttribute('data-insp', n ? 'fold' : 'open');
    $('#edgeRail').textContent = n ? '\u25b6' : '\u25c0';
    $('#edgeInsp').textContent = n ? '\u25c0' : '\u25b6';
  }
  measureChrome();
  requestAnimationFrame(fitPage);
}

function toggleFold(which) {
  const k = which === 'rail' ? 'data-rail' : 'data-insp';
  document.body.setAttribute(k, document.body.getAttribute(k) === 'fold' ? 'open' : 'fold');
  $('#edgeRail').textContent = document.body.getAttribute('data-rail') === 'fold' ? '▶' : '◀';
  $('#edgeInsp').textContent = document.body.getAttribute('data-insp') === 'fold' ? '◀' : '▶';
  fitPage();
}
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('#btnTheme').textContent = t === 'dark' ? '☾' : '☀';
  try { localStorage.setItem('arencon-theme', t); } catch {}
}

/* ── events ──────────────────────────────────────────────────────────── */
$('#railBody').addEventListener('click', e => {
  const s = e.target.closest('.sec'); if (s) loadSection(s.dataset.id);
});
$('#page').addEventListener('click', e => {
  const row = e.target.closest('.ln'); if (!row) return;
  const id = row.dataset.id;
  if (state.editing && state.editing.id === id) return;
  if (state.editing) commitEdit(true);
  if (state.sel === id) { startEdit(id); return; }
  state.sel = id;
  $$('.ln.sel').forEach(n => n.classList.remove('sel'));
  row.classList.add('sel');
  renderInspector();
});
document.addEventListener('keydown', e => {
  if (state.editing) {
    if (e.key === 'Escape') { e.preventDefault(); commitEdit(false); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commitEdit(true); }
  }
});
document.addEventListener('focusout', e => {
  if (state.editing && e.target.matches('.tx[contenteditable="true"]')) commitEdit(true);
});
$('#edgeRail').onclick = () => toggleFold('rail');
$('#edgeInsp').onclick = () => toggleFold('insp');
$$('.strip').forEach(s => (s.onclick = () => toggleFold(s.dataset.open)));
$('#btnTheme').onclick = () =>
  setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
$('#btnImport').onclick = importScreen;
$('#btnHub').onclick = () => (location.href = PROJECT ? `../index.html?project=${PROJECT}` : '../index.html');
$('#btnOut').onclick = () => {
  try { ['sb-access-token', 'sb-refresh-token'].forEach(k => localStorage.removeItem(k)); } catch {}
  location.href = '../index.html';
};
$('#btnPublish').onclick = () => msg('Publishing arrives with the version navigator.');
addEventListener('resize', fitWindow);

/* ── boot ────────────────────────────────────────────────────────────── */
async function boot() {
  try { setTheme(localStorage.getItem('arencon-theme') || 'dark'); } catch { setTheme('dark'); }
  measureChrome();
  if (!sb.token) { msg('Not signed in.', true); return; }   // the gate handles this
  state.me = await sb.me();
  if (!state.me) { msg('Session expired — reload to sign in again.', true); return; }
  let prof = null;
  try {
    const rows = await sb.select('profiles', `select=role,full_name&id=eq.${state.me.id}`);
    prof = rows[0] || null;
  } catch (err) { msg('Could not read your profile: ' + err.message, true); }
  state.role = prof?.role || 'inspector';
  $('#modeTag').textContent = (PROJECT ? 'Project · ' : 'Master · ') +
    (prof?.full_name || state.me.email) + (canEdit() ? '' : ' · read only');
  try {
    await loadSections();
  } catch (err) { msg('Could not load the master: ' + err.message, true); return; }
  renderRail(); renderCounts(); setFresh(false);
  if (state.sections.length) await loadSection(state.sections[0].id);
  fitWindow();
  setTimeout(fitWindow, 120);
}
boot();
</script>
