<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARENCON · Specification — Jobs</title>
<script src="../../shared/auth-gate.js"></script>
<!-- The printed page. Shared with the clause library — ONE implementation.
     Nothing in this file draws a page, a number, a header, a cover or a table
     of contents. If you are about to, put it in the engine instead. -->
<link rel="stylesheet" href="../css/specDoc.css">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   THE JOB TOOL
   A job points at the firm master and keeps its OWN answers. It never edits
   the firm; the firm never edits it. The only route between them is a
   proposal a principal decides on.

   Built to the approved S12f design. Everything below is the SHELL around the
   page — the panes, the system list, the inspector. The page itself is the
   shared engine's and is not restated here.
   ══════════════════════════════════════════════════════════════════════════ */
:root, [data-theme="dark"]{
  --b-chrome-bg:#1d1b24; --b-chrome-rule:rgba(244,243,246,.14); --b-chrome-hover:rgba(255,255,255,.07);
  --b-chrome-fg:#f4f3f6; --brand:#C9476A; --ok:#3FD08A; --fail:#E26076; --warn:#E0A36A; --info:#46C5E8;
  --ink:#f4f3f6; --ink2:#a09aa8; --ink3:#6b6674;
  --bg:#0b0a0d; --line:rgba(255,255,255,.10); --sw-off:#2a2731;
  --surface:#16141c; --surface2:#1d1b24; --surface3:#262330; --deck:#0b0a0d;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
[data-theme="light"]{
  --b-chrome-bg:#E6E3E9; --b-chrome-rule:#D2CEDB; --b-chrome-hover:rgba(0,0,0,.05);
  --b-chrome-fg:#1B1A22; --brand:#9C2742; --ok:#2E9E72; --fail:#C0445F; --warn:#C98A4A; --info:#2C7FB8;
  --ink:#1B1A22; --ink2:#5E5B68; --ink3:#928E9C;
  --bg:#EFEDF0; --line:rgba(27,26,34,.12); --sw-off:#cfcbd6;
  --surface:#F4F2F6; --surface2:#E6E3E9; --surface3:#DAD6DF; --deck:#C9C5D0;
  --shadow:0 8px 28px rgba(27,26,34,.10);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font:11pt/1.5 Calibri,Carlito,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:5px}

header{flex:none;display:flex;align-items:center;gap:9px;height:52px;padding:0 12px;
  background:var(--b-chrome-bg);border-bottom:1px solid var(--b-chrome-rule);color:var(--b-chrome-fg)}
.mark{font-weight:700;font-size:11pt;white-space:nowrap}.mark span{font-size:8pt;letter-spacing:.08em}
.jobname{color:var(--ink2);font-size:10.5pt;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.grow{flex:1;min-width:0}
.me{font-size:10pt;color:var(--ink3);white-space:nowrap}
.hb{height:32px;padding:0 12px;border:1px solid var(--b-chrome-rule);border-radius:8px;background:transparent;
  cursor:pointer;white-space:nowrap;flex:none}
.hb:hover{background:var(--b-chrome-hover)}
.hb.icon{width:32px;padding:0}
.hb.go{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.hb[disabled]{opacity:.45;cursor:default}

#work{flex:1;min-height:0;display:grid;grid-template-columns:350px minmax(0,1fr) 330px;overflow:hidden}
.col{overflow-y:auto;background:var(--surface);min-width:0;-webkit-overflow-scrolling:touch}
.col+.col{border-left:1px solid var(--line)}
.pad{padding:14px}
.deck{background:var(--deck);padding:18px 0 90px}
h1{font-size:15pt;margin:0 0 6px}
h2{font-size:11.5pt;margin:0}
h3{font-size:10pt;font-weight:600;color:var(--ink3);margin:18px 0 8px;letter-spacing:.04em;text-transform:uppercase}
h3:first-child{margin-top:0}
.mini{font-size:9.5pt;color:var(--ink3);line-height:1.45}
.sub{color:var(--ink2);margin:0 0 16px}
.wrap{max-width:900px;margin:0 auto;padding:22px 20px 70px}

.btn{height:33px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);
  color:var(--ink2);cursor:pointer}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.btn.go{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.btn.cut{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 45%,transparent)}
.btn.sm{height:29px;padding:0 10px;font-size:10pt}
.btn[disabled]{opacity:.4;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.add{border:1px dashed var(--line);background:transparent;color:var(--ink3);border-radius:8px;
  padding:5px 11px;font-size:10pt;cursor:pointer}
.add:hover{color:var(--ink);border-color:var(--brand);border-style:solid}
.empty{color:var(--ink3);padding:34px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px}

/* ── jobs list (the front door) ─────────────────────────────────────────── */
.jobcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;text-align:left;
  padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);
  margin-bottom:9px;cursor:pointer}
.jobcard:hover{border-color:var(--brand)}
.jobcard .n{font-weight:600}
.jobcard .s{grid-column:1/-1;font-size:9.5pt;color:var(--ink3)}
.state{font-size:8.5pt;padding:1px 9px;border-radius:20px;border:1px solid;white-space:nowrap;align-self:start}
.state.draft{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);
  background:color-mix(in srgb,var(--warn) 12%,transparent)}
.state.issued{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);
  background:color-mix(in srgb,var(--ok) 12%,transparent)}

/* ── left pane ─────────────────────────────────────────────────────────── */
.set{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center;
  padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);margin-bottom:10px}
.set label{color:var(--ink2);font-size:10.5pt}
.set select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--ink)}

.sys{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface2);overflow:hidden}
.sys.on{border-color:color-mix(in srgb,var(--brand) 55%,transparent)}
.sysh{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:11px;align-items:center;
  padding:12px 13px;cursor:pointer}
.sysh:hover{background:var(--b-chrome-hover)}
.cb{width:20px;height:20px;border:1.5px solid var(--ink3);border-radius:6px;display:grid;place-items:center;
  color:transparent;font-size:12px;font-weight:700;flex:none}
.sys.on .cb{background:var(--brand);border-color:var(--brand);color:#fff}
.sysh .n{font-weight:600;display:block}
.sysh .s{font-size:9.5pt;color:var(--ink3);display:block;margin-top:1px}
.chev{background:none;border:0;color:var(--ink3);cursor:pointer;font-size:11px;padding:4px 6px}
.sysbody{border-top:1px solid var(--line);padding:11px 13px 13px}
.grp{margin-bottom:13px}
.grph{display:flex;align-items:center;gap:9px;font-size:9pt;letter-spacing:.08em;color:var(--ink3);
  text-transform:uppercase;margin-bottom:7px}
.grph span{flex:1}

.sec{display:grid;grid-template-columns:34px minmax(0,1fr) 30px;gap:10px;align-items:center;
  padding:8px 6px;border-radius:9px}
.sec:hover{background:var(--b-chrome-hover)}
.sec.cut .t,.sec.cut .c{color:var(--ink3);text-decoration:line-through}
.sec .t{display:block;font-size:10.5pt}
.sec .c{display:block;font-size:9pt;color:var(--ink3)}
.ring{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring i{width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;
  font-style:normal;font-size:8.5pt;color:var(--ink2)}
.ic{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:transparent;
  color:var(--ink3);cursor:pointer;display:grid;place-items:center}
.ic:hover{color:var(--ink);border-color:var(--ink3)}

.std{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:9px 11px;
  border:1px solid var(--line);border-radius:11px;margin-bottom:6px;background:var(--surface)}
.std.cut{opacity:.55}
.std.cut .desig,.std.cut .ti{text-decoration:line-through}
.std .l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.std .desig{font-weight:600;word-break:break-word}
.std .ed{font-size:9.5pt;padding:1px 8px;border-radius:6px;border:1px solid var(--line);
  color:var(--ink2);background:var(--surface2)}
.std .ed.none{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);
  background:color-mix(in srgb,var(--warn) 10%,transparent)}
.std .ti{grid-column:1/-1;font-size:9.5pt;color:var(--ink3);line-height:1.35}
.std .sact{display:flex;align-items:center;gap:6px;align-self:start}
.src{font-size:8.5pt;padding:1px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
.src.firm{color:var(--ink3);border-color:var(--line)}
.src.code{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent);
  background:color-mix(in srgb,var(--info) 12%,transparent)}
.src.insurer{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);
  background:color-mix(in srgb,var(--warn) 12%,transparent)}
.src.job{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 45%,transparent);
  background:color-mix(in srgb,var(--brand) 12%,transparent)}

.co{display:grid;grid-template-columns:22px minmax(0,1fr) 28px;gap:9px;align-items:center;
  padding:8px 6px;border-radius:9px;font-size:10.5pt}
.co:hover{background:var(--b-chrome-hover)}
.co.cut .t{color:var(--ink3);text-decoration:line-through}
.co .t{cursor:pointer}

/* ── the page, job-tool personality only ───────────────────────────────── */
/* Everything structural comes from specDoc.css. These rules add ONLY what a
   job does that the library does not: strike-through for something taken out,
   and the dashed gap for a blank. */
.ln.cut .tx,.ln.cut .num{color:#a6a1af;text-decoration:line-through}
.ln.pick{cursor:pointer;border-radius:3px}
.ln.pick:hover{background:rgba(201,71,106,.06);box-shadow:0 0 0 5px rgba(201,71,106,.06)}
.fx{border-bottom:1.5px dashed #9C2742;padding:0 3px;cursor:text;border-radius:2px;
  background:rgba(156,39,66,.07);white-space:pre-wrap}
.fx.done{border-bottom-color:#9aa0a8;background:transparent;font-weight:600}
.fx.todo{color:#9C2742;font-style:italic}
.fx[contenteditable="true"]{outline:2px solid #2C7FB8;outline-offset:2px;background:#fff;
  font-style:normal;min-width:4em;display:inline-block}

/* ── right pane ────────────────────────────────────────────────────────── */
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;margin-bottom:14px;
  border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
  background:color-mix(in srgb,var(--warn) 10%,transparent)}
.chip{font-size:9pt;padding:1px 8px;border-radius:20px;border:1px solid;white-space:nowrap;flex:none}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);
  background:color-mix(in srgb,var(--ok) 12%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);
  background:color-mix(in srgb,var(--warn) 12%,transparent)}
.chip.mute{color:var(--ink3);border-color:var(--line)}
.used{display:flex;flex-wrap:wrap;gap:6px}
.used button{font-size:10pt;padding:6px 12px;border:1px solid var(--line);border-radius:20px;
  background:var(--surface2);color:var(--ink2);cursor:pointer;text-align:left}
.used button:hover{border-color:var(--brand);color:var(--ink)}
.used button .k{color:var(--ink3);font-size:9pt;margin-left:6px}
/* Typical wordings read as firm-offered; used-before reads as history. The two
   rows must not look alike, or nobody can tell a curated phrasing from
   whatever somebody typed on one previous job. */
.used.typical button{border-style:dashed;border-color:color-mix(in srgb,var(--brand) 45%,transparent);
  color:var(--ink)}
.used.typical button:hover{border-style:solid}
.todo-list{display:grid;gap:6px}
.todo-list button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface2);color:var(--ink2);cursor:pointer;font-size:10.5pt}
.todo-list button:hover{border-color:var(--brand);color:var(--ink)}
.g p{margin:0 0 9px;color:var(--ink2);font-size:10.5pt}

.msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--surface3);
  border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-size:10.5pt;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .18s;z-index:95;max-width:90vw;text-align:center}
.msg.on{opacity:1}
.msg.err{border-color:var(--fail);color:var(--fail)}

#tabs{display:none;flex:none;background:var(--b-chrome-bg);border-top:1px solid var(--b-chrome-rule);
  padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:80}
#tabs button{flex:1;padding:9px 4px 10px;background:none;border:0;color:var(--ink3);cursor:pointer;font-size:9.5pt}
#tabs button i{display:block;font-style:normal;font-size:15px;margin-bottom:2px}
#tabs button.on{color:var(--brand)}
.badge{display:inline-block;min-width:17px;padding:0 5px;border-radius:20px;background:var(--brand);
  color:#fff;font-size:8.5pt;line-height:17px;margin-left:4px}

@media (max-width:900px){
  #work{grid-template-columns:1fr}
  .col{display:none}.col.active{display:block}.col+.col{border-left:0}
  #tabs{display:flex}
  .jobname,.me{display:none}
  .deck{padding:12px 0 30px}
  .page{width:100%;height:auto;min-height:0;padding:7vw 6vw 8vw;box-shadow:none}
  .page .pg-head{position:static;left:auto;right:auto;top:auto;margin-bottom:13pt}
  .ic{width:30px;height:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <span class="mark">ARENCON <span>INC.</span></span>
  <span class="jobname grow" id="jobname">Specification — Jobs</span>
  <span class="me" id="me"></span>
  <button class="hb" id="backjobs" hidden>All jobs</button>
  <button class="hb go" id="word" hidden>Word</button>
  <a class="hb" href="../index.html" style="text-decoration:none;color:inherit;display:inline-flex;align-items:center">Clause library</a>
  <button class="hb icon" id="theme" title="Day / night">☀</button>
</header>

<div id="work">
  <div class="col pad" id="left"></div>
  <div class="col deck" id="mid"></div>
  <div class="col pad" id="right"></div>
</div>

<nav id="tabs">
  <button data-p="left"><i>☰</i>Systems</button>
  <button data-p="mid" class="on"><i>▤</i>Document</button>
  <button data-p="right"><i>◈</i>To&nbsp;answer<span class="badge" id="bdg">0</span></button>
</nav>

<div class="msg" id="msg"></div>

<script type="module">
/* THE PRINTED PAGE IS NOT DRAWN HERE. See spec/js/specDoc.js. */
import { numbered, paginate, escapeHtml } from '../js/specDoc.js';

/* ── Supabase, reached the same way the rest of the tool does ──────────── */
const SUPA_URL = 'https://xsemvinxsyphjiaqgywv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzZW12aW54c3lwaGppYXFneXd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyNzkxNzMsImV4cCI6MjA4ODg1NTE3M30.1WhVv3kPeO0igzcZswbNT-u1tUvEKNP6lk1DivKoDHU';
const TOK_KEY = 'sb-access-token';
const sb = (() => {
  const token = () => { try { return localStorage.getItem(TOK_KEY); } catch { return null; } };
  const head = extra => Object.assign({ apikey: SUPA_KEY, Authorization: 'Bearer ' + (token() || SUPA_KEY),
    'Content-Type': 'application/json' }, extra || {});
  async function rest(path, opts = {}) {
    const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, { ...opts, headers: head(opts.headers) });
    const text = await res.text(); let body = null;
    try { body = text ? JSON.parse(text) : null; } catch { body = text; }
    if (!res.ok) throw new Error((body && body.message) || res.statusText || 'request failed');
    return body;
  }
  return {
    get token() { return token(); },
    async me() {
      const r = await fetch(`${SUPA_URL}/auth/v1/user`, { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + token() } });
      return r.ok ? r.json() : null;
    },
    select: (t, q = '') => rest(`${t}?${q}`),
    insert: (t, rows) => rest(t, { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(rows) }),
    upsert: (t, rows) => rest(t, { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(rows) }),
    update: (t, match, patch) => rest(`${t}?${match}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(patch) }),
    del: (t, match) => rest(`${t}?${match}`, { method: 'DELETE', headers: { Prefer: 'return=minimal' } }),
  };
})();

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const Dlg = () => import('../../lib/ui/dialogEngine.js').then(m => m.Dlg);
const phone = () => matchMedia('(max-width:900px)').matches;

const PROVN = { ON: 'Ontario', AB: 'Alberta', BC: 'British Columbia', QC: 'Quebec', XX: 'National (fallback)' };
const INSN = { NO: 'No insurer requirements', FM: 'FM Global', VS: 'Verisk / IBC', OT: 'Other insurer' };

/* The wordmark comes from the shared asset module — there is one copy of it in
   the toolkit and this is it. Do not paste base64 into this file. */
import { ARENCON_LOGO as LOGO_SRC } from '../../lib/assets/logo.js';

const state = {
  me: null, role: 'inspector',
  view: 'list',            // 'list' | 'job'
  jobs: [], job: null,
  /* firm side */
  packages: [], sections: [], pkgSections: [], firmStds: [], firmCloseouts: [], blanks: [], typicals: [],
  /* job side */
  jobPkgs: [], jobSecs: [], jobClauses: [], jobBlanks: [], jobStds: [], jobCloseouts: [],
  clauses: [],             // master clauses for the sections this job carries
  usedBefore: {},          // blank key -> [values from other jobs]
  open: {},                // which system panels are expanded
  sel: null,               // selected clause id
  focusBlank: null,
  toc: [],
};
const isPrincipal = () => ['admin', 'super_admin'].includes(state.role);

/* ── messages: never a browser alert ──────────────────────────────────── */
let msgT;
function msg(t, bad) {
  const el = $('#msg'); el.textContent = t; el.classList.toggle('err', !!bad); el.classList.add('on');
  clearTimeout(msgT); msgT = setTimeout(() => el.classList.remove('on'), 2600);
}
const fail = e => msg((e && e.message) || 'Something went wrong.', true);

/* Toronto local. Never raw UTC — the firm runs on Eastern Time. */
const tor = iso => iso ? new Date(iso).toLocaleString('en-CA',
  { timeZone: 'America/Toronto', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
const todayTor = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Toronto' });

/* ══ blanks ═══════════════════════════════════════════════════════════════
   A clause uses a blank by writing its key in ⟦brackets⟧. Until the job
   answers it, the page shows a dashed gap carrying the blank's prompt. No
   location, size or direction is ever hardcoded in the wording. */
const BLANK_RE = /⟦([a-z0-9-]+)⟧/g;

const blanksIn = body => {
  const out = []; let m; BLANK_RE.lastIndex = 0;
  while ((m = BLANK_RE.exec(String(body || '')))) out.push(m[1]);
  return out;
};
const blankDef = key => state.blanks.find(b => b.key === key) || { key, label: key, prompt: key, kind: 'text', optional: false };
const blankValue = key => (state.jobBlanks.find(b => b.blank_key === key) || {}).value || '';

/* Paint a clause body: escape first, THEN swap the markers, so nothing in a
   clause body can inject markup through this path. */
function paintBody(r) {
  const raw = escapeHtml(r.body);
  return raw.replace(BLANK_RE, (_, k) => {
    const v = blankValue(k), d = blankDef(k);
    return v
      ? `<span class="fx done" data-k="${escapeHtml(k)}">${escapeHtml(v)}</span>`
      : `<span class="fx todo" data-k="${escapeHtml(k)}">[${escapeHtml(d.prompt || d.label)}]</span>`;
  });
}

/* Everything still unanswered on this job, in document order. */
function outstanding() {
  const seen = new Set(), out = [];
  for (const r of state.clauses) {
    if (isStruck(r.id)) continue;
    for (const k of blanksIn(r.body)) {
      if (seen.has(k)) continue;
      seen.add(k);
      const d = blankDef(k);
      if (!blankValue(k) && !d.optional) out.push({ key: k, def: d, clause: r.id });
    }
  }
  return out;
}

const isStruck = id => !!(state.jobClauses.find(c => c.clause_id === id) || {}).struck;

/* FAIL OPEN. A clause with no system tag prints wherever its section prints —
   that is today's behaviour and it is the safe direction to fail in: an extra
   paragraph gets struck by a person who can see it, a missing one is never
   noticed. Only a clause that names its systems is filtered, and then only when
   none of them is on this job. */
function clauseOnThisJob(c) {
  const tags = c.system_tags || [];
  if (!tags.length) return true;
  const on = jobSystemKeys();
  return tags.some(t => on.has(t));
}

/* The system keys this job has ticked, read from the packages themselves so
   there is no second list to keep in step. */
function jobSystemKeys() {
  const on = new Set();
  state.jobPkgs.filter(p => p.included).forEach(p => {
    const pkg = state.packages.find(x => x.id === p.package_id);
    if (pkg && pkg.key) on.add(pkg.key);
  });
  return on;
}
const isSecStruck = id => !!(state.jobSecs.find(s => s.section_id === id) || {}).struck;

/* ══ data ═════════════════════════════════════════════════════════════════ */

    sb.select('sg_package', 'select=*&active=eq.true&order=sort_order,name'),
    sb.select('sg_section', 'select=*&order=sort_order,code'),
    sb.select('sg_package_section', 'select=*&order=sort_order'),
    sb.select('sg_standard', 'select=*&active=eq.true&order=sort_order,designation'),
    sb.select('sg_closeout', 'select=*&active=eq.true&order=sort_order'),
    sb.select('sg_blank', 'select=*&order=key'),
    sb.select('sg_blank_typical', 'select=*&active=eq.true&order=blank_key,sort_order'),
  ]);
  Object.assign(state, { packages, sections, pkgSections, firmStds, firmCloseouts, blanks, typicals });
}

async function loadJobs() {
  state.jobs = await sb.select('sg_job', 'select=*&order=updated_at.desc');
}

async function loadJob(id) {
  const [job, jobPkgs, jobSecs, jobClauses, jobBlanks, jobStds, jobCloseouts] = await Promise.all([
    sb.select('sg_job', `select=*&id=eq.${id}`),
    sb.select('sg_job_package', `select=*&job_id=eq.${id}`),
    sb.select('sg_job_section', `select=*&job_id=eq.${id}`),
    sb.select('sg_job_clause', `select=*&job_id=eq.${id}`),
    sb.select('sg_job_blank', `select=*&job_id=eq.${id}`),
    sb.select('sg_job_standard', `select=*&job_id=eq.${id}&order=sort_order,designation`),
    sb.select('sg_job_closeout', `select=*&job_id=eq.${id}&order=sort_order`),
  ]);
  if (!job.length) throw new Error('That job no longer exists.');
  Object.assign(state, { job: job[0], jobPkgs, jobSecs, jobClauses, jobBlanks, jobStds, jobCloseouts });
  await loadClausesForJob();
  await loadUsedBefore();
}

/* The sections this job carries = the sections of every system it has ticked.
   Clauses are read from the MASTER — a job never copies the wording, so a
   clause the firm corrects is corrected everywhere that has not pinned it. */
async function loadClausesForJob() {
  const ids = jobSectionIds();
  if (!ids.length) { state.clauses = []; return; }
  const list = ids.map(i => `"${i}"`).join(',');
  state.clauses = await sb.select('sg_clause', `select=*&section_id=in.(${list})&order=sort_order`);
}

function jobSectionIds() {
  const on = new Set(state.jobPkgs.filter(p => p.included).map(p => p.package_id));
  const ids = new Set();
  state.pkgSections.forEach(ps => { if (on.has(ps.package_id)) ids.add(ps.section_id); });
  return [...ids];
}

/* "Values used before" — the same blank answered on OTHER jobs. Most recent
   first, de-duplicated, capped: a list of forty past answers is a lookup, not
   a hint, and this wording is meant to be job-specific anyway. */
const USED_MAX = 3;
async function loadUsedBefore() {
  const rows = await sb.select('sg_job_blank',
    `select=blank_key,value,job_id,updated_at&job_id=neq.${state.job.id}&value=neq.&order=updated_at.desc&limit=400`);
  const byKey = {};
  for (const r of rows) {
    const k = r.blank_key;
    byKey[k] = byKey[k] || [];
    if (byKey[k].length >= USED_MAX) continue;
    if (byKey[k].some(x => x.value.toLowerCase() === String(r.value).toLowerCase())) continue;
    const j = state.jobs.find(x => x.id === r.job_id);
    byKey[k].push({ value: r.value, job: j ? j.project_no : '' });
  }
  state.usedBefore = byKey;
}

/* ── middle: the document, drawn by the shared engine ──────────────────── */
function docConfig() {
  const ids = jobSectionIds();
  const secs = state.sections
    .filter(s => ids.includes(s.id))
    .sort((a, b) => (a.sort_order - b.sort_order) || a.code.localeCompare(b.code));
  const j = state.job;
  return {
    sections: secs,
    rowsFor: id => state.clauses.filter(c => c.section_id === id && clauseOnThisJob(c)),
    header: {
      client: j.client, doc_title: j.doc_title, site: j.site, city: j.city,
      project_no: j.project_no, revision: j.revision, issue_date: j.issue_date,
    },
    logo: LOGO_SRC,
    bodyHtml: paintBody,
    rowClass: r => ['pick',
      isStruck(r.id) || isSecStruck(r.section_id) ? 'cut' : '',
      state.sel === r.id ? 'sel' : ''].filter(Boolean).join(' '),
    emptyNote: 'No wording written for this section yet.',
  };
}

function renderMid() {
  const m = $('#mid');
  if (!jobSectionIds().length) {
    m.innerHTML = `<div class="wrap"><div class="empty">
      This job has no systems yet. Tick what the building has in the Systems pane and the
      sections, standards and closeout items arrive together.</div></div>`;
    return;
  }
  state.toc = paginate(m, docConfig());
  $$('.ln[data-id]', m).forEach(el => el.onclick = e => {
    if (e.target.classList.contains('fx')) return;
    state.sel = el.dataset.id; renderRight(); renderMid(); if (phone()) showPane('right');
  });
  $$('.fx', m).forEach(el => el.onclick = e => { e.stopPropagation(); editBlankInline(el); });
}

/* Typing straight into the gap on the page. Enter commits, Escape abandons. */
function editBlankInline(el) {
  const k = el.dataset.k;
  const before = blankValue(k);
  el.textContent = before;
  el.contentEditable = 'true';
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  let abandoned = false;
  el.onkeydown = ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); el.blur(); }
    if (ev.key === 'Escape') { ev.preventDefault(); abandoned = true; el.blur(); }
  };
  el.onblur = async () => {
    el.contentEditable = 'false';
    const v = el.textContent.trim();
    if (abandoned || v === before) { renderMid(); return; }
    await saveBlank(k, v);
  };
  const line = el.closest('.ln');
  if (line) state.sel = line.dataset.id;
  state.focusBlank = k;
  renderRight();
  if (phone()) showPane('right');
}

async function saveBlank(key, value) {
  try {
    await sb.upsert('sg_job_blank', [{ job_id: state.job.id, blank_key: key, value,
      updated_at: new Date().toISOString() }]);
    const row = state.jobBlanks.find(b => b.blank_key === key);
    if (row) row.value = value; else state.jobBlanks.push({ job_id: state.job.id, blank_key: key, value });
    renderMid(); renderRight(); renderLeft(); renderChrome();
  } catch (e) { fail(e); renderMid(); }
}

/* ── right: what still needs answering, and why the clause says what it says ── */
function renderRight() {
  const el = $('#right');
  const todo = outstanding();
  const r = state.clauses.find(c => c.id === state.sel);

  if (!r) {
    el.innerHTML = `<h3>Still to answer${todo.length ? ' \u00b7 ' + todo.length : ''}</h3>
      ${todo.length ? `<div class="todo-list">${todo.map(t =>
        `<button data-goto="${t.clause}" data-k="${escapeHtml(t.key)}">${escapeHtml(t.def.label)}
          <span class="mini" style="display:block">${escapeHtml(t.def.prompt || '')}</span></button>`).join('')}</div>`
      : '<div class="mini">Nothing outstanding. Every blank on this job has an answer.</div>'}
      <div class="mini" style="margin-top:16px">Tap a clause on the page to see where its wording comes from.</div>`;
    wireRight(el);
    return;
  }

  const keys = blanksIn(r.body);
  const focus = state.focusBlank && keys.includes(state.focusBlank) ? state.focusBlank : keys[0];
  const d = focus ? blankDef(focus) : null;
  const used = focus ? (state.usedBefore[focus] || []) : [];
  const typ = focus ? state.typicals.filter(t => t.blank_key === focus) : [];
  const struck = isStruck(r.id);

  el.innerHTML = `
    ${d ? `<h3>${escapeHtml(d.label)}</h3>
      ${typ.length ? `<div class="mini" style="margin-bottom:7px">Typical wording. Tap to take one, then change whatever this job needs.</div>
        <div class="used typical">${typ.map(t =>
          `<button data-use="${escapeHtml(t.body)}">${escapeHtml(t.body)}</button>`).join('')}</div>` : ''}
      <div class="mini" style="margin:${typ.length ? '14px' : '0'} 0 7px">Used before on ARENCON jobs.</div>
      ${used.length ? `<div class="used">${used.map(u =>
        `<button data-use="${escapeHtml(u.value)}">${escapeHtml(u.value)}<span class="k">${escapeHtml(u.job)}</span></button>`).join('')}</div>`
        : '<div class="mini">Nothing recorded yet \u2014 this will be the first.</div>'}
      <div class="mini" style="margin-top:9px">Or type straight into the gap on the page. Nothing is filled in for you \u2014
        a blank stays open until you answer it.</div>` : ''}

    <h3 style="margin-top:18px">Why this clause says what it says</h3>
    <div class="g"><p>${escapeHtml(r.spec_note || 'Firm standard wording. No guidance note recorded against this clause yet.')}</p></div>
    ${r.provenance && r.provenance !== 'approved'
      ? `<div class="mini"><span class="chip warn">${escapeHtml(r.provenance)}</span>
          This wording has not been through a principal's review.</div>`
      : '<div class="mini"><span class="chip ok">approved</span> Reviewed firm wording.</div>'}

    <div class="acts">
      <button class="btn ${struck ? 'ok' : 'cut'}" id="cutclause">${struck ? 'Bring back' : 'Take out of this job'}</button>
      <button class="btn" id="propose">Propose to firm\u2026</button>
    </div>
    <div class="mini" style="margin-top:10px">Taking a clause out strikes it through. It still prints, struck, until the
      job is finalised \u2014 so nothing disappears without you seeing it go.</div>`;
  wireRight(el);
}

function wireRight(el) {
  $$('[data-goto]', el).forEach(b => b.onclick = () => {
    state.sel = b.dataset.goto; state.focusBlank = b.dataset.k;
    renderMid(); renderRight();
    if (phone()) showPane('mid');
    const node = $(`.ln[data-id="${state.sel}"]`, $('#mid'));
    if (node) node.scrollIntoView({ block: 'center', behavior: 'smooth' });
  });
  $$('[data-use]', el).forEach(b => b.onclick = () => saveBlank(state.focusBlank, b.dataset.use));
  const c = $('#cutclause', el); if (c) c.onclick = () => toggleClause(state.sel);
  const p = $('#propose', el); if (p) p.onclick = () => proposeClause(state.sel);
}

/* ══ job edits ════════════════════════════════════════════════════════════ */
async function setJobField(field, value) {
  try {
    await sb.update('sg_job', `id=eq.${state.job.id}`, { [field]: value, updated_at: new Date().toISOString() });
    state.job[field] = value;
    if (field === 'province' || field === 'insurer') await rebuildWholeJobStandards();
    render();
    msg('Saved.');
  } catch (e) { fail(e); }
}

/* The province and insurer entries are DERIVED — change the province and they
   are rewritten. Anything the job added or edited is pinned and left alone.
   That is the whole point of the pinned flag: a job's own work survives a
   setting change. */
async function rebuildWholeJobStandards() {
  const j = state.job;
  const derived = state.jobStds.filter(s => !s.package_id && !s.pinned && (s.source === 'code' || s.source === 'insurer'));
  try {
    if (derived.length) {
      const ids = derived.map(s => `"${s.id}"`).join(',');
      await sb.del('sg_job_standard', `id=in.(${ids})`);
    }
    const want = state.firmStds.filter(s => !s.package_id && (
      (s.source === 'code' && (s.province === j.province || s.province === 'XX')) ||
      (s.source === 'insurer' && j.insurer !== 'NO' && s.insurer === j.insurer)));
    if (want.length) {
      const rows = want.map((s, i) => normStd(s, null, i));
      await sb.insert('sg_job_standard', rows);
    }
    state.jobStds = await sb.select('sg_job_standard', `select=*&job_id=eq.${j.id}&order=sort_order,designation`);
  } catch (e) { fail(e); }
}

/* Every row built from ONE normalised shape with explicit nulls. PostgREST
   rejects a bulk insert whose objects do not all carry the same keys. */
function normStd(s, packageId, i) {
  return {
    job_id: state.job.id, standard_id: s.id || null, package_id: packageId || null,
    designation: s.designation, edition: s.edition || '', title: s.title || '',
    source: s.source, struck: false, pinned: false, sort_order: (i + 1) * 10,
  };
}

/* Ticking a system brings its sections, its standards and its closeout list
   with it — the Owner's bundle ruling. Unticking it puts them back. */
async function togglePackage(pkgId) {
  const existing = state.jobPkgs.find(p => p.package_id === pkgId);
  const turningOn = !(existing && existing.included);
  const p = state.packages.find(x => x.id === pkgId);
  try {
    if (turningOn) {
      await sb.upsert('sg_job_package', [{ job_id: state.job.id, package_id: pkgId, included: true }]);
      const stds = state.firmStds.filter(s => s.package_id === pkgId);
      if (stds.length) await sb.insert('sg_job_standard', stds.map((s, i) => normStd(s, pkgId, i)));
      const cos = state.firmCloseouts.filter(c => c.package_id === pkgId);
      if (cos.length) await sb.insert('sg_job_closeout', cos.map((c, i) => ({
        job_id: state.job.id, closeout_id: c.id, package_id: pkgId, body: c.body,
        included: !!c.default_on, struck: false, pinned: false, sort_order: (i + 1) * 10,
      })));
      state.open[pkgId] = true;
      msg(`${p.name} added — its sections, standards and closeout items came with it.`);
    } else {
      const D = await Dlg();
      const ok = await D.confirmDanger({
        title: 'Take this system out',
        message: `Take ${p.name} out of this job?`,
        detail: 'Its sections leave the document, and the standards and closeout items it brought go with them.',
        undoNote: 'Tick it again to bring the whole bundle back. Anything you typed into its blanks is kept and reappears.',
        confirmText: 'Take out',
      });
      if (!ok) return;
      await sb.del('sg_job_package', `job_id=eq.${state.job.id}&package_id=eq.${pkgId}`);
      await sb.del('sg_job_standard', `job_id=eq.${state.job.id}&package_id=eq.${pkgId}`);
      await sb.del('sg_job_closeout', `job_id=eq.${state.job.id}&package_id=eq.${pkgId}`);
      delete state.open[pkgId];
      msg(`${p.name} taken out.`);
    }
    await loadJob(state.job.id);
    render();
  } catch (e) { fail(e); }
}

async function toggleSection(sectionId) {
  const row = state.jobSecs.find(s => s.section_id === sectionId);
  const next = !(row && row.struck);
  try {
    await sb.upsert('sg_job_section', [{ job_id: state.job.id, section_id: sectionId, struck: next }]);
    if (row) row.struck = next; else state.jobSecs.push({ job_id: state.job.id, section_id: sectionId, struck: next });
    render();
  } catch (e) { fail(e); }
}

async function toggleClause(clauseId) {
  const row = state.jobClauses.find(c => c.clause_id === clauseId);
  const next = !(row && row.struck);
  try {
    await sb.upsert('sg_job_clause', [{ job_id: state.job.id, clause_id: clauseId, struck: next,
      body_override: row ? row.body_override : null }]);
    if (row) row.struck = next;
    else state.jobClauses.push({ job_id: state.job.id, clause_id: clauseId, struck: next, body_override: null });
    render();
    msg(next ? 'Struck through. It still prints until you finalise.' : 'Brought back.');
  } catch (e) { fail(e); }
}

async function proposeClause(clauseId) {
  const r = state.clauses.find(c => c.id === clauseId);
  if (!r) return;
  const D = await Dlg();
  const out = await D.form({
    title: 'Propose this wording to the firm', icon: '\u2709', accent: 'slate', width: 620,
    message: 'This does not change your job and it does not change the firm master. It goes to the principals, who decide. Nobody pushes wording into the master directly.',
    fields: [
      { key: 'after_text', label: 'Wording you are proposing', type: 'textarea', value: r.body, required: true },
      { key: 'note', label: 'Why (the principals will read this)', type: 'textarea', placeholder: 'What is wrong with the current wording, and what this fixes.', required: true },
    ],
    submitText: 'Send to the principals',
  });
  if (!out) return;
  try {
    await sb.insert('sg_proposal', {
      kind: 'clause', target_id: r.id, package_id: null, job_id: state.job.id,
      before_text: r.body, after_text: out.after_text.trim(), note: out.note.trim(),
      proposed_by: state.me ? state.me.id : null, state: 'open',
    });
    msg('Sent. The principals will see it in the Master File.');
  } catch (e) { fail(e); }
}

async function editJobStd(s, pkgId) {
  const D = await Dlg(); const fresh = !s;
  const out = await D.form({
    title: fresh ? 'Add a standard to this job' : 'Edit this standard', icon: '\u00a7', accent: 'slate', width: 560,
    message: 'This changes the job only. To change what every job cites, propose it to the firm from the Master File.',
    fields: [
      { key: 'designation', label: 'Designation', type: 'text', value: s ? s.designation : '', placeholder: 'NFPA 20', required: true },
      { key: 'edition', label: 'Edition or date', type: 'text', value: s ? s.edition : '', placeholder: '2025' },
      { key: 'title', label: 'Title', type: 'text', value: s ? s.title : '' },
    ],
    submitText: fresh ? 'Add' : 'Save',
  });
  if (!out) return;
  try {
    if (fresh) {
      await sb.insert('sg_job_standard', {
        job_id: state.job.id, standard_id: null, package_id: pkgId || null,
        designation: out.designation.trim(), edition: (out.edition || '').trim(),
        title: (out.title || '').trim(), source: 'job', struck: false, pinned: true,
        sort_order: (state.jobStds.length + 1) * 10,
      });
    } else {
      /* Editing a derived entry PINS it, so changing the province later does
         not silently throw the edit away. */
      await sb.update('sg_job_standard', `id=eq.${s.id}`, {
        designation: out.designation.trim(), edition: (out.edition || '').trim(),
        title: (out.title || '').trim(), pinned: true,
      });
    }
    state.jobStds = await sb.select('sg_job_standard', `select=*&job_id=eq.${state.job.id}&order=sort_order,designation`);
    renderLeft(); renderMid(); msg('Saved.');
  } catch (e) { fail(e); }
}

async function strikeJobStd(s) {
  if (!s) return;
  try {
    await sb.update('sg_job_standard', `id=eq.${s.id}`, { struck: !s.struck, pinned: true });
    s.struck = !s.struck; s.pinned = true;
    renderLeft(); renderMid();
  } catch (e) { fail(e); }
}

async function editJobCloseout(c, pkgId) {
  const D = await Dlg(); const fresh = !c;
  const out = await D.form({
    title: fresh ? 'Add a closeout item' : 'Edit this closeout item', icon: '\u2713', accent: 'slate', width: 560,
    message: 'This changes the job only.',
    fields: [{ key: 'body', label: 'What the contractor must hand over', type: 'textarea',
      value: c ? c.body : '', required: true }],
    submitText: fresh ? 'Add' : 'Save',
  });
  if (!out) return;
  try {
    if (fresh) {
      await sb.insert('sg_job_closeout', {
        job_id: state.job.id, closeout_id: null, package_id: pkgId || null, body: out.body.trim(),
        included: true, struck: false, pinned: true, sort_order: (state.jobCloseouts.length + 1) * 10,
      });
    } else {
      await sb.update('sg_job_closeout', `id=eq.${c.id}`, { body: out.body.trim(), pinned: true });
    }
    state.jobCloseouts = await sb.select('sg_job_closeout', `select=*&job_id=eq.${state.job.id}&order=sort_order`);
    renderLeft(); renderMid(); msg('Saved.');
  } catch (e) { fail(e); }
}

async function strikeJobCloseout(c) {
  if (!c) return;
  try {
    await sb.update('sg_job_closeout', `id=eq.${c.id}`, { struck: !c.struck, pinned: true });
    c.struck = !c.struck; c.pinned = true;
    renderLeft(); renderMid();
  } catch (e) { fail(e); }
}

async function jobDetails() {
  const j = state.job;
  const D = await Dlg();
  const out = await D.form({
    title: 'Job details', icon: '\u2630', accent: 'slate', width: 620,
    message: 'Everything on the cover and in the running page header. A field left blank prints the template in grey so the shape of the page is honest.',
    fields: [
      { key: 'project_no', label: 'Project #', type: 'text', value: j.project_no, required: true },
      { key: 'revision', label: 'Revision', type: 'text', value: j.revision || '' },
      { key: 'client', label: 'Client', type: 'text', value: j.client || '' },
      { key: 'site', label: 'Site address', type: 'text', value: j.site || '' },
      { key: 'city', label: 'City, Province', type: 'text', value: j.city || '' },
      { key: 'doc_title', label: 'Document title', type: 'text', value: j.doc_title || '' },
      { key: 'issue_date', label: 'Date of issuance', type: 'date', value: j.issue_date || todayTor() },
    ],
    submitText: 'Save',
  });
  if (!out) return;
  try {
    const patch = {
      project_no: out.project_no.trim(), revision: (out.revision || '').trim(),
      client: (out.client || '').trim(), short_client: (out.client || '').trim(),
      site: (out.site || '').trim(), city: (out.city || '').trim(),
      doc_title: (out.doc_title || '').trim(), issue_date: out.issue_date || null,
      updated_at: new Date().toISOString(),
    };
    await sb.update('sg_job', `id=eq.${j.id}`, patch);
    Object.assign(state.job, patch);
    render(); msg('Saved.');
  } catch (e) { fail(e); }
}

/* ── Word ─────────────────────────────────────────────────────────────────
   The same export engine the clause library uses, handed this job's rows
   instead of the master's. */
async function exportWord() {
  try {
    msg('Building the Word file\u2026');
    const { buildSpecDocx, specFileName } = await import('../js/docx.js');
    const cfg = docConfig();
    const sections = cfg.sections.map(s => ({
      code: s.code, title: s.title,
      rows: numbered(cfg.rowsFor(s.id).filter(c => !isStruck(c.id))),
    }));
    const blob = await buildSpecDocx({
      sections, header: cfg.header, toc: state.toc || [], logo: LOGO_SRC,
      address: ['1551 Caterpillar Road, Suite 206', 'Mississauga, ON  L4X 2Z6'],
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = specFileName(cfg.header);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    msg('Word file downloaded.');
  } catch (e) { fail(e); }
}

/* ── panes on a phone ─────────────────────────────────────────────────── */
function showPane(which) {
  $$('.col').forEach(c => c.classList.toggle('active', c.id === which));
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.p === which));
}

/* ── theme ────────────────────────────────────────────────────────────── */
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('#theme').textContent = t === 'dark' ? '\u2600' : '\u263e';
  try { localStorage.setItem('arencon-spec-theme', t); } catch {}
}

/* ── boot ─────────────────────────────────────────────────────────────── */
async function boot() {
  let saved = 'dark';
  try { saved = localStorage.getItem('arencon-spec-theme') || 'dark'; } catch {}
  setTheme(saved);
  $('#theme').onclick = () =>
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  $('#backjobs').onclick = () => { state.view = 'list'; state.job = null; render(); };
  $('#word').onclick = exportWord;
  $$('#tabs button').forEach(b => b.onclick = () => showPane(b.dataset.p));
  showPane('mid');

  try {
    state.me = await sb.me();
    if (state.me) {
      const rows = await sb.select('profiles', `select=role,full_name&id=eq.${state.me.id}`);
      state.role = (rows[0] || {}).role || 'inspector';
      $('#me').textContent = `${(rows[0] || {}).full_name || ''}${isPrincipal() ? ' · principal' : ''}`;
    }
    await loadFirm();
    await loadJobs();
    render();
  } catch (e) {
    fail(e);
    $('#mid').innerHTML = `<div class="wrap"><div class="empty">
      Could not reach the specification data. Check you are signed in, then reload.</div></div>`;
  }
}

boot();
</script>
