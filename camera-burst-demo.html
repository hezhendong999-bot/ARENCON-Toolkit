<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>ARENCON — Burst Camera Demo</title>
<style>
  :root{ --arencon:#9C2742; --arencon-lt:#C9476A; --ink:#fff; --ink2:#b9b4c0; --ink3:#7c7784; --ok:#3FD08A; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:#000; font-family:Calibri,'Segoe UI',sans-serif; color:#fff; overflow:hidden; user-select:none; }
  button{ font-family:inherit; }

  .screen{ position:fixed; inset:0; display:flex; flex-direction:column; background:#000; }
  #review{ display:none; z-index:20; }
  #review.show{ display:flex; }

  /* --- mock 4:3 preview / photo --- */
  .frame{ position:relative; height:100%; max-height:100%; max-width:100%; aspect-ratio:4/3; overflow:hidden; background:#12161c; }
  .frame .scene{ position:absolute; inset:0; }
  .frame .vig{ position:absolute; inset:0; box-shadow:inset 0 0 120px rgba(0,0,0,.5); }
  .frame .focus{ position:absolute; top:37%; left:44%; width:72px; height:72px; border:1.5px solid rgba(255,255,255,.7); border-radius:6px; opacity:.6; }
  .frame .live{ position:absolute; top:10px; left:12px; font-size:11px; background:rgba(0,0,0,.35); padding:3px 8px; border-radius:99px; opacity:.75; }
  .frame .tag{ position:absolute; top:10px; right:12px; font-size:12px; background:rgba(0,0,0,.4); padding:3px 9px; border-radius:99px; opacity:.85; }
  .vwrap{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; overflow:hidden; padding:8px 0; }

  /* --- camera top bar --- */
  .top{ flex:none; display:flex; align-items:center; justify-content:space-between; padding:calc(22px + env(safe-area-inset-top,0)) 20px 10px; }
  .top .x{ font-size:26px; line-height:1; width:40px; }
  .top .count{ font-size:15px; font-variant-numeric:tabular-nums; }
  .top .count b{ font-weight:700; }
  .top .rt{ width:40px; text-align:right; font-size:20px; opacity:.85; }

  /* --- thumbnail strip --- */
  .strip{ flex:none; display:flex; gap:8px; overflow-x:auto; padding:6px 16px 10px; min-height:0; }
  .strip:empty{ display:none; }
  .strip .th{ position:relative; flex:none; width:54px; height:54px; border-radius:8px; overflow:hidden;
    border:1px solid rgba(255,255,255,.25); }
  .strip .th .n{ position:absolute; bottom:2px; right:4px; font-size:10px; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.7); }

  /* --- camera bottom bar --- */
  .bar{ flex:none; display:flex; align-items:center; justify-content:space-between; padding:4px 24px calc(24px + env(safe-area-inset-bottom,0)); }
  .retake{ background:none; border:0; color:var(--ink); font-size:15px; font-weight:600; min-width:96px; text-align:left; }
  .retake:disabled{ color:var(--ink3); }
  .shutter{ width:74px; height:74px; border-radius:50%; background:#fff; border:4px solid rgba(255,255,255,.35); flex:none; }
  .shutter:active{ transform:scale(.94); }
  .done{ background:none; border:0; color:var(--ink); font-size:17px; font-weight:600; min-width:96px; text-align:right; }
  .done:disabled{ color:var(--ink3); }

  /* --- review view --- */
  #review .rtop{ position:relative; display:flex; align-items:center; padding:calc(16px + env(safe-area-inset-top,0)) 18px 8px; }
  #review .back{ position:relative; z-index:2; display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.34); color:#fff;
    font-size:15px; font-weight:700; padding:10px 18px; border-radius:99px; }
  #review .back .chev{ font-size:20px; line-height:1; margin-top:-1px; }
  #review .pos{ position:absolute; left:0; right:0; text-align:center; pointer-events:none;
    font-size:15px; color:var(--ink2); font-variant-numeric:tabular-nums; }
  #review .rbar{ display:flex; align-items:center; justify-content:space-between; padding:10px 30px calc(26px + env(safe-area-inset-bottom,0)); }
  #review .nav{ background:none; border:0; color:#fff; font-size:30px; width:56px; opacity:.9; }
  #review .nav:disabled{ opacity:.25; }
  #review .del{ display:flex; align-items:center; gap:8px; background:rgba(226,96,118,.16); border:1px solid rgba(226,96,118,.5);
    color:#E26076; font-size:16px; font-weight:700; padding:12px 22px; border-radius:12px; }

  /* --- flash + toast --- */
  #flash{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:50; transition:opacity .12s; }
  #note{ position:fixed; left:50%; bottom:120px; transform:translateX(-50%); z-index:60; background:rgba(20,18,26,.92);
    border:1px solid rgba(255,255,255,.16); color:#fff; padding:10px 18px; border-radius:12px; font-size:14px;
    opacity:0; transition:opacity .2s; pointer-events:none; }
  #note.show{ opacity:1; }
  #note .ok{ color:var(--ok); font-weight:700; }
</style>
</head>
<body>

<!-- ===== CAMERA (BURST) ===== -->
<div class="screen" id="camera">
  <div class="top">
    <div class="x" id="btnClose">&#10005;</div>
    <div class="count"><b id="cnt">0</b> photos this round</div>
    <div class="rt">&#8635;</div>
  </div>
  <div class="vwrap">
    <div class="frame">
      <div class="scene" id="liveScene"></div>
      <div class="focus"></div><div class="vig"></div>
      <div class="live">&#9679; live</div>
    </div>
  </div>
  <div class="strip" id="strip"></div>
  <div class="bar">
    <button class="retake" id="btnRetake" disabled>&#8630; Retake last</button>
    <div class="shutter" id="btnShutter"></div>
    <button class="done" id="btnDone" disabled>Done</button>
  </div>
</div>

<!-- ===== REVIEW ===== -->
<div class="screen" id="review">
  <div class="rtop">
    <button class="back" id="btnBack"><span class="chev">&#8249;</span> Camera</button>
    <div class="pos" id="pos">Photo 1 of 1</div>
  </div>
  <div class="vwrap"><div class="frame"><div class="scene" id="reviewScene"></div><div class="vig"></div><div class="tag" id="reviewTag">Photo 1</div></div></div>
  <div class="rbar">
    <button class="nav" id="btnPrev">&#8249;</button>
    <button class="del" id="btnDelete">&#128465; Delete</button>
    <button class="nav" id="btnNext">&#8250;</button>
  </div>
</div>

<div id="flash"></div>
<div id="note"></div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var photos=[];        // {n, scene}  — mock captured photos for this burst round
  var total=0;          // total ever taken this round (for stable photo numbers)
  var reviewIdx=0;

  // mock "photo" backgrounds so each shot is visually distinct
  var scenes=[
    'radial-gradient(120% 90% at 30% 20%,#3a4653,#232a33 50%,#12161c)',
    'radial-gradient(120% 90% at 70% 25%,#4a3b33,#2a221c 50%,#14100c)',
    'radial-gradient(120% 90% at 40% 30%,#33463c,#1c2a24 50%,#0e1613)',
    'radial-gradient(120% 90% at 60% 15%,#3f3346,#251c2a 50%,#140e17)',
    'radial-gradient(120% 90% at 35% 25%,#46333a,#2a1c22 50%,#160c10)',
    'radial-gradient(120% 90% at 55% 30%,#334046,#1c262a 50%,#0c1216)'
  ];
  function sceneFor(n){ return scenes[(n-1)%scenes.length]; }

  var cnt=$('cnt'), strip=$('strip'), review=$('review');

  function refresh(){
    cnt.textContent = photos.length;
    $('btnRetake').disabled = photos.length===0;
    $('btnDone').disabled   = photos.length===0;
    // strip
    strip.innerHTML='';
    photos.forEach(function(p, i){
      var th=document.createElement('div'); th.className='th';
      th.style.background=p.scene;
      th.innerHTML='<span class="n">'+p.n+'</span>';
      th.addEventListener('click', function(){ openReview(i); });
      strip.appendChild(th);
    });
    strip.scrollLeft = strip.scrollWidth;
  }

  function note(html){ var n=$('note'); n.innerHTML=html; n.classList.add('show'); clearTimeout(n._t); n._t=setTimeout(function(){ n.classList.remove('show'); }, 1400); }

  // ---- shutter ----
  function shoot(){
    total++;
    photos.push({ n: total, scene: sceneFor(total) });
    var f=$('flash'); f.style.opacity='.75'; requestAnimationFrame(function(){ f.style.opacity='0'; });
    refresh();
  }
  $('btnShutter').addEventListener('click', shoot);

  // ---- retake last (quick delete newest) ----
  $('btnRetake').addEventListener('click', function(){
    if(!photos.length) return;
    var p=photos.pop(); refresh(); note('Removed photo '+p.n);
  });

  // ---- review ----
  function openReview(i){
    reviewIdx=i; renderReview(); review.classList.add('show');
  }
  function renderReview(){
    var p=photos[reviewIdx];
    $('reviewScene').style.background=p.scene;
    $('reviewTag').textContent='Photo '+p.n;
    $('pos').textContent='Photo '+(reviewIdx+1)+' of '+photos.length;
    $('btnPrev').disabled = reviewIdx===0;
    $('btnNext').disabled = reviewIdx===photos.length-1;
  }
  $('btnBack').addEventListener('click', function(){ review.classList.remove('show'); });
  $('btnPrev').addEventListener('click', function(){ if(reviewIdx>0){ reviewIdx--; renderReview(); } });
  $('btnNext').addEventListener('click', function(){ if(reviewIdx<photos.length-1){ reviewIdx++; renderReview(); } });
  $('btnDelete').addEventListener('click', function(){
    var removed=photos[reviewIdx];
    photos.splice(reviewIdx,1);
    refresh();
    if(photos.length===0){ review.classList.remove('show'); note('Removed photo '+removed.n); return; }
    if(reviewIdx>photos.length-1) reviewIdx=photos.length-1;
    renderReview(); note('Removed photo '+removed.n);
  });

  // ---- done / close ----
  $('btnDone').addEventListener('click', function(){
    if(!photos.length) return;
    note('<span class="ok">&#10003;</span> '+photos.length+' photo'+(photos.length>1?'s':'')+' added to the deficiency');
    photos=[]; total=0; refresh();
  });
  $('btnClose').addEventListener('click', function(){
    if(!photos.length){ note('Camera closed'); return; }
    photos=[]; total=0; refresh(); note('Discarded — round reset');
  });

  refresh();
})();
</script>
</body>
</html>
