# ARENCON PDF Tile Renderer — Fly.io configuration (S107 architectural commit)
#
# This file is shared by both the staging app (arencon-render-staging) and
# the future production app (arencon-render). The actual app name is passed
# via --app on the deploy command, so this config is portable.
#
# Secrets are set by the GitHub Actions workflow:
#   API_KEY, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#   R2_TILE_PREFIX, SELF_URL
#
# The R2_TILE_PREFIX env var separates staging tiles from production tiles
# in R2:
#   staging  → tiles-mupdf-staging/...
#   prod     → tiles/...

primary_region = "yyz"   # Toronto — closest to Mark's team

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0          # scale to zero when nothing is rendering
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 1
    hard_limit = 2

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"

[processes]
  app = ""
