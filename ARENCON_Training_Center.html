<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARENCON Training Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
/* ═══ ARENCON design language — matched to Hub / FRT / pump tools ═══
   Same token set as admin re-skin. Canonical from Project_Hub :root. */
:root{
  --arencon:#9C2742; --arencon-mid:#7d1f35; --arencon-light:#F8E8EC;
  --navy:#1B2438; --navy-mid:#243048; --navy-light:#2D3A52;
  --steel:#5A6473; --silver:#94A3B8;
  --smoke:#F1F5F9; --border:#E2E8F0; --white:#FFFFFF;
  --card:#ffffff; --fg:#1E293B; --bg:#F8FAFC;
  --ok:#1A7A4A; --ok-bg:#D4EDDA; --err:#C0392B; --err-bg:#FADBD8;
  --warn:#B7791F;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 6px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 10px 25px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.04);
  --radius:10px; --radius-lg:14px; --ts:0px;
  font-family:Calibri,'Segoe UI',system-ui,-apple-system,sans-serif;
}
body.text-m{--ts:2px;} body.text-l{--ts:4px;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Calibri,'Segoe UI',system-ui,sans-serif;color:var(--fg);
  background:var(--bg);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;
  font-size:calc(14px + var(--ts))}

/* ── header ── */
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 100%);
  display:flex;align-items:center;padding:10px 16px;gap:10px;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.hdr a.logo{display:flex;align-items:center;flex-shrink:0}
.hdr img{height:32px;width:auto;background:#fff;padding:4px 8px;
  border-radius:7px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:block;
  transition:transform .2s}
.hdr img:hover{transform:scale(1.03)}
.hdr .ttl{font-size:calc(17px + var(--ts));font-weight:700;color:#fff;
  white-space:nowrap;letter-spacing:-.2px;flex-shrink:0}
.hdr .sp{flex:1;min-width:0}
.hdr .who{display:flex;align-items:center;gap:10px;
  color:rgba(255,255,255,.92);font-size:calc(13px + var(--ts));
  font-weight:500;white-space:nowrap}
.hdr .lo{background:rgba(255,255,255,.1);color:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.12);padding:7px 14px;border-radius:8px;
  cursor:pointer;font-weight:600;font-size:calc(12.5px + var(--ts));
  font-family:inherit;transition:all .2s;backdrop-filter:blur(4px);
  flex-shrink:0}
.hdr .lo:hover{background:rgba(255,255,255,.2);
  border-color:rgba(255,255,255,.25);color:#fff}

/* ── shell ── */
.wrap{flex:1;max-width:1080px;width:100%;margin:0 auto;padding:24px 18px 60px}
.crumb{font-size:calc(12.5px + var(--ts));color:var(--silver);
  margin-bottom:18px;display:flex;align-items:center;gap:7px;
  flex-wrap:wrap;font-weight:600}
.crumb b{color:var(--fg)}
.crumb span.bk{color:var(--arencon);cursor:pointer}
.crumb span.bk:hover{text-decoration:underline}
h1.pg{font-size:calc(22px + var(--ts));font-weight:800;
  letter-spacing:-.3px;margin-bottom:4px}
.sub{color:var(--steel);font-size:calc(13.5px + var(--ts));
  margin-bottom:22px}
.empty{text-align:center;color:var(--silver);padding:60px 20px;
  font-size:calc(14px + var(--ts))}

/* ── card grid (Hub project-card pattern) ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));
  gap:14px}
.card{background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--radius);box-shadow:0 1px 4px rgba(0,0,0,.06);
  padding:18px 18px 16px;cursor:pointer;transition:all .25s;
  display:flex;flex-direction:column;gap:8px;
  -webkit-user-select:none;user-select:none}
.card:hover{border-color:var(--arencon);box-shadow:var(--shadow-lg);
  transform:translateY(-2px)}
.card .cat{font-size:calc(10.5px + var(--ts));font-weight:800;
  letter-spacing:.6px;text-transform:uppercase;color:var(--arencon)}
.card .nm{font-size:calc(15.5px + var(--ts));font-weight:700;
  line-height:1.3;color:var(--fg)}
.card .ds{font-size:calc(12.5px + var(--ts));color:var(--steel);
  line-height:1.45;flex:1}
.card .ft{display:flex;align-items:center;gap:8px;
  font-size:calc(11.5px + var(--ts));color:var(--silver);margin-top:4px}
.pill{font-size:calc(11px + var(--ts));font-weight:700;padding:3px 10px;
  border-radius:20px}
.pill.done,.pill.score{background:var(--ok-bg);color:var(--ok)}
.pill.todo{background:var(--smoke);color:var(--steel)}
.pill.low{background:var(--err-bg);color:var(--err)}

/* ── module viewer ── */
.viewer{background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.media{background:var(--navy);width:100%;aspect-ratio:16/9;
  display:flex;align-items:center;justify-content:center}
.media iframe,.media video{width:100%;height:100%;border:0}
.media .ph{color:var(--silver);font-size:calc(13.5px + var(--ts));
  text-align:center;padding:30px}
.docbox iframe{width:100%;height:72vh;border:0}
.docbox img{width:100%;display:block}
.txtbox{padding:26px 30px;line-height:1.7;font-size:calc(14.5px + var(--ts));
  white-space:pre-wrap;max-height:72vh;overflow:auto;color:var(--fg)}
.vbody{padding:22px 26px}
.vbody h2{font-size:calc(18.5px + var(--ts));font-weight:700;
  margin-bottom:6px;color:var(--fg)}
.vbody .vds{color:var(--steel);font-size:calc(13.5px + var(--ts));
  margin-bottom:18px}

/* ── buttons (Hub dash-btn system) ── */
.btn{font-family:inherit;font-size:calc(13px + var(--ts));font-weight:600;
  border:none;border-radius:8px;padding:11px 20px;cursor:pointer;
  transition:all .2s}
.btn.pri{background:linear-gradient(135deg,var(--arencon),var(--arencon-mid));
  color:#fff;box-shadow:0 2px 6px rgba(156,39,66,.2)}
.btn.pri:hover{box-shadow:0 4px 12px rgba(156,39,66,.3);
  transform:translateY(-1px)}
.btn.gh{background:var(--bg);color:var(--steel);
  border:1.5px solid var(--border)}
.btn.gh:hover{border-color:var(--arencon);color:var(--arencon);
  background:var(--arencon-light)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

/* ── click-quiz ── */
.quiz{padding:24px 26px;border-top:1.5px solid var(--border)}
.quiz h3{font-size:calc(16.5px + var(--ts));font-weight:700;
  margin-bottom:4px;color:var(--fg)}
.quiz .qsub{color:var(--steel);font-size:calc(12.5px + var(--ts));
  margin-bottom:18px}
.qcard{border:1.5px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px;background:var(--card)}
.qcard .qn{font-weight:700;font-size:calc(14.5px + var(--ts));
  margin-bottom:14px;line-height:1.4;color:var(--fg)}
.opt{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;
  border:1.5px solid var(--border);border-radius:9px;margin-bottom:9px;
  cursor:pointer;font-size:calc(13.5px + var(--ts));line-height:1.4;
  transition:all .15s;background:#fff}
.opt:hover{border-color:var(--silver);background:var(--bg)}
.opt.sel{border-color:var(--arencon);background:var(--arencon-light)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--err);background:var(--err-bg)}
.opt .mk{width:22px;height:22px;border-radius:50%;
  border:2px solid var(--border);flex:none;margin-top:1px;display:flex;
  align-items:center;justify-content:center;font-size:calc(12px + var(--ts));
  font-weight:700;color:var(--steel)}
.opt.sel .mk{border-color:var(--arencon);background:var(--arencon);
  color:#fff}
.opt.correct .mk{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong .mk{border-color:var(--err);background:var(--err);color:#fff}
.why{margin-top:10px;padding:12px 15px;background:var(--arencon-light);
  border-radius:8px;font-size:calc(12.5px + var(--ts));line-height:1.5;
  color:var(--fg)}
.why b{color:var(--arencon)}
.result{text-align:center;padding:32px 20px}
.result .sc{font-size:calc(42px + var(--ts));font-weight:800;
  margin-bottom:4px;letter-spacing:-1px}
.result .sc.pass{color:var(--ok)}
.result .sc.fail{color:var(--err)}
.result .rl{color:var(--steel);font-size:calc(13.5px + var(--ts));
  margin-bottom:20px}

/* ── auth overlay ── */
#authOv{position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;font-size:calc(15px + var(--ts));
  color:var(--steel)}
#authOv .sp{width:34px;height:34px;border:3px solid var(--border);
  border-top-color:var(--arencon);border-radius:50%;
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:560px){.wrap{padding:16px 13px 50px}
  .hdr .ttl{font-size:calc(15px + var(--ts))}}
</style>
</head>
<body>

<div id="authOv"><div class="sp"></div><div id="authMsg">Checking access…</div></div>

<header class="hdr">
  <a class="logo" id="logoLink" href="#"><img id="logoImg" alt="ARENCON"></a>
  <div class="ttl">Training Center</div>
  <div class="sp"></div>
  <div class="who" id="whoBox"></div>
  <button class="lo" id="logoutBtn">Sign out</button>
</header>

<div class="wrap" id="main">
  <div class="crumb" id="crumb"></div>
  <div id="view"></div>
</div>

const PORTAL='ARENCON_Intranet_Portal.html';   /* logo link only */

document.getElementById('logoImg').src=LOGO;

/* ─── tiny Supabase REST helpers (no SDK; small + stable) ─── */
let SESSION=null, ME=null;
function sbToken(){
  /* Borrows the Project Hub's real session. Hub stores it as a plain
     'sb-access-token' key (see Hub auth shim) — NOT the SDK format. */
  try{ return localStorage.getItem('sb-access-token')||null; }
  catch(e){ return null; }
}
async function sbGet(path){
  const t=SESSION||SB_ANON;
  const r=await fetch(SB_URL+'/rest/v1/'+path,{
    headers:{apikey:SB_ANON,Authorization:'Bearer '+t}});
  if(!r.ok) throw new Error('GET '+path+' '+r.status);
  return r.json();
}
async function sbUpsert(table,row,onConflict){
  const r=await fetch(SB_URL+'/rest/v1/'+table+'?on_conflict='+onConflict,{
    method:'POST',
    headers:{apikey:SB_ANON,Authorization:'Bearer '+SESSION,
      'Content-Type':'application/json',
      Prefer:'resolution=merge-duplicates,return=representation'},
    body:JSON.stringify(row)});
  if(!r.ok) throw new Error('upsert '+r.status);
  return r.json();
}

/* ─── AUTH GATE — every page checks; no session → portal ─── */
async function gate(){
  const tok=sbToken();
  if(!tok){ return bounce(); }
  try{
    const r=await fetch(SB_URL+'/auth/v1/user',{
      headers:{apikey:SB_ANON,Authorization:'Bearer '+tok}});
    if(!r.ok) return bounce();
    const u=await r.json();
    SESSION=tok;
    const prof=await sbGet('profiles?id=eq.'+u.id+'&select=id,full_name,role');
    ME=prof[0]||{id:u.id,full_name:u.email,role:'viewer'};
    document.getElementById('whoBox').textContent=
      (ME.full_name||u.email)+' · '+ME.role;
    document.getElementById('authOv').style.display='none';
    route();
  }catch(e){ bounce(); }
}
function bounce(){
  document.getElementById('authMsg').textContent=
    'Sign-in required — redirecting…';
  setTimeout(()=>{ location.href=LOGIN; },900);
}
document.getElementById('logoutBtn').onclick=()=>{
  try{ localStorage.removeItem('sb-access-token');
       localStorage.removeItem('sb-refresh-token'); }catch(e){}
  location.href=LOGIN;
};

/* ─── state + router ─── */
let COURSES=[], MODS=[], PROG={};
let cur={course:null};

async function loadData(){
  COURSES=await sbGet('tc_courses?status=eq.active&select=*&order=sort_order');
  MODS=await sbGet('tc_modules?status=eq.active&select=*&order=sort_order');
  try{
    const p=await sbGet('tc_progress?user_id=eq.'+ME.id+'&select=*');
    PROG={}; p.forEach(r=>PROG[r.module_id]=r);
  }catch(e){ PROG={}; }
}
async function route(){
  if(!COURSES.length) await loadData();
  const h=location.hash.slice(1);
  if(h.startsWith('m/')) return renderModule(h.slice(2));
  if(h.startsWith('c/')) return renderCourse(h.slice(2));
  renderHome();
}
window.addEventListener('hashchange',route);

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ─── home: course grid ─── */
function renderHome(){
  cur={course:null};
  document.getElementById('crumb').innerHTML='<b>All Courses</b>';
  const V=document.getElementById('view');
  if(!COURSES.length){
    V.innerHTML='<h1 class="pg">Training Center</h1>'+
      '<div class="empty">No courses published yet.<br>'+
      'Content is added by an administrator.</div>';return;
  }
  let h='<h1 class="pg">Training Center</h1>'+
    '<div class="sub">Pick a course to begin. Your progress saves automatically.</div>'+
    '<div class="grid">';
  COURSES.forEach(c=>{
    const ms=MODS.filter(m=>m.course_id===c.id);
    const done=ms.filter(m=>PROG[m.id]&&PROG[m.id].viewed).length;
    h+=`<div class="card" onclick="location.hash='c/${c.id}'">
      <div class="cat">${esc(c.category)}</div>
      <div class="nm">${esc(c.title)}</div>
      <div class="ds">${esc(c.description||'')}</div>
      <div class="ft"><span class="pill ${done===ms.length&&ms.length?'done':'todo'}">
      ${done}/${ms.length} done</span></div></div>`;
  });
  V.innerHTML=h+'</div>';
}

/* ─── course: module list ─── */
function renderCourse(cid){
  const c=COURSES.find(x=>x.id===cid); if(!c) return renderHome();
  cur={course:c};
  document.getElementById('crumb').innerHTML=
    `<span class="bk" onclick="location.hash=''">All Courses</span> ›
     <b>${esc(c.title)}</b>`;
  const ms=MODS.filter(m=>m.course_id===cid);
  let h=`<h1 class="pg">${esc(c.title)}</h1>
    <div class="sub">${esc(c.description||'')}</div><div class="grid">`;
  if(!ms.length) h+='</div><div class="empty">No modules in this course yet.</div>';
  ms.forEach(m=>{
    const p=PROG[m.id];
    let pill='<span class="pill todo">Not started</span>';
    if(p&&p.quiz_score!=null) pill=`<span class="pill ${p.quiz_score>=80?'score':'low'}">Quiz ${p.quiz_score}%</span>`;
    else if(p&&p.viewed) pill='<span class="pill done">Viewed</span>';
    h+=`<div class="card" onclick="location.hash='m/${m.id}'">
      <div class="cat">${esc(m.source_type||'module')}</div>
      <div class="nm">${esc(m.title)}</div>
      <div class="ds">${esc(m.description||'')}</div>
      <div class="ft">${pill}</div></div>`;
  });
  document.getElementById('view').innerHTML=h+'</div>';
}

/* ─── module viewer + quiz ─── */
function ytEmbed(u){
  if(!u) return '';
  const m=u.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{6,})/);
  return m?'https://www.youtube.com/embed/'+m[1]:u;
}
function vimeoEmbed(u){
  if(!u) return '';
  const m=u.match(/vimeo\.com\/(\d+)/);
  return m?'https://player.vimeo.com/video/'+m[1]:u;
}
function r2Url(key){
  return 'https://arencon-r2-worker.hezhendong999.workers.dev/'+key;
}
function renderModule(mid){
  const m=MODS.find(x=>x.id===mid); if(!m) return renderHome();
  const c=COURSES.find(x=>x.id===m.course_id);
  cur={course:c};
  document.getElementById('crumb').innerHTML=
    `<span class="bk" onclick="location.hash=''">All Courses</span> ›
     <span class="bk" onclick="location.hash='c/${c?c.id:''}'">${esc(c?c.title:'')}</span> ›
     <b>${esc(m.title)}</b>`;
  let media='';
  const st=m.source_type, su=m.source_url;
  if(st==='youtube'&&su) media=`<div class="media"><iframe src="${ytEmbed(su)}" allowfullscreen allow="accelerometer;encrypted-media;picture-in-picture"></iframe></div>`;
  else if(st==='vimeo'&&su) media=`<div class="media"><iframe src="${vimeoEmbed(su)}" allowfullscreen></iframe></div>`;
  else if(st==='r2'&&su) media=`<div class="media"><video src="${r2Url(su)}" controls playsinline></video></div>`;
  else if(st==='image'&&su) media=`<div class="docbox"><img src="${/^https?:/.test(su)?su:r2Url(su)}" alt=""></div>`;
  else if(st==='doc'&&su) media=`<div class="docbox"><iframe src="${/^https?:/.test(su)?su:r2Url(su)}"></iframe></div>`;
  else if(st==='text'&&m.source_text) media=`<div class="txtbox">${esc(m.source_text)}</div>`;
  else media='<div class="media"><div class="ph">No media attached to this module.</div></div>';

  const _bank=Array.isArray(m.question_bank)?m.question_bank:[];
  const _legacy=Array.isArray(m.quiz)?m.quiz:[];
  const hasQuiz=_bank.length>0||_legacy.length>0;
  let h=`<div class="viewer">${media}
    <div class="vbody"><h2>${esc(m.title)}</h2>
    <div class="vds">${esc(m.description||'')}</div>
    <div class="btnrow">
      <button class="btn pri" id="markBtn">Mark as viewed</button>
      ${hasQuiz?'<button class="btn gh" id="quizBtn">Start quiz</button>':''}
    </div></div>
    <div id="quizMount"></div></div>`;
  document.getElementById('view').innerHTML=h;

  document.getElementById('markBtn').onclick=async()=>{
    await saveProg(m.id,{viewed:true});
    document.getElementById('markBtn').textContent='✓ Viewed';
    document.getElementById('markBtn').classList.replace('pri','gh');
  };
  if(hasQuiz) document.getElementById('quizBtn').onclick=()=>startQuiz(m);
}

async function saveProg(mid,patch){
  const ex=PROG[mid]||{};
  const row={user_id:ME.id,module_id:mid,
    viewed:patch.viewed!=null?patch.viewed:(ex.viewed||false),
    quiz_score:patch.quiz_score!=null?patch.quiz_score:(ex.quiz_score??null),
    quiz_data:patch.quiz_data!=null?patch.quiz_data:(ex.quiz_data||null),
    attempts:(ex.attempts||0)+(patch.bumpAttempt?1:0),
    updated_at:new Date().toISOString()};
  try{ const res=await sbUpsert('tc_progress',row,'user_id,module_id');
    PROG[mid]=res[0]||row; }catch(e){ console.warn('progress save',e); }
}

/* click-only quiz — reads question_bank (random draw of draw_size),
   falls back to legacy m.quiz; grades vs pass_threshold; records a
   full attempt row in tc_attempts plus the existing tc_progress. */
function startQuiz(m){
  const bank=Array.isArray(m.question_bank)?m.question_bank:[];
  const legacy=Array.isArray(m.quiz)?m.quiz:[];
  /* normalize to the shape the renderer already uses; carry topic
     through for the later teaching brain (harmless to ignore now). */
  function norm(it){ return {q:String(it.q||''),opts:Array.isArray(it.opts)?it.opts:[],
    answer:typeof it.answer==='number'?it.answer:0,why:String(it.why||''),
    topic:String(it.topic||'')}; }
  let pool, Q;
  if(bank.length){
    pool=bank.map(norm).filter(x=>x.q&&x.opts.length);
    const want=Math.max(1,Math.min(parseInt(m.draw_size,10)||10,pool.length));
    /* Fisher-Yates shuffle, take `want` — fresh subset each attempt */
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]]=[pool[j],pool[i]]; }
    Q=pool.slice(0,want);
  } else {
    Q=legacy.map(norm).filter(x=>x.q&&x.opts.length);   /* legacy: whole set, as before */
  }
  if(!Q.length) return;
  const passMark=Math.max(1,Math.min(parseInt(m.pass_threshold,10)||70,100));
  const startedAt=new Date();
  let answered=Array(Q.length).fill(null), recorded=false;
  const mount=document.getElementById('quizMount');

  async function recordAttempt(sc){
    if(recorded) return; recorded=true;
    const now=new Date();
    /* tc_attempts: never send created_by (FK/RLS reject — project rule) */
    const arow={user_id:ME.id,module_id:m.id,
      started_at:startedAt.toISOString(),submitted_at:now.toISOString(),
      duration_sec:Math.max(0,Math.round((now-startedAt)/1000)),
      score:sc,total:Q.length,
      asked:Q.map(x=>({q:x.q,opts:x.opts,answer:x.answer,why:x.why,topic:x.topic})),
      answers:answered,status:'completed'};
    try{ await sbUpsert('tc_attempts',arow,'id'); }
    catch(e){ console.warn('attempt save',e); }
    saveProg(m.id,{viewed:true,quiz_score:sc,bumpAttempt:true,
      quiz_data:{answers:answered,at:now.toISOString()}});
  }

  function draw(){
    let h='<div class="quiz"><h3>Knowledge check</h3>'+
      '<div class="qsub">Tap an answer. You\'ll see the reasoning after each. '+
      passMark+'% to pass'+(bank.length?' · '+Q.length+' question'+(Q.length===1?'':'s')+' this attempt':'')+'.</div>';
    Q.forEach((q,i)=>{
      h+=`<div class="qcard"><div class="qn">${i+1}. ${esc(q.q)}</div>`;
      q.opts.forEach((o,j)=>{
        let cls='opt';const a=answered[i];
        if(a!=null){
          if(j===q.answer) cls+=' correct';
          else if(j===a) cls+=' wrong';
        }
        h+=`<div class="${cls}" ${a==null?`onclick="window.__pick(${i},${j})"`:''}>
          <div class="mk">${a!=null?(j===q.answer?'✓':(j===a?'✕':String.fromCharCode(65+j))):String.fromCharCode(65+j)}</div>
          <div>${esc(o)}</div></div>`;
      });
      if(answered[i]!=null&&q.why)
        h+=`<div class="why"><b>Why:</b> ${esc(q.why)}</div>`;
      h+='</div>';
    });
    const allDone=answered.every(a=>a!=null);
    if(allDone){
      const sc=Math.round(answered.filter((a,i)=>a===Q[i].answer).length/Q.length*100);
      const pass=sc>=passMark;
      h+=`<div class="result"><div class="sc ${pass?'pass':'fail'}">${sc}%</div>
        <div class="rl">${pass?('Passed — '+passMark+'% required. Move on when ready.'):('Not yet — '+passMark+'% needed. Review the reasoning above and try again.')}</div>
        <button class="btn gh" onclick="location.hash='c/${m.course_id}'">Back to course</button></div>`;
      recordAttempt(sc);
    }
    mount.innerHTML=h;
    mount.scrollIntoView({behavior:'smooth',block:'start'});
  }
  window.__pick=(i,j)=>{ if(answered[i]==null){ answered[i]=j; draw(); } };
  draw();
}

gate();
</script>
