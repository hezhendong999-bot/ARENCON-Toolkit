<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" sizes="192x192" href="arencon-icon-192.png">
<link rel="apple-touch-icon" href="arencon-icon-192.png">
<title>ARENCON Training Center</title>
<!-- S331 #auth: universal sign-in gate. Must load FIRST. -->
<script src="shared/auth-gate.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
/* ═══ ARENCON design language — matched to Hub / FRT / pump tools ═══
   Same token set as admin re-skin. Canonical from Project_Hub :root. */
:root{
  --arencon:#9C2742; --arencon-mid:#7d1f35; --arencon-light:#F8E8EC;
  --navy:#1B2438; --navy-mid:#243048; --navy-light:#2D3A52;
  --steel:#5A6473; --silver:#94A3B8;
  --smoke:#F1F5F9; --border:#E2E8F0; --white:#FFFFFF;
  --card:#ffffff; --fg:#1E293B; --bg:#F8FAFC;
  --ok:#1A7A4A; --ok-bg:#D4EDDA; --err:#C0392B; --err-bg:#FADBD8;
  --warn:#B7791F;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 6px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 10px 25px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.04);
  --radius:10px; --radius-lg:14px; --ts:0px;
  font-family:Calibri,'Segoe UI',system-ui,-apple-system,sans-serif;
}
body.text-m{--ts:2px;} body.text-l{--ts:4px;}
body.dark-mode{
  --bg:#0f1318; --card:#1e2533; --smoke:#0f1318;
  --border:#2a3040; --fg:#d0d8f0; --steel:#8a94b0; --silver:#8a94b0;
  --navy:#0f1318; --navy-mid:#1e2533; --navy-light:#2a3040;
  --arencon-light:#2D1520;
  --shadow:0 1px 3px rgba(0,0,0,.3);
  --shadow-md:0 4px 6px rgba(0,0,0,.25);
  --shadow-lg:0 10px 25px rgba(0,0,0,.3);
}
body.dark-mode .hdr{background:linear-gradient(135deg,#0F172A 0%,#1E293B 100%)}
body.dark-mode .hdr img{background:#fff;border-color:#fff}
body.dark-mode input,body.dark-mode select,body.dark-mode textarea{
  background:var(--smoke);border-color:var(--border);color:var(--fg)}
body.dark-mode .btn.gh{background:var(--card);color:var(--fg);border-color:var(--border)}
body.dark-mode .btn.pri{background:var(--arencon);color:#fff}
body.dark-mode .lo{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
body.dark-mode .tagp{background:var(--smoke);border-color:var(--border);color:var(--steel)}
body.dark-mode .qcard{background:var(--card);border-color:var(--border)}
body.dark-mode .opt{background:var(--smoke);border-color:var(--border);color:var(--fg)}
body.dark-mode .why{background:#1a2030;border-color:#2a3040;color:var(--fg)}
body.dark-mode .opt.picked{background:#243048;border-color:var(--steel)}
body.dark-mode .result{background:var(--card);border-color:var(--border)}
body.dark-mode .media{background:#0a0d12}
body.dark-mode .viewer{background:var(--card);border-color:var(--border)}
body.dark-mode .aiBox{background:#1a2030;color:var(--fg)}
body.dark-mode .twStrip{background:var(--card);border-color:var(--border)}
body.dark-mode .chat{background:var(--card)}
body.dark-mode .chat .cmsg.a{background:#1a2030}
body.dark-mode .chat .crow textarea{background:#0f1320;color:var(--fg)}
body.dark-mode .flagBx{background:var(--card)}
body.dark-mode .flagBx .flagCtx{background:#0f1320}
body.dark-mode .flagBx textarea{background:#0f1320;color:var(--fg)}
body.dark-mode .flagBx .flagOk{background:#1b3a22;border-color:#2e6b3a;color:#a5d6a7}
body.dark-mode .flagBx .flagErr{background:#3a1b1b;border-color:#6b2e2e;color:#ef9a9a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Calibri,'Segoe UI',system-ui,sans-serif;color:var(--fg);
  background:var(--bg);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;
  font-size:calc(14px + var(--ts))}

/* ── header ── */
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 100%);
  display:flex;align-items:center;padding:10px 16px;gap:10px;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.hdr a.logo{display:flex;align-items:center;flex-shrink:0}
.hdr img{height:32px;width:auto;background:#fff;padding:4px 8px;
  border-radius:7px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:block;
  transition:transform .2s}
.hdr img:hover{transform:scale(1.03)}
.hdr .ttl{font-size:calc(17px + var(--ts));font-weight:700;color:#fff;
  white-space:nowrap;letter-spacing:-.2px;flex-shrink:0}
.hdr .sp{flex:1;min-width:0}
.hdr .who{display:flex;align-items:center;gap:10px;
  color:rgba(255,255,255,.92);font-size:calc(13px + var(--ts));
  font-weight:500;white-space:nowrap}
.hdr .lo{background:rgba(255,255,255,.1);color:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.12);padding:7px 14px;border-radius:8px;
  cursor:pointer;font-weight:600;font-size:calc(12.5px + var(--ts));
  font-family:inherit;transition:all .2s;backdrop-filter:blur(4px);
  flex-shrink:0}
.hdr .lo:hover{background:rgba(255,255,255,.2);
  border-color:rgba(255,255,255,.25);color:#fff}

/* ── shell ── */
.wrap{flex:1;max-width:1080px;width:100%;margin:0 auto;padding:24px 18px 60px}
.crumb{font-size:calc(12.5px + var(--ts));color:var(--silver);
  margin-bottom:18px;display:flex;align-items:center;gap:7px;
  flex-wrap:wrap;font-weight:600}
.crumb b{color:var(--fg)}
.crumb span.bk{color:var(--arencon);cursor:pointer}
.crumb span.bk:hover{text-decoration:underline}
h1.pg{font-size:calc(22px + var(--ts));font-weight:800;
  letter-spacing:-.3px;margin-bottom:4px}
.sub{color:var(--steel);font-size:calc(13.5px + var(--ts));
  margin-bottom:22px}
.empty{text-align:center;color:var(--silver);padding:60px 20px;
  font-size:calc(14px + var(--ts))}

/* ── card grid (Hub project-card pattern) ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));
  gap:14px}
.card{background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--radius);box-shadow:0 1px 4px rgba(0,0,0,.06);
  padding:18px 18px 16px;cursor:pointer;transition:all .25s;
  display:flex;flex-direction:column;gap:8px;
  -webkit-user-select:none;user-select:none}
.card:hover{border-color:var(--arencon);box-shadow:var(--shadow-lg);
  transform:translateY(-2px)}
.card .cat{font-size:calc(10.5px + var(--ts));font-weight:800;
  letter-spacing:.6px;text-transform:uppercase;color:var(--arencon)}
.card .nm{font-size:calc(15.5px + var(--ts));font-weight:700;
  line-height:1.3;color:var(--fg)}
.card .ds{font-size:calc(12.5px + var(--ts));color:var(--steel);
  line-height:1.45;flex:1}
.card .ft{display:flex;align-items:center;gap:8px;
  font-size:calc(11.5px + var(--ts));color:var(--silver);margin-top:4px}
.pill{font-size:calc(11px + var(--ts));font-weight:700;padding:3px 10px;
  border-radius:20px}
.pill.done,.pill.score{background:var(--ok-bg);color:var(--ok)}
.pill.todo{background:var(--smoke);color:var(--steel)}
.pill.low{background:var(--err-bg);color:var(--err)}

/* ── module viewer ── */
.viewer{background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.media{background:var(--navy);width:100%;aspect-ratio:16/9;
  display:flex;align-items:center;justify-content:center}
.media iframe,.media video{width:100%;height:100%;border:0}
.media .ph{color:var(--silver);font-size:calc(13.5px + var(--ts));
  text-align:center;padding:30px}
.docbox iframe{width:100%;height:72vh;border:0}
.docbox img{width:100%;display:block}
.txtbox{padding:26px 30px;line-height:1.7;font-size:calc(14.5px + var(--ts));
  white-space:pre-wrap;max-height:72vh;overflow:auto;color:var(--fg)}
.vbody{padding:22px 26px}
.vbody h2{font-size:calc(18.5px + var(--ts));font-weight:700;
  margin-bottom:6px;color:var(--fg)}
.vbody .vds{color:var(--steel);font-size:calc(13.5px + var(--ts));
  margin-bottom:18px}

/* ── slice 2d: attached resources (downloadable reference files) ── */
.attBlock{padding:18px 26px 22px;border-top:1px solid var(--border)}
.attHd{font-size:calc(13px + var(--ts));font-weight:600;color:var(--steel);
  margin-bottom:14px;text-transform:uppercase;letter-spacing:.3px}
.attImgs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.attImg{width:140px;height:100px;border-radius:8px;overflow:hidden;
  border:1px solid var(--border);background:var(--bg);position:relative;
  display:flex;align-items:center;justify-content:center}
.attImg img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.attImgLoading,.attImgErr{color:var(--steel);font-size:calc(11.5px + var(--ts));
  padding:6px;text-align:center}
.attList{display:flex;flex-direction:column;gap:8px}
.attRow{display:flex;align-items:center;gap:12px;padding:10px 14px;
  border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.attRow .attIcon{font-size:20px;flex-shrink:0}
.attRow .attMeta{flex:1;min-width:0;overflow:hidden}
.attRow .attName{font-weight:600;color:var(--fg);
  font-size:calc(13px + var(--ts));white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.attRow .attSub{color:var(--steel);font-size:calc(11.5px + var(--ts));margin-top:2px}
.attRow .attDl{background:var(--arencon);color:#fff;border:none;
  padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;
  font-family:'Calibri',sans-serif;font-size:calc(12.5px + var(--ts));
  white-space:nowrap;transition:opacity .15s}
.attRow .attDl:hover:not(:disabled){opacity:.9}
.attRow .attDl:disabled{background:var(--silver);cursor:not-allowed}
body.dark-mode .attRow{background:#1a2030}
body.dark-mode .attImg{background:#1a2030}

/* ── buttons (Hub dash-btn system) ── */
.btn{font-family:inherit;font-size:calc(13px + var(--ts));font-weight:600;
  border:none;border-radius:8px;padding:11px 20px;cursor:pointer;
  transition:all .2s}
.btn.pri{background:linear-gradient(135deg,var(--arencon),var(--arencon-mid));
  color:#fff;box-shadow:0 2px 6px rgba(156,39,66,.2)}
.btn.pri:hover{box-shadow:0 4px 12px rgba(156,39,66,.3);
  transform:translateY(-1px)}
.btn.gh{background:var(--bg);color:var(--steel);
  border:1.5px solid var(--border)}
.btn.gh:hover{border-color:var(--arencon);color:var(--arencon);
  background:var(--arencon-light)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

/* ── click-quiz ── */
.quiz{padding:24px 26px;border-top:1.5px solid var(--border)}
.quiz h3{font-size:calc(16.5px + var(--ts));font-weight:700;
  margin-bottom:4px;color:var(--fg)}
.quiz .qsub{color:var(--steel);font-size:calc(12.5px + var(--ts));
  margin-bottom:18px}
.qcard{border:1.5px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px;background:var(--card)}
.qcard .qn{font-weight:700;font-size:calc(14.5px + var(--ts));
  margin-bottom:14px;line-height:1.4;color:var(--fg)}
.opt{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;
  border:1.5px solid var(--border);border-radius:9px;margin-bottom:9px;
  cursor:pointer;font-size:calc(13.5px + var(--ts));line-height:1.4;
  transition:all .15s;background:#fff}
.opt:hover{border-color:var(--silver);background:var(--bg)}
.opt.sel{border-color:var(--arencon);background:var(--arencon-light)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--err);background:var(--err-bg)}
.opt.picked{border-color:var(--steel);background:var(--smoke)}
.opt .mk{width:22px;height:22px;border-radius:50%;
  border:2px solid var(--border);flex:none;margin-top:1px;display:flex;
  align-items:center;justify-content:center;font-size:calc(12px + var(--ts));
  font-weight:700;color:var(--steel)}
.opt.sel .mk{border-color:var(--arencon);background:var(--arencon);
  color:#fff}
.opt.correct .mk{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong .mk{border-color:var(--err);background:var(--err);color:#fff}
.opt.picked .mk{border-color:var(--steel);background:var(--steel);color:#fff}
.why{margin-top:10px;padding:12px 15px;background:var(--arencon-light);
  border-radius:8px;font-size:calc(12.5px + var(--ts));line-height:1.5;
  color:var(--fg)}
.why b{color:var(--arencon)}
.result{text-align:center;padding:32px 20px}
.result .sc{font-size:calc(42px + var(--ts));font-weight:800;
  margin-bottom:4px;letter-spacing:-1px}
.result .sc.pass{color:var(--ok)}
.result .sc.fail{color:var(--err)}
.result .rl{color:var(--steel);font-size:calc(13.5px + var(--ts));
  margin-bottom:20px}

/* ── slice 2a: AI explanation block + topic-weakness strip ──
   slice 2c polish: AI block is the primary review content; the
   author's "why" is demoted to a quiet secondary note. */
.aiBox{margin-top:12px;padding:14px 18px;background:var(--bg);
  border-left:4px solid var(--arencon);border-radius:0 10px 10px 0;
  font-size:calc(13.5px + var(--ts));line-height:1.55;color:var(--fg)}
.aiBox b{color:var(--arencon);display:block;margin-bottom:6px;
  font-size:calc(12.5px + var(--ts));letter-spacing:.2px;font-weight:700}
.aiBox.load{color:var(--steel);font-style:italic;border-left-color:var(--silver)}
.aiBox.err{color:var(--steel);font-style:italic;border-left-color:var(--silver)}
.aiBox .retry{display:inline-block;margin-left:8px;color:var(--arencon);
  cursor:pointer;font-weight:600;text-decoration:underline;
  text-underline-offset:3px;font-style:normal}
.aiAsk{display:inline-block;margin-top:10px;color:var(--arencon);
  cursor:pointer;font-weight:600;font-size:calc(12.5px + var(--ts));
  text-decoration:underline;text-underline-offset:3px}
.aiAsk.disabled{color:var(--steel);text-decoration:none;cursor:default;font-weight:500}
/* slice 2c: flag-for-review link, always present on every reviewed question */
.aiFlag{display:inline-block;margin-top:10px;margin-left:14px;color:var(--steel);
  cursor:pointer;font-size:calc(12px + var(--ts));text-decoration:underline;
  text-underline-offset:3px}
.aiFlag:hover{color:var(--arencon)}
/* author "why" demoted (slice 2c) */
.qcard.rev .why{color:var(--steel);font-size:calc(12px + var(--ts));
  margin-top:10px;padding:8px 12px;background:transparent;
  border-left:2px solid var(--silver);border-radius:0;line-height:1.5}
.qcard.rev .why b{color:var(--steel);font-weight:600;
  text-transform:none;letter-spacing:0;font-size:calc(11.5px + var(--ts))}
.chat{margin-top:12px;border:1px solid var(--border);border-radius:10px;
  background:var(--card);padding:14px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.04)}
.chat .clog{display:flex;flex-direction:column;gap:8px;max-height:420px;
  overflow-y:auto;padding:4px 2px}
.chat .cmsg{padding:9px 13px;border-radius:12px;
  font-size:calc(13px + var(--ts));line-height:1.5;max-width:88%;
  word-wrap:break-word;white-space:pre-wrap}
.chat .cmsg.u{background:var(--arencon);color:#fff;align-self:flex-end;
  border-bottom-right-radius:4px}
.chat .cmsg.a{background:var(--bg);color:var(--fg);align-self:flex-start;
  border-bottom-left-radius:4px;border:1px solid var(--border)}
.chat .cmsg.s{align-self:center;background:transparent;color:var(--steel);
  font-style:italic;font-size:calc(11.5px + var(--ts));padding:4px 8px;max-width:100%;text-align:center}
.chat .crow{display:flex;gap:10px;align-items:flex-end}
.chat .crow textarea{flex:1;min-height:44px;max-height:140px;resize:vertical;
  padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--fg);
  font-family:'Calibri',sans-serif;font-size:calc(13.5px + var(--ts));
  line-height:1.45;outline:none;transition:border-color .15s}
.chat .crow textarea:focus{border-color:var(--arencon)}
.chat .crow textarea:disabled{opacity:.5;cursor:not-allowed}
.chat .cbtn{padding:10px 20px;background:var(--arencon);color:#fff;
  border:none;border-radius:8px;cursor:pointer;font-weight:600;
  font-family:'Calibri',sans-serif;font-size:calc(13.5px + var(--ts));
  white-space:nowrap;transition:opacity .15s}
.chat .cbtn:hover:not(:disabled){opacity:.9}
.chat .cbtn:disabled{background:var(--silver);cursor:not-allowed}
.chat .cbar{display:flex;justify-content:space-between;align-items:center;
  color:var(--steel);font-size:calc(11.5px + var(--ts));padding:0 2px}
.chat .cdone{cursor:pointer;color:var(--steel);text-decoration:underline;
  text-underline-offset:3px}
.twStrip{border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 16px;margin-bottom:16px;background:transparent}
.twStrip .twTit{font-weight:600;font-size:calc(12px + var(--ts));
  color:var(--steel);margin-bottom:8px;letter-spacing:.2px;text-transform:uppercase}
.twStrip .twRow{display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--border);
  font-size:calc(12.5px + var(--ts))}
.twStrip .twRow:last-child{border-bottom:none}
.twStrip .twTop{color:var(--fg);font-weight:500}
.twStrip .twMis{color:var(--err);font-weight:600;
  font-size:calc(12px + var(--ts))}

/* slice 2c: flag-for-review modal */
.flagOv{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:20px}
.flagBx{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:22px 24px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:0 10px 40px rgba(0,0,0,.25)}
.flagBx h3{margin:0 0 12px 0;color:var(--arencon);font-size:calc(17px + var(--ts));
  font-weight:700}
.flagBx .flagCtx{background:var(--bg);border:1px solid var(--border);
  border-radius:8px;padding:12px 14px;margin-bottom:14px;
  font-size:calc(12.5px + var(--ts));color:var(--steel);line-height:1.5;
  max-height:180px;overflow-y:auto}
.flagBx .flagCtx b{color:var(--fg)}
.flagBx label{display:block;margin-bottom:6px;color:var(--fg);
  font-weight:600;font-size:calc(13px + var(--ts))}
.flagBx textarea{width:100%;min-height:120px;max-height:280px;resize:vertical;
  padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--fg);font-family:'Calibri',sans-serif;
  font-size:calc(13.5px + var(--ts));line-height:1.45;outline:none;
  box-sizing:border-box}
.flagBx textarea:focus{border-color:var(--arencon)}
.flagBx .flagHint{color:var(--steel);font-size:calc(11.5px + var(--ts));
  margin-top:6px;margin-bottom:14px}
.flagBx .flagBar{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.flagBx .flagBar button{padding:10px 18px;border-radius:8px;border:none;
  font-family:'Calibri',sans-serif;font-size:calc(13px + var(--ts));
  font-weight:600;cursor:pointer}
.flagBx .flagBar .cancel{background:transparent;color:var(--steel);
  border:1.5px solid var(--border)}
.flagBx .flagBar .submit{background:var(--arencon);color:#fff}
.flagBx .flagBar .submit:disabled{background:var(--silver);cursor:not-allowed}
.flagBx .flagOk{background:#e8f5e9;border:1px solid #a5d6a7;color:#2e7d32;
  padding:12px 14px;border-radius:8px;font-size:calc(13px + var(--ts));
  margin-top:10px}
.flagBx .flagErr{background:#ffebee;border:1px solid #ef9a9a;color:#c62828;
  padding:12px 14px;border-radius:8px;font-size:calc(13px + var(--ts));
  margin-top:10px}

/* ── auth overlay ── */
#authOv{position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;font-size:calc(15px + var(--ts));
  color:var(--steel)}
#authOv .sp{width:34px;height:34px;border:3px solid var(--border);
  border-top-color:var(--arencon);border-radius:50%;

/* defensive: a service worker registered by a sibling tool on the same
   GitHub Pages origin (FRT installs one called sw.js) will silently
   intercept this page's Supabase auth fetch and hang it on
   "Checking access…". If one is controlling this page, unregister all
   SWs + clear caches + reload once. The sessionStorage timestamp
   prevents reload loops (5-second cooldown). No-op when no SW is
   controlling, so this is near-zero cost in the common case. */
(async function clearStaleSW(){
  try{
    if(!('serviceWorker' in navigator)) return;
    if(!navigator.serviceWorker.controller) return;
    const last=parseInt(sessionStorage.getItem('tc_sw_last')||'0',10);
    if(Date.now()-last < 5000) return;
    sessionStorage.setItem('tc_sw_last', String(Date.now()));
    const regs=await navigator.serviceWorker.getRegistrations();
    for(const r of regs){ try{ await r.unregister(); }catch(_){} }
    const keys=await caches.keys();
    for(const k of keys){ try{ await caches.delete(k); }catch(_){} }
    location.reload();
  }catch(_){}
})();

/* ─── tiny Supabase REST helpers (no SDK; small + stable) ─── */
let SESSION=null, ME=null;
function sbToken(){
  /* Borrows the Project Hub's real session. Hub stores it as a plain
     'sb-access-token' key (see Hub auth shim) — NOT the SDK format. */
  try{ return localStorage.getItem('sb-access-token')||null; }
  catch(e){ return null; }
}
async function sbGet(path){
  const t=SESSION||SB_ANON;
  const r=await fetch(SB_URL+'/rest/v1/'+path,{
    headers:{apikey:SB_ANON,Authorization:'Bearer '+t}});
  if(!r.ok) throw new Error('GET '+path+' '+r.status);
  return r.json();
}
async function sbUpsert(table,row,onConflict){
  const r=await fetch(SB_URL+'/rest/v1/'+table+'?on_conflict='+onConflict,{
    method:'POST',
    headers:{apikey:SB_ANON,Authorization:'Bearer '+SESSION,
      'Content-Type':'application/json',
      Prefer:'resolution=merge-duplicates,return=representation'},
    body:JSON.stringify(row)});
  if(!r.ok) throw new Error('upsert '+r.status);
  return r.json();
}
/* slice 2a: wrong-answer explainer (Edge Function).
   payload: { wrong_items, module_title?, module_code_ref? }.
   Caller must guard wrong_items.length>0 — EF also guards, but skipping
   the round-trip is cheaper. */
async function sbExplain(payload){
  const r=await fetch(SB_URL+'/functions/v1/training-explain-edge',{
    method:'POST',
    headers:{apikey:SB_ANON,Authorization:'Bearer '+SESSION,
      'Content-Type':'application/json'},
    body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('explain '+r.status);
  return r.json();
}
/* slice 2b: per-question tutor chat (Edge Function). Stateless EF —
   client sends full chat history each turn. Server enforces 10-turn
   cap and returns turn/max_turns in the response. */
async function sbChat(payload){
  const r=await fetch(SB_URL+'/functions/v1/training-chat-edge',{
    method:'POST',
    headers:{apikey:SB_ANON,Authorization:'Bearer '+SESSION,
      'Content-Type':'application/json'},
    body:JSON.stringify(payload)});
  const data=await r.json().catch(()=>({error:'bad json'}));
  if(!r.ok){
    const err=new Error('chat '+r.status);
    err.status=r.status; err.data=data; throw err;
  }
  return data;
}
/* slice 2c: flag-for-review feedback (Edge Function).
   Distills user complaint + raw context into structured record;
   writes to tc_questions_feedback. */
async function sbFeedback(payload){
  const r=await fetch(SB_URL+'/functions/v1/training-feedback-edge',{
    method:'POST',
    headers:{apikey:SB_ANON,Authorization:'Bearer '+SESSION,
      'Content-Type':'application/json'},

  if(!u) return '';

  return m?'https://www.youtube.com/embed/'+m[1]:u;
}
function vimeoEmbed(u){
  if(!u) return '';
  const m=u.match(/vimeo\.com\/(\d+)/);
  return m?'https://player.vimeo.com/video/'+m[1]:u;
}
function r2Url(key){

}
function renderModule(mid){

  else if(st==='doc'&&su) media=`<div class="docbox"><iframe src="${/^https?:/.test(su)?su:r2Url(su)}"></iframe></div>`;

/* ─── slice 2d: module attachments (downloadable resources) ─── */
const SIGNURL_EF='https://xsemvinxsyphjiaqgywv.supabase.co/functions/v1/training-attachment-signurl';
const MAX_INLINE_IMG=6;
function fmtBytes(n){
  if(!n) return '0 B';
  if(n<1024) return n+' B';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
  return (n/1024/1024).toFixed(1)+' MB';
}
function attIcon(mime){
  if(!mime) return '📎';
  if(mime.startsWith('image/')) return '🖼️';
  if(mime==='application/pdf') return '📄';
  if(mime.includes('word')) return '📝';
  if(mime.includes('sheet')||mime.includes('excel')) return '📊';
  if(mime.includes('presentation')||mime.includes('powerpoint')) return '📽️';
  if(mime.startsWith('text/')) return '📃';
  return '📎';
}
async function sbSignUrl(attachmentId){
  const r=await fetch(SIGNURL_EF,{method:'POST',
    headers:{apikey:SB_ANON,Authorization:'Bearer '+SESSION,
      'Content-Type':'application/json'},
    body:JSON.stringify({attachment_id:attachmentId})});
  if(!r.ok){ const t=await r.text(); throw new Error('sign '+r.status+': '+t.slice(0,160)); }
  return r.json();
}
async function loadAttachments(mid){
  const mount=document.getElementById('attMount');
  if(!mount) return;
  try{
    const r=await fetch(SB_URL+
      '/rest/v1/tc_module_attachments?module_id=eq.'+encodeURIComponent(mid)+
      '&select=id,file_name,mime_type,size_bytes,display_order'+
      '&order=display_order.asc',
      {headers:{apikey:SB_ANON,Authorization:'Bearer '+SESSION}});
    if(!r.ok) throw new Error('list '+r.status);
    const rows=await r.json();
    if(!Array.isArray(rows) || rows.length===0){ mount.innerHTML=''; return; }
    /* Render header + image previews (first 6 images inline) + list. */
    const images=rows.filter(a=>(a.mime_type||'').startsWith('image/')).slice(0,MAX_INLINE_IMG);
    let html='<div class="attBlock"><div class="attHd">Attached resources</div>';
    if(images.length){
      html+='<div class="attImgs">'+images.map(a=>
        `<div class="attImg" data-id="${a.id}" title="${esc(a.file_name)}"><div class="attImgLoading">Loading\u2026</div></div>`
      ).join('')+'</div>';
    }
    html+='<div class="attList">'+rows.map(a=>
      `<div class="attRow">`+
        `<div class="attIcon">${attIcon(a.mime_type)}</div>`+
        `<div class="attMeta">`+
          `<div class="attName">${esc(a.file_name)}</div>`+
          `<div class="attSub">${fmtBytes(a.size_bytes)}</div>`+
        `</div>`+
        `<button class="attDl" onclick="window.__attDownload('${a.id}',this)">Download</button>`+
      `</div>`).join('')+'</div></div>';
    mount.innerHTML=html;
    /* Resolve signed URLs for inline images */
    for(const img of images){
      try{
        const data=await sbSignUrl(img.id);
        const slot=mount.querySelector('.attImg[data-id="'+img.id+'"]');
        if(slot && data.url){
          slot.innerHTML='<img src="'+esc(data.url)+'" alt="'+esc(img.file_name)+'" onclick="window.open(this.src,\'_blank\')">';
        }
      }catch(err){
        console.warn('thumb sign failed',err);
        const slot=mount.querySelector('.attImg[data-id="'+img.id+'"]');
        if(slot) slot.innerHTML='<div class="attImgErr">'+esc(img.file_name)+'</div>';
      }
    }
  }catch(err){
    console.warn('loadAttachments failed',err);
    mount.innerHTML='';
  }
}
window.__attDownload=async (aid,btn)=>{
  const orig=btn.textContent;
  btn.disabled=true; btn.textContent='Opening\u2026';
  try{
    const data=await sbSignUrl(aid);
    if(!data.url) throw new Error('no URL');
    /* Open in new tab so the chat / module page stays put */
    window.open(data.url,'_blank','noopener');
    btn.textContent='\u2713 Opened';
    setTimeout(()=>{ btn.disabled=false; btn.textContent=orig; },2000);
  }catch(err){
    console.warn('download failed',err);
    btn.disabled=false; btn.textContent=orig;
    alert('Couldn\'t open file: '+err.message);
  }
};

async function saveProg(mid,patch){

/* click-only quiz — reads question_bank (random draw of draw_size),
   falls back to legacy m.quiz; grades vs pass_threshold; records a
   full attempt row in tc_attempts plus the existing tc_progress. */
function startQuiz(m){
  const bank=Array.isArray(m.question_bank)?m.question_bank:[];
  const legacy=Array.isArray(m.quiz)?m.quiz:[];
  /* normalize to the shape the renderer already uses; carry topic
     through for the later teaching brain (harmless to ignore now). */
  function norm(it){ return {q:String(it.q||''),opts:Array.isArray(it.opts)?it.opts:[],
    answer:typeof it.answer==='number'?it.answer:0,why:String(it.why||''),
    topic:String(it.topic||'')}; }
  let pool, Q;
  if(bank.length){
    pool=bank.map(norm).filter(x=>x.q&&x.opts.length);
    const want=Math.max(1,Math.min(parseInt(m.draw_size,10)||10,pool.length));
    /* Fisher-Yates shuffle, take `want` — fresh subset each attempt */
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]]=[pool[j],pool[i]]; }
    Q=pool.slice(0,want);
  } else {
    Q=legacy.map(norm).filter(x=>x.q&&x.opts.length);   /* legacy: whole set, as before */
  }
  if(!Q.length) return;
  const passMark=Math.max(1,Math.min(parseInt(m.pass_threshold,10)||70,100));
  const startedAt=new Date();
  let answered=Array(Q.length).fill(null), recorded=false, explained=false;
  const mount=document.getElementById('quizMount');

  async function recordAttempt(sc){
    if(recorded) return; recorded=true;
    const now=new Date();
    /* tc_attempts: never send created_by (FK/RLS reject — project rule) */
    const arow={user_id:ME.id,module_id:m.id,
      started_at:startedAt.toISOString(),submitted_at:now.toISOString(),
      duration_sec:Math.max(0,Math.round((now-startedAt)/1000)),
      score:sc,total:Q.length,
      asked:Q.map(x=>({q:x.q,opts:x.opts,answer:x.answer,why:x.why,topic:x.topic})),
      answers:answered,status:'completed'};
    try{ await sbUpsert('tc_attempts',arow,'id'); }
    catch(e){ console.warn('attempt save',e); }
    saveProg(m.id,{viewed:true,quiz_score:sc,bumpAttempt:true,
      quiz_data:{answers:answered,at:now.toISOString()}});
  }

  function draw(){
    let h='<div class="quiz"><h3>Knowledge check</h3>'+
      '<div class="qsub">Tap an answer to lock it in. Reasoning is shown after you complete all questions. '+
      passMark+'% to pass'+(bank.length?' · '+Q.length+' question'+(Q.length===1?'':'s')+' this attempt':'')+'.</div>';
    Q.forEach((q,i)=>{
      h+=`<div class="qcard"><div class="qn">${i+1}. ${esc(q.q)}</div>`;
      q.opts.forEach((o,j)=>{
        let cls='opt';const a=answered[i];
        if(a!=null && j===a) cls+=' picked';   /* neutral highlight — no right/wrong yet */
        h+=`<div class="${cls}" ${a==null?`onclick="window.__pick(${i},${j})"`:''}>
          <div class="mk">${String.fromCharCode(65+j)}</div>
          <div>${esc(o)}</div></div>`;
      });
      h+='</div>';
    });
    const allDone=answered.every(a=>a!=null);
    if(allDone){
      const sc=Math.round(answered.filter((a,i)=>a===Q[i].answer).length/Q.length*100);
      const pass=sc>=passMark;
      const wrongCount=Q.length-answered.filter((a,i)=>a===Q[i].answer).length;
      h+=`<div class="result"><div class="sc ${pass?'pass':'fail'}">${sc}%</div>
        <div class="rl">${pass?('Passed — '+passMark+'% required. Move on when ready.'):('Not yet — '+passMark+'% needed. Review the reasoning below and try again.')}</div>
        <button class="btn gh" onclick="location.hash='c/${m.course_id}'">Back to course</button></div>`;
      /* deferred review: show every question's correct answer + why, with wrong-only toggle */
      h+='<div class="quiz" style="margin-top:18px"><h3>Review</h3>';
      /* slice 2a: topic-weakness strip — only renders if at least one
         topic carries a miss in this attempt. Legacy quizzes (no topics
         on items) render nothing here, by design. */
      const twMap={};
      Q.forEach((q,i)=>{ const t=(q.topic||'').trim(); if(!t) return;
        if(!twMap[t]) twMap[t]={miss:0,tot:0};
        twMap[t].tot++; if(answered[i]!==q.answer) twMap[t].miss++; });
      const twRows=Object.keys(twMap).filter(t=>twMap[t].miss>0)
        .map(t=>({t,miss:twMap[t].miss,tot:twMap[t].tot,rate:twMap[t].miss/twMap[t].tot}))
        .sort((a,b)=>b.rate-a.rate||b.miss-a.miss||a.t.localeCompare(b.t));
      if(twRows.length){
        h+='<div class="twStrip"><div class="twTit">Topic weakness — this attempt</div>';
        twRows.forEach(r=>{
          h+=`<div class="twRow"><div class="twTop">${esc(r.t)}</div><div class="twMis">${r.miss} / ${r.tot} missed</div></div>`;
        });
        h+='</div>';
      }
      h+='<div class="qsub" id="revSub">All questions shown.'+
         (wrongCount>0?' <span class="bk" id="revToggle" style="color:var(--arencon);cursor:pointer;font-weight:600;margin-left:8px">Show wrong only ('+wrongCount+')</span>':'')+
         '</div>';
      Q.forEach((q,i)=>{
        const a=answered[i], ok=(a===q.answer);
        h+=`<div class="qcard rev${ok?' ok':' bad'}" data-ok="${ok?1:0}"><div class="qn">${i+1}. ${esc(q.q)}</div>`;
        q.opts.forEach((o,j)=>{
          let cls='opt';
          if(j===q.answer) cls+=' correct';
          else if(j===a) cls+=' wrong';
          h+=`<div class="${cls}"><div class="mk">${j===q.answer?'✓':(j===a?'✕':String.fromCharCode(65+j))}</div><div>${esc(o)}</div></div>`;
        });
        if(q.why) h+=`<div class="why"><b>Why:</b> ${esc(q.why)}</div>`;
        /* slice 2a: AI explanation placeholder for WRONG items only.
           Patched in after the EF response arrives; left as 'load' if
           the call is still pending; replaced with .err on failure. */
        if(!ok) h+=`<div class="aiBox load" data-qi="${i}">Analyzing your reasoning…</div>`;
        /* slice 2c: Flag-for-review link on EVERY question (right & wrong).
           Right questions also get a flag link in case the user thinks
           the marked-correct answer is actually wrong — that's exactly
           the kind of feedback we want surfaced. */
        h+=`<div><span class="aiFlag" onclick="window.__flagOpen(${i})">Flag this question for review</span></div>`;
        h+='</div>';
      });
      h+='</div>';
      recordAttempt(sc);
    }
    mount.innerHTML=h;
    /* wire wrong-only toggle if present */
    const tog=document.getElementById('revToggle');
    if(tog) tog.onclick=()=>{
      const showAll=tog.dataset.mode==='wrong';
      document.querySelectorAll('.qcard.rev').forEach(el=>{
        el.style.display=(showAll||el.dataset.ok==='0')?'':'none';
      });
      tog.textContent=showAll?('Show wrong only ('+wrongCount+')'):'Show all questions';
      tog.dataset.mode=showAll?'all':'wrong';
    };
    /* slice 2a: fire the explainer EF exactly once, only if there are
       wrong items. Non-blocking: page already shows result + Why blocks.
       Placeholders patch in when the response arrives; on failure they
       degrade to a quiet "unavailable" line. */
    if(allDone && !explained){
      explained=true;
      const wrongItems=Q.map((q,i)=>({i,q,a:answered[i]}))
        .filter(x=>x.a!==x.q.answer)
        .map(x=>({id:String(x.i),q:x.q.q,opts:x.q.opts,answer:x.q.answer,
                  picked:x.a,topic:x.q.topic||'',why:x.q.why||''}));
      if(wrongItems.length){
        sbExplain({wrong_items:wrongItems,
                   module_title:m.title||'',
                   module_code_ref:m.code_ref||'',
                   context:{tool:'training'}})
          .then(resp=>{
            const got=(resp&&Array.isArray(resp.explanations))?resp.explanations:[];
            const byId={};
            got.forEach(e=>{ if(e&&e.id!=null) byId[String(e.id)]=String(e.text||''); });
            mount.querySelectorAll('.aiBox.load').forEach(el=>{
              const id=el.getAttribute('data-qi'), txt=byId[id];
              if(txt){
                el.classList.remove('load');
                /* slice 2b: append Ask a follow-up link. id here is the
                   index into Q[], used by chat handlers below. */
                el.innerHTML='<b>Why your answer was wrong</b>'+esc(txt)+
                  '<div><span class="aiAsk" onclick="window.__chatOpen('+id+')">Ask a follow-up</span></div>';
              } else {
                el.classList.remove('load'); el.classList.add('err');
                /* slice 2c: per-question retry — single-item explain call */
                el.innerHTML='AI explanation unavailable for this question. '+
                  '<span class="retry" onclick="window.__retryExplain('+id+')">Try again</span>';
              }
            });
          })
          .catch(err=>{
            console.warn('explain failed',err);
            mount.querySelectorAll('.aiBox.load').forEach(el=>{
              const id=el.getAttribute('data-qi');
              el.classList.remove('load'); el.classList.add('err');
              el.innerHTML='AI explanation unavailable for this attempt. '+
                '<span class="retry" onclick="window.__retryExplain('+id+')">Try again</span>';
            });
          });
      }
    }
    mount.scrollIntoView({behavior:'smooth',block:'start'});
  }
  window.__pick=(i,j)=>{ if(answered[i]==null){ answered[i]=j; draw(); } };
  /* slice 2b: per-question tutor chat. Independent state per question
     index (Q[i]); kept in browser memory only, lost on refresh by design
     (cost discipline + privacy). slice 2c: cap raised to 20 turns.
     Server still enforces; this client constant must match the EF. */
  const MAX_CHAT_TURNS=20;
  const chats={};   /* {[qi]: {hist:[{role,content}], turn:0, busy:false}} */
  window.__chatOpen=(qi)=>{
    const card=document.querySelector('.qcard.rev[data-ok="0"]:nth-of-type('+(qi+1)+')');
    /* find by aiBox data-qi instead, more reliable */
    const box=mount.querySelector('.aiBox[data-qi="'+qi+'"]');
    if(!box) return;
    /* already open? toggle close */
    const existing=box.parentNode.querySelector('.chat[data-qi="'+qi+'"]');
    if(existing){ existing.remove();
      const ask=box.querySelector('.aiAsk');
      if(ask){ ask.textContent='Ask a follow-up'; ask.classList.remove('disabled'); }
      return;
    }
    if(!chats[qi]) chats[qi]={hist:[],turn:0,busy:false};
    const panel=document.createElement('div');
    panel.className='chat'; panel.setAttribute('data-qi',String(qi));
    panel.innerHTML=
      '<div class="clog" data-role="log">'+
        '<div class="cmsg s">Ask anything about this question — I\'ll help you work through it.</div>'+
      '</div>'+
      '<div class="crow">'+
        '<textarea data-role="input" placeholder="Type your follow-up\u2026" rows="1"></textarea>'+
        '<button class="cbtn" data-role="send" onclick="window.__chatSend('+qi+')">Send</button>'+
      '</div>'+
      '<div class="cbar">'+
        '<span data-role="counter">0 / '+MAX_CHAT_TURNS+' follow-ups</span>'+
        '<span class="cdone" onclick="window.__chatOpen('+qi+')">Hide</span>'+
      '</div>';
    box.parentNode.insertBefore(panel,box.nextSibling);
    /* re-render any existing history (e.g. user hid then reopened) */
    if(chats[qi].hist.length){
      const log=panel.querySelector('[data-role="log"]');
      chats[qi].hist.forEach(msg=>{
        const d=document.createElement('div');
        d.className='cmsg '+(msg.role==='user'?'u':'a');
        d.textContent=msg.content;
        log.appendChild(d);
      });
      panel.querySelector('[data-role="counter"]').textContent=chats[qi].turn+' / '+MAX_CHAT_TURNS+' follow-ups';
    }
    const ask=box.querySelector('.aiAsk');
    if(ask) ask.textContent='Hide follow-up';
    const ta=panel.querySelector('[data-role="input"]');
    ta.focus();
    /* Enter to send (Shift+Enter = newline) */
    ta.addEventListener('keydown',(e)=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); window.__chatSend(qi); }
    });
  };
  window.__chatSend=async (qi)=>{
    const panel=mount.querySelector('.chat[data-qi="'+qi+'"]');
    if(!panel) return;
    const state=chats[qi]; if(!state || state.busy) return;
    const ta=panel.querySelector('[data-role="input"]');
    const log=panel.querySelector('[data-role="log"]');
    const btn=panel.querySelector('[data-role="send"]');
    const counter=panel.querySelector('[data-role="counter"]');
    const msg=(ta.value||'').trim();
    if(!msg) return;
    if(state.turn>=MAX_CHAT_TURNS){
      const note=document.createElement('div');
      note.className='cmsg s';
      note.textContent='Chat limit reached ('+MAX_CHAT_TURNS+' follow-ups). If you still need clarification, please use \u201CFlag this question for review\u201D below.';
      log.appendChild(note); log.scrollTop=log.scrollHeight;
      return;
    }
    state.busy=true; btn.disabled=true; ta.disabled=true;
    /* render user message immediately */
    const uDiv=document.createElement('div');
    uDiv.className='cmsg u'; uDiv.textContent=msg;
    log.appendChild(uDiv);
    /* render placeholder for AI reply */
    const aDiv=document.createElement('div');
    aDiv.className='cmsg a'; aDiv.style.fontStyle='italic';
    aDiv.style.color='var(--steel)';
    aDiv.textContent='Thinking\u2026';
    log.appendChild(aDiv);
    log.scrollTop=log.scrollHeight;
    ta.value='';
    const q=Q[qi];
    try{
      const resp=await sbChat({
        question:{q:q.q,opts:q.opts,answer:q.answer,picked:answered[qi],
                  topic:q.topic||'',why:q.why||''},
        module_title:m.title||'',
        module_code_ref:m.code_ref||'',
        history:state.hist,
        user_message:msg,
        context:{tool:'training'}
      });
      const reply=String(resp.reply||'').trim();
      aDiv.style.fontStyle=''; aDiv.style.color='';
      aDiv.textContent=reply||'(no reply)';
      /* persist into history for next turn */
      state.hist.push({role:'user',content:msg});
      state.hist.push({role:'assistant',content:reply});
      state.turn=resp.turn||(state.turn+1);
      counter.textContent=state.turn+' / '+(resp.max_turns||MAX_CHAT_TURNS)+' follow-ups';
      if(state.turn>=MAX_CHAT_TURNS){
        ta.placeholder='Limit reached \u2014 flag this question for review if you still need help';
      }
    }catch(err){
      console.warn('chat error',err);
      aDiv.classList.add('s'); aDiv.classList.remove('a');
      aDiv.style.fontStyle='italic'; aDiv.style.color='var(--steel)';
      if(err && err.status===429){
        aDiv.textContent='Chat limit reached. If you still need clarification, please flag the question for review.';
        state.turn=MAX_CHAT_TURNS;
        counter.textContent=MAX_CHAT_TURNS+' / '+MAX_CHAT_TURNS+' follow-ups';
        ta.placeholder='Limit reached';
      } else {
        aDiv.textContent='Tutor unavailable \u2014 please try again.';
      }
    } finally {
      state.busy=false; btn.disabled=false; ta.disabled=(state.turn>=MAX_CHAT_TURNS);
      log.scrollTop=log.scrollHeight;
      if(state.turn<MAX_CHAT_TURNS) ta.focus();
    }
  };
  /* slice 2c: per-question retry of the explainer. Single-item call.
     Restores the loading state, fires sbExplain with one item, then
     patches the result back into the same aiBox. */
  window.__retryExplain=async (qi)=>{
    const el=mount.querySelector('.aiBox[data-qi="'+qi+'"]');
    if(!el) return;
    const q=Q[qi]; if(!q || answered[qi]===q.answer) return;
    el.classList.remove('err'); el.classList.add('load');
    el.textContent='Retrying\u2026';
    try{
      const resp=await sbExplain({
        wrong_items:[{id:String(qi),q:q.q,opts:q.opts,answer:q.answer,
                      picked:answered[qi],topic:q.topic||'',why:q.why||''}],
        module_title:m.title||'',
        module_code_ref:m.code_ref||'',
        context:{tool:'training'}});
      const got=(resp&&Array.isArray(resp.explanations))?resp.explanations:[];
      const found=got.find(e=>e&&String(e.id)===String(qi));
      if(found && found.text){
        el.classList.remove('load');
        el.innerHTML='<b>Why your answer was wrong</b>'+esc(found.text)+
          '<div><span class="aiAsk" onclick="window.__chatOpen('+qi+')">Ask a follow-up</span></div>';
      } else {
        el.classList.remove('load'); el.classList.add('err');
        el.innerHTML='Still unavailable. '+
          '<span class="retry" onclick="window.__retryExplain('+qi+')">Try again</span>';
      }
    }catch(err){
      console.warn('retry explain failed',err);
      el.classList.remove('load'); el.classList.add('err');
      el.innerHTML='Retry failed. '+
        '<span class="retry" onclick="window.__retryExplain('+qi+')">Try again</span>';
    }
  };
  /* slice 2c: flag-for-review modal. Lives on document.body so it's
     above any quiz scroll. Pulls chat history (if any) and AI explanation
     (if rendered) for the question being flagged. Posts to the
     feedback EF which distills + persists. */
  window.__flagOpen=(qi)=>{
    if(document.getElementById('flagOv')) return; // already open
    const q=Q[qi]; if(!q) return;
    const a=answered[qi]; const ok=(a===q.answer);
    const chatState=chats[qi];
    const chatHist=chatState && chatState.hist.length ? chatState.hist : [];
    /* find ai explanation text currently rendered */
    let aiTxt='';
    const aiEl=mount.querySelector('.aiBox[data-qi="'+qi+'"]');
    if(aiEl && !aiEl.classList.contains('load') && !aiEl.classList.contains('err')){
      const cloned=aiEl.cloneNode(true);
      /* strip the title bold + the ask link before reading text */
      cloned.querySelectorAll('b,.aiAsk,div:last-child').forEach(n=>{ if(n.parentNode===cloned) n.remove(); });
      aiTxt=cloned.textContent.trim();
    }
    const ov=document.createElement('div');
    ov.className='flagOv'; ov.id='flagOv';
    ov.innerHTML=
      '<div class="flagBx" onclick="event.stopPropagation()">'+
        '<h3>Flag this question for review</h3>'+
        '<div class="flagCtx">'+
          '<div><b>Question:</b> '+esc(q.q)+'</div>'+
          '<div style="margin-top:6px"><b>Your answer:</b> '+(a==null?'(none)':esc(q.opts[a]||''))+(ok?' \u2713 correct':' \u2717 wrong')+'</div>'+
          '<div style="margin-top:6px"><b>Correct answer:</b> '+esc(q.opts[q.answer]||'')+'</div>'+
        '</div>'+
        '<label for="flagTxt">What do you think is wrong, or what\u2019s confusing you?</label>'+
        '<textarea id="flagTxt" placeholder="Be specific \u2014 cite a code clause or describe the ambiguity. (minimum 20 characters)"></textarea>'+
        '<div class="flagHint">Your full context (the question, your pick, the AI explanation, and any chat history) is sent along automatically. You don\u2019t need to repeat any of it.</div>'+
        '<div id="flagMsg"></div>'+
        '<div class="flagBar">'+
          '<button class="cancel" onclick="window.__flagClose()">Cancel</button>'+
          '<button class="submit" id="flagSubmit" onclick="window.__flagSubmit('+qi+')">Submit for review</button>'+
        '</div>'+
      '</div>';
    ov.onclick=()=>window.__flagClose();
    document.body.appendChild(ov);
    /* stash submission payload pieces on the modal so submit() can read them */
    ov.__payload={qi,aiTxt,chatHist:chatHist.slice()};
    setTimeout(()=>{ const t=document.getElementById('flagTxt'); if(t) t.focus(); },50);
  };
  window.__flagClose=()=>{
    const ov=document.getElementById('flagOv');
    if(ov && ov.parentNode) ov.parentNode.removeChild(ov);
  };
  window.__flagSubmit=async (qi)=>{
    const ov=document.getElementById('flagOv'); if(!ov) return;
    const txt=(document.getElementById('flagTxt').value||'').trim();
    const msg=document.getElementById('flagMsg');
    const btn=document.getElementById('flagSubmit');
    msg.innerHTML='';
    if(txt.length<20){
      msg.innerHTML='<div class="flagErr">Please describe your concern in at least 20 characters.</div>';
      return;
    }
    btn.disabled=true; btn.textContent='Submitting\u2026';
    const q=Q[qi]; const a=answered[qi];
    const pl=ov.__payload||{};
    try{
      const resp=await sbFeedback({
        attempt_id:null,    /* not tracked in client state in this slice */
        module_id:m.id||'',
        module_title:m.title||'',
        module_code_ref:m.code_ref||'',
        question:{q:q.q,opts:q.opts,answer:q.answer,picked:a==null?-1:a,
                  topic:q.topic||'',why:q.why||''},
        question_index:qi,
        ai_explanation:pl.aiTxt||'',
        chat_history:pl.chatHist||[],
        user_text:txt,
        context:{tool:'training'}});
      msg.innerHTML='<div class="flagOk">Thanks \u2014 flagged for review.'+
        (resp.summary?'<div style="margin-top:6px;color:var(--steel);font-style:italic">Distilled summary: '+esc(resp.summary)+'</div>':'')+
        '</div>';
      btn.textContent='Submitted';
      /* auto-close after a beat */
      setTimeout(()=>window.__flagClose(),2200);
    }catch(err){
      console.warn('flag submit failed',err);
      const detail=(err.data && (err.data.error||err.data.detail))||err.message||'unknown error';
      msg.innerHTML='<div class="flagErr">Submission failed: '+esc(String(detail))+'</div>';
      btn.disabled=false; btn.textContent='Submit for review';
    }
  };
  draw();
}

gate();

/* ── Dark mode + text size (FRT/Hub pattern; persistence keys shared family-wide) ── */
function applyDark(on){
  document.body.classList.toggle('dark-mode',!!on);
  const b=document.getElementById('btnDark'); if(b) b.textContent=on?'🌙':'☀️';
}
function toggleDark(){
  const on=!document.body.classList.contains('dark-mode');
  applyDark(on); localStorage.setItem('ARENCON_Dark',on?'1':'0');
}
const _TS=['S','M','L'];
function applyTextSize(s){
  if(_TS.indexOf(s)<0) s='M';
  document.body.classList.remove('text-m','text-l');
  if(s==='M') document.body.classList.add('text-m');
  else if(s==='L') document.body.classList.add('text-l');
  const b=document.getElementById('btnTextSize'); if(b) b.textContent=s;
}
function cycleTextSize(){
  const cur=localStorage.getItem('arencon-text-size')||'M';
  const next=_TS[(_TS.indexOf(cur)+1)%_TS.length];
  applyTextSize(next); localStorage.setItem('arencon-text-size',next);
}
applyDark(localStorage.getItem('ARENCON_Dark')==='1');
applyTextSize(localStorage.getItem('arencon-text-size')||'M');
{const _d=document.getElementById('btnDark'); if(_d) _d.onclick=toggleDark;
 const _t=document.getElementById('btnTextSize'); if(_t) _t.onclick=cycleTextSize;}
</script>
