<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARENCON Training — Admin</title>
<style>
/* ═══ ARENCON design language — matched to Hub / FRT / pump tools ═══
   Navy gradient header, burgundy accent, --ts text scaling, card system.
   Tokens lifted from ARENCON_Project_Hub.html :root (canonical). */
:root{
  --arencon:#9C2742; --arencon-mid:#7d1f35; --arencon-light:#F8E8EC;
  --navy:#1B2438; --navy-mid:#243048; --navy-light:#2D3A52;
  --steel:#5A6473; --silver:#94A3B8;
  --smoke:#F1F5F9; --border:#E2E8F0; --white:#FFFFFF;
  --card:#ffffff; --fg:#1E293B; --bg:#F8FAFC;
  --ok:#1A7A4A; --ok-bg:#D4EDDA; --err:#C0392B; --err-bg:#FADBD8;
  --warn:#B7791F;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 6px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 10px 25px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.04);
  --radius:10px; --radius-lg:14px;
  --ts:0px;
  font-family:Calibri,'Segoe UI',system-ui,-apple-system,sans-serif;
}
body.text-m{--ts:2px;} body.text-l{--ts:4px;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Calibri,'Segoe UI',system-ui,sans-serif;color:var(--fg);
  background:var(--bg);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;
  font-size:calc(14px + var(--ts))}

/* ── header: navy gradient + white logo chip (Hub pattern) ── */
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 100%);
  display:flex;align-items:center;padding:10px 16px;gap:10px;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.hdr a.logo{display:flex;align-items:center;flex-shrink:0}
.hdr img{height:32px;width:auto;background:#fff;padding:4px 8px;
  border-radius:7px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:block;
  transition:transform .2s}
.hdr img:hover{transform:scale(1.03)}
.hdr .ttl{font-size:calc(17px + var(--ts));font-weight:700;color:#fff;
  white-space:nowrap;letter-spacing:-.2px;flex-shrink:0}
.hdr .tag{font-size:calc(10.5px + var(--ts));font-weight:700;
  letter-spacing:.5px;color:rgba(255,255,255,.92);
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);
  padding:3px 10px;border-radius:20px;flex-shrink:0}
.hdr .sp{flex:1;min-width:0}
.hdr .who{display:flex;align-items:center;gap:10px;
  color:rgba(255,255,255,.92);font-size:calc(13px + var(--ts));
  font-weight:500;white-space:nowrap}
.hdr .lo{background:rgba(255,255,255,.1);color:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.12);padding:7px 14px;border-radius:8px;
  cursor:pointer;font-weight:600;font-size:calc(12.5px + var(--ts));
  font-family:inherit;transition:all .2s;backdrop-filter:blur(4px);
  flex-shrink:0}
.hdr .lo:hover{background:rgba(255,255,255,.2);
  border-color:rgba(255,255,255,.25);color:#fff}

/* ── shell ── */
.wrap{flex:1;max-width:1000px;width:100%;margin:0 auto;padding:24px 18px 70px}
h1.pg{font-size:calc(21px + var(--ts));font-weight:800;
  letter-spacing:-.3px;margin-bottom:3px}
.sub{color:var(--steel);font-size:calc(13.5px + var(--ts));margin-bottom:20px}
.crumb{font-size:calc(12.5px + var(--ts));color:var(--silver);
  margin-bottom:16px;font-weight:600}
.crumb span.bk{color:var(--arencon);cursor:pointer}
.crumb span.bk:hover{text-decoration:underline}
.crumb b{color:var(--fg)}

/* ── section panels (Hub modal-field rhythm) ── */
.sec{background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow);
  padding:22px 24px;margin-bottom:16px}
.sec h2{font-size:calc(15.5px + var(--ts));font-weight:700;
  margin-bottom:16px;color:var(--fg)}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.fld{flex:1;min-width:200px;margin-bottom:14px}
.fld:last-child{margin-bottom:0}
label{display:block;font-size:calc(11px + var(--ts));font-weight:700;
  color:var(--steel);margin-bottom:6px;text-transform:uppercase;
  letter-spacing:.5px}
input[type=text],textarea,select{width:100%;font-family:inherit;
  font-size:calc(14px + var(--ts));padding:10px 14px;
  border:1.5px solid var(--border);border-radius:8px;background:var(--bg);
  color:var(--fg);outline:none;transition:all .2s}
input[type=text]:focus,textarea:focus,select:focus{
  border-color:var(--arencon);background:#fff;
  box-shadow:0 0 0 3px var(--arencon-light)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
/* lesson/source text helpers — autogrow, expand, tidy */
.txtbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.txtbar label{margin:0}
.txtmeta{font-size:calc(11.5px + var(--ts));color:var(--silver)}
#mTXT{resize:vertical;transition:min-height .12s}
#mTXT.big{min-height:62vh}

/* ── buttons (Hub dash-btn system) ── */
.btn{font-family:inherit;font-size:calc(12.5px + var(--ts));
  font-weight:600;border:none;border-radius:8px;padding:10px 18px;
  cursor:pointer;transition:all .2s}
.btn.pri{background:linear-gradient(135deg,var(--arencon),var(--arencon-mid));
  color:#fff;box-shadow:0 2px 6px rgba(156,39,66,.2)}
.btn.pri:hover{box-shadow:0 4px 12px rgba(156,39,66,.3);
  transform:translateY(-1px)}
.btn.pri:disabled{opacity:.55;cursor:wait;transform:none;box-shadow:none}
.btn.gh{background:var(--bg);color:var(--steel);
  border:1.5px solid var(--border)}
.btn.gh:hover{border-color:var(--arencon);color:var(--arencon);
  background:var(--arencon-light)}
.btn.dn{background:linear-gradient(135deg,#DC2626,#B91C1C);color:#fff;
  box-shadow:0 2px 6px rgba(220,38,38,.2)}
.btn.dn:hover{box-shadow:0 4px 12px rgba(220,38,38,.3);
  transform:translateY(-1px)}
.btn.sm{padding:7px 14px;font-size:calc(12px + var(--ts))}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

/* ── list items / cards (Hub project-card pattern) ── */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;display:flex;
  align-items:center;gap:12px;transition:all .25s;
  box-shadow:0 1px 4px rgba(0,0,0,.06)}
.item:hover{border-color:var(--arencon);box-shadow:var(--shadow-lg)}
.item .gr{flex:1;min-width:0}
.item .t{font-weight:700;font-size:calc(14.5px + var(--ts));
  color:var(--fg)}
.item .m{font-size:calc(12px + var(--ts));color:var(--silver);
  margin-top:3px}
.tagp{font-size:calc(11px + var(--ts));font-weight:700;padding:3px 10px;
  border-radius:20px;background:var(--smoke);color:var(--steel);
  flex-shrink:0}
.tagp.q{background:var(--ok-bg);color:var(--ok)}
.note{font-size:calc(12.5px + var(--ts));color:var(--steel);line-height:1.5;
  background:var(--arencon-light);border-radius:8px;padding:12px 15px;
  margin-top:6px}
.note b{color:var(--arencon)}

/* ── AI quiz draft preview ── */
.qprev{border:1.5px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;background:var(--card)}
.qprev label{margin-top:8px}
.qprev label:first-child{margin-top:0}
/* read-only review card — scan first, click any text or ✎ to edit */
.qcard{border:1.5px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;background:var(--card)}
.qcard .qn{font-size:calc(11px + var(--ts));font-weight:700;color:var(--silver);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.qcard .qq{font-size:calc(14.5px + var(--ts));font-weight:700;color:var(--fg);
  margin-bottom:10px;line-height:1.45;cursor:text}
.qopt{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;margin:4px 0;
  border:1.5px solid var(--border);border-radius:8px;background:var(--bg);
  font-size:calc(13px + var(--ts));color:var(--fg);cursor:text}
.qopt .mk{flex-shrink:0;font-weight:800;color:var(--silver)}
.qopt.ok{background:var(--ok-bg);border-color:var(--ok)}
.qopt.ok .mk{color:var(--ok)}
.qwhy{margin-top:8px;font-size:calc(12.5px + var(--ts));color:var(--steel);
  line-height:1.5;cursor:text}
.qwhy b{color:var(--arencon)}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ── drop zone (FRT photo-zone family) ── */
.dz{border:2px dashed var(--border);border-radius:var(--radius);
  padding:26px;text-align:center;color:var(--silver);
  font-size:calc(13px + var(--ts));cursor:pointer;transition:all .2s;
  background:var(--bg)}
.dz:hover,.dz.over{border-color:var(--arencon);
  background:var(--arencon-light);color:var(--arencon)}
.dz img{max-height:160px;border-radius:8px;margin-top:10px}
/* two-pane review: source image large, beside the questions */
.work{display:flex;gap:18px;align-items:flex-start;margin-top:8px}
.work .imgpane{flex:1 1 44%;position:sticky;top:64px;align-self:flex-start;
  max-height:calc(100vh - 90px);overflow:auto;border:1.5px solid var(--border);
  border-radius:10px;background:var(--bg);padding:8px}
.work .imgpane img{display:block;width:100%;height:auto;border-radius:6px;cursor:zoom-in}
.work .imgpane.zoom img{width:auto;max-width:none;cursor:zoom-out}
.work .qpane{flex:1 1 56%;min-width:0}
@media(max-width:760px){
  .work{flex-direction:column}
  .work .imgpane{position:sticky;top:56px;width:100%;max-height:46vh}
}

/* ── auth overlay (fixed; never replaces content) ── */
#authOv{position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;font-size:calc(15px + var(--ts));
  color:var(--steel)}
#authOv .sp{width:34px;height:34px;border:3px solid var(--border);
  border-top-color:var(--arencon);border-radius:50%;
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--navy);color:#fff;font-size:calc(13.5px + var(--ts));
  padding:12px 22px;border-radius:8px;z-index:200;opacity:0;
  transition:opacity .25s;pointer-events:none;box-shadow:var(--shadow-lg);
  max-width:90vw;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--silver);padding:44px 20px;
  font-size:calc(13.5px + var(--ts))}
@media(max-width:560px){.wrap{padding:16px 13px 50px}
  .hdr .ttl{font-size:calc(15px + var(--ts))}}

</style>

<div class="wrap"><div class="crumb" id="crumb"></div><div id="view"></div></div>
<div class="toast" id="toast"></div>

let SESSION=null, ME=null;
function sbToken(){
  /* Borrows the Project Hub's real session (plain 'sb-access-token'). */
  try{ return localStorage.getItem('sb-access-token')||null; }
  catch(e){ return null; }
}
function liveTok(){
  /* Read the borrowed token LIVE each call (the Hub refreshes it in the
     background; a copy captured at page load goes stale). */
  try{ return localStorage.getItem('sb-access-token')||SESSION; }
  catch(e){ return SESSION; }
}
async function refreshSession(){
  /* Borrowed Hub access tokens are short-lived. Refresh once via the
     stored refresh token; persist the new tokens so the Hub stays in
     sync too. Never throws — returns true/false. */
  try{
    const rt=localStorage.getItem('sb-refresh-token'); if(!rt) return false;
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{apikey:SB_ANON,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:rt})});
    if(!r.ok) return false;
    const d=await r.json().catch(()=>({}));
    if(!d||!d.access_token) return false;
    localStorage.setItem('sb-access-token',d.access_token);
    if(d.refresh_token) localStorage.setItem('sb-refresh-token',d.refresh_token);
    SESSION=d.access_token; return true;
  }catch(e){ return false; }
}
async function sbGet(p){
  const r=await fetch(SB_URL+'/rest/v1/'+p,{
    headers:{apikey:SB_ANON,Authorization:'Bearer '+(liveTok()||SB_ANON)}});
  if(!r.ok) throw new Error('GET '+r.status); return r.json();
}
async function sbIns(t,row){
  const r=await fetch(SB_URL+'/rest/v1/'+t,{method:'POST',
    headers:{apikey:SB_ANON,Authorization:'Bearer '+liveTok(),
      'Content-Type':'application/json',Prefer:'return=representation'},
    body:JSON.stringify(row)});
  if(!r.ok) throw new Error('insert '+r.status+' '+await r.text());
  return (await r.json())[0];
}
async function sbPatch(t,id,row){
  const r=await fetch(SB_URL+'/rest/v1/'+t+'?id=eq.'+id,{method:'PATCH',
    headers:{apikey:SB_ANON,Authorization:'Bearer '+liveTok(),
      'Content-Type':'application/json',Prefer:'return=representation'},
    body:JSON.stringify(row)});
  if(!r.ok) throw new Error('patch '+r.status); return (await r.json())[0];
}
async function sbDel(t,id){
  const r=await fetch(SB_URL+'/rest/v1/'+t+'?id=eq.'+id,{method:'DELETE',
    headers:{apikey:SB_ANON,Authorization:'Bearer '+liveTok()}});
  if(!r.ok) throw new Error('del '+r.status);
}
function toast(m){const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2200);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ─── AUTH GATE + admin-role enforcement ─── */
async function gate(){
  let tok=sbToken();
  if(!tok && !(await refreshSession())) return bounce('Sign-in required');
  tok=sbToken();
  try{
    let r=await fetch(SB_URL+'/auth/v1/user',{
      headers:{apikey:SB_ANON,Authorization:'Bearer '+tok}});
    if(!r.ok && await refreshSession()){ tok=sbToken();
      r=await fetch(SB_URL+'/auth/v1/user',{
        headers:{apikey:SB_ANON,Authorization:'Bearer '+tok}}); }
    if(!r.ok) return bounce('Sign-in required');
    const u=await r.json(); SESSION=tok;
    const pr=await sbGet('profiles?id=eq.'+u.id+'&select=id,full_name,role');
    ME=pr[0]||{id:u.id,full_name:u.email,role:'viewer'};
    if(!['super_admin','admin'].includes(ME.role))
      return bounce('Admin access only');
    document.getElementById('whoBox').textContent=
      (ME.full_name||u.email)+' · '+ME.role;
    document.getElementById('authOv').style.display='none';
    route();
  }catch(e){ bounce('Sign-in required'); }
}
function bounce(msg){
  document.getElementById('authMsg').textContent=msg+' — redirecting…';
  setTimeout(()=>location.href=LOGIN,1100);
}
document.getElementById('logoutBtn').onclick=()=>{
  try{ localStorage.removeItem('sb-access-token');
       localStorage.removeItem('sb-refresh-token'); }catch(e){}
  location.href=LOGIN;
};
document.getElementById('aiUsageBtn').onclick=()=>AIUsage.open();

let COURSES=[], MODS=[], EDIT_ID=null;
async function loadData(){
  COURSES=await sbGet('tc_courses?select=*&order=sort_order');
  MODS=await sbGet('tc_modules?select=*&order=sort_order');
}
async function route(){
  EDIT_ID=null;
  if(!COURSES.length&&!MODS.length) await loadData();
  const h=location.hash.slice(1);
  if(h.startsWith('c/')) return renderCourse(h.slice(2));
  renderHome();
}
window.addEventListener('hashchange',route);

      h+=`<div class="item"><div class="gr">
        <div class="t">${esc(c.title)}</div>
        <div class="m">${esc(c.category)} · ${n} module${n!==1?'s':''} · ${esc(c.status)}</div>
       </div>
       <button class="btn gh sm" onclick="location.hash='c/${c.id}'">Open</button>
       <button class="btn dn sm" onclick="delCourse('${c.id}')">Delete</button>
       </div>`;
    });
    h+='</div></div>';
  }
  document.getElementById('view').innerHTML=h;
  document.getElementById('addC').onclick=async()=>{
    const t=document.getElementById('cT').value.trim();
    if(!t) return toast('Course needs a title');
    try{
      await sbIns('tc_courses',{title:t,
        category:document.getElementById('cC').value,
        description:document.getElementById('cD').value.trim(),
        sort_order:COURSES.length});
      await loadData(); toast('Course created'); renderHome();
    }catch(e){ toast('Save failed: '+e.message); console.error('CREATE COURSE FAIL',e); }
  };
}
window.delCourse=async id=>{
  if(!confirm('Delete this course and all its modules?')) return;
  try{ await sbDel('tc_courses',id); await loadData();
    toast('Deleted'); renderHome(); }
  catch(e){ toast('Delete failed: '+e.message); }
};

/* ─── course detail: modules + add module + AI quiz ─── */
function renderCourse(cid){
  const c=COURSES.find(x=>x.id===cid); if(!c) return renderHome();
  document.getElementById('crumb').innerHTML=
    `<span class="bk" onclick="location.hash=''">Courses</span> › <b>${esc(c.title)}</b>`;
  const ms=MODS.filter(m=>m.course_id===cid);
  const ed = EDIT_ID ? ms.find(m=>m.id===EDIT_ID) : null;
  const _stOpts=[['youtube','YouTube video'],['vimeo','Vimeo video'],['r2','Uploaded video (R2)'],['doc','Document (PDF/slides URL)'],['image','Image / drawing'],['text','Text lesson']];
  const _stSel=(ed&&ed.source_type)||'youtube';
  const EDF=`
    <div class="fld"><label>Module title</label>
     <input type="text" id="mT" placeholder="e.g. Hazard classification basics" value="${esc(ed?ed.title:'')}"></div>
    <div class="fld"><label>Short description</label>
     <input type="text" id="mD" placeholder="One line shown on the card" value="${esc(ed?ed.description:'')}"></div>
    <div class="row">
     <div class="fld" style="max-width:200px"><label>Content type</label>
      <select id="mSTYPE">
       ${_stOpts.map(o=>`<option value="${o[0]}"${o[0]===_stSel?' selected':''}>${o[1]}</option>`).join('')}
      </select></div>
     <div class="fld"><label>URL or R2 key</label>
      <input type="text" id="mSU" placeholder="paste video/doc URL" value="${esc(ed?ed.source_url:'')}"></div>
    </div>
    <div class="fld">
     <div class="txtbar">
      <label>Lesson / source text (used by AI to draft a quiz)</label>
      <span class="txtmeta" id="txtMeta"></span>
      <span style="flex:1"></span>
      <button type="button" class="btn gh sm" id="txtExpand">⤢ Expand</button>
      <button type="button" class="btn gh sm" id="txtTidy">✨ Tidy into lesson text</button>
     </div>
     <textarea id="mTXT" placeholder="Paste the lesson text, key points, or notes here. Optional for video modules, but the AI quiz works best with text.">${esc(ed?ed.source_text:'')}</textarea></div>

    <div class="note"><b>Topics &amp; question bank.</b> Add source text
     above (paste, or attach a PDF/Word/PowerPoint), give a keyword, then
     let AI propose topics. You approve/edit the topics, then generate a
     bank of fact &amp; judgment items per topic — every item is editable,
     retirable and prunable before you save the module.</div>


    <div style="margin:12px 0">
     <div class="dz" id="dzDoc">📄 Attach a PDF, Word, or PowerPoint — click or drop<br>
      <span style="font-size:12px">Text is extracted on the server and fills the lesson box above — no copy-paste — then draft the quiz</span>
      <input type="file" id="dzDocIn" accept=".pdf,.docx,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden></div>
     <div id="docStat" style="font-size:calc(12px + var(--ts));color:var(--steel);margin-top:6px;line-height:1.5"></div>
    </div>

    <div class="row" style="align-items:flex-end">
     <div class="fld" style="flex:1"><label>Keyword / focus for topic proposal</label>
      <input type="text" id="bkKw" placeholder="e.g. hydraulic calculations, hazard classification"></div>
     <button class="btn gh" id="propBtn" style="margin-bottom:14px">✨ Propose topics</button>
    </div>
    <div id="topWrap" style="margin-top:4px"></div>
    <div id="bankWrap" style="margin-top:14px"></div>
    <div class="btnrow" style="margin-top:16px">
     <button class="btn pri" id="addM">${ed?'Update module':'Save module'}</button>
     ${ed?`<button class="btn gh" onclick="cancelEdit('${cid}')">Cancel</button>`:''}
    </div>`;

  let h=`<h1 class="pg">${esc(c.title)}</h1>
   <div class="sub">${esc(c.description||'')}</div>`;
  if(ed){
    h+=`<div class="sec"><h2>Add a module</h2><div class="note">You're editing a module below. Finish it with <b>Update module</b> or <b>Cancel</b> before adding a new one.</div></div>`;
  } else {
    h+=`<div class="sec"><h2>Add a module</h2>${EDF}</div>`;
  }
  h+='<div class="sec"><h2>Modules in this course</h2>';
  if(ms.length){
    h+='<div class="list">';
    ms.forEach(m=>{
      const bank=Array.isArray(m.question_bank)?m.question_bank:[];
      const nb=bank.length, nt=Array.isArray(m.topics)?m.topics.length:0;
      if(ed&&m.id===EDIT_ID){
        h+=`<div class="item" id="edCard" style="display:block;border:2px solid var(--steel)">
          <div style="font-weight:700;font-size:calc(15px + var(--ts));margin-bottom:6px">✎ Editing: ${esc(m.title)}</div>
          <div class="note">Change anything below — title, lesson text, topics, or any quiz question — then press <b>Update module</b> to save your changes onto this same module, or <b>Cancel</b> to discard.</div>
          ${EDF}</div>`;
      } else {
        const _dis=ed?' disabled style="opacity:.45;pointer-events:none"':'';
        h+=`<div class="item"><div class="gr">
          <div class="t">${esc(m.title)}</div>
          <div class="m">${esc(m.source_type||'')} ${nb?'· '+nb+' item'+(nb===1?'':'s')+' / '+nt+' topic'+(nt===1?'':'s'):''}</div>
         </div>
         ${nb?'<span class="tagp q">bank</span>':'<span class="tagp">no bank</span>'}
         <button class="btn gh sm"${_dis} onclick="editMod('${m.id}')">Edit</button>
         <button class="btn dn sm"${_dis} onclick="delMod('${m.id}')">Delete</button>
         </div>`;
      }
    });
    h+='</div>';
  } else {
    h+='<div class="note">No modules yet — use “Add a module” above.</div>';
  }
  h+='</div>';
  document.getElementById('view').innerHTML=h;

  /* photo-to-quiz path removed in Slice 1b-ii (Option B). */

  /* ─── document → text (server-side extract; fills the lesson box) ─── */
  const EXTRACT_EF='https://xsemvinxsyphjiaqgywv.supabase.co/functions/v1/training-extract';
  function readDoc(f){
    const stat=document.getElementById('docStat');
    if(!/\.(pdf|docx|pptx)$/i.test(f.name)){
      return toast('Use a PDF, .docx, or .pptx file');
    }
    stat.textContent='Reading '+f.name+' on the server…';
    const rd=new FileReader();
    rd.onload=async()=>{
      const b64=String(rd.result).split(',')[1]||'';
      try{
        const r=await fetch(EXTRACT_EF,{method:'POST',
          headers:{'Content-Type':'application/json',
            apikey:SB_ANON,Authorization:'Bearer '+liveTok()},
          body:JSON.stringify({file:b64,filename:f.name,media_type:f.type||''})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
        const box=document.getElementById('mTXT');
        box.value=d.text||'';
        syncTxt();
        const m=d.meta||{};
        stat.textContent='Extracted '+Number(m.chars||0).toLocaleString()+
          ' characters from '+(m.units||'?')+' '+(m.unit_label||'')+
          ' ('+String(m.kind||'').toUpperCase()+')'+
          (m.truncated?' — truncated to fit; trim if needed':'')+
          '. Review/trim the text above, then “✨ Draft quiz with AI”.';
        const st=document.getElementById('mSTYPE'); if(st) st.value='doc';
        toast('Document text extracted into the lesson box');
      }catch(e){ stat.textContent=''; toast('Extract failed: '+e.message); }
    };
    rd.onerror=()=>{ stat.textContent=''; toast('Could not read that file'); };
    rd.readAsDataURL(f);
  }
  const dzDoc=document.getElementById('dzDoc'),dzDocIn=document.getElementById('dzDocIn');
  dzDoc.onclick=()=>dzDocIn.click();
  dzDoc.ondragover=e=>{e.preventDefault();dzDoc.classList.add('over');};
  dzDoc.ondragleave=()=>dzDoc.classList.remove('over');
  dzDoc.ondrop=e=>{e.preventDefault();dzDoc.classList.remove('over');
    if(e.dataTransfer.files[0])readDoc(e.dataTransfer.files[0]);};
  dzDocIn.onchange=()=>{ if(dzDocIn.files[0]) readDoc(dzDocIn.files[0]); };

  /* ─── lesson-text helpers: autogrow + count, expand, tidy-into-lesson AI ─── */
  const CLEAN_EF='https://xsemvinxsyphjiaqgywv.supabase.co/functions/v1/training-clean';
  const mTXT=document.getElementById('mTXT');
  const txtMeta=document.getElementById('txtMeta');
  function syncTxt(){
    if(!mTXT) return;
    mTXT.style.height='auto';
    mTXT.style.height=Math.max(mTXT.scrollHeight,90)+'px';
    if(txtMeta){
      const v=mTXT.value, w=v.trim()?v.trim().split(/\s+/).length:0;
      txtMeta.textContent=v.length.toLocaleString()+' chars · '+w.toLocaleString()+' words';
    }
  }
  if(mTXT){ mTXT.addEventListener('input',syncTxt); syncTxt(); }
  const txtExpand=document.getElementById('txtExpand');
  if(txtExpand) txtExpand.onclick=()=>{
    mTXT.classList.toggle('big');
    txtExpand.textContent=mTXT.classList.contains('big')?'⤡ Collapse':'⤢ Expand';
    syncTxt(); mTXT.focus();
  };
  const txtTidy=document.getElementById('txtTidy');
  if(txtTidy) txtTidy.onclick=async()=>{
    const t=mTXT.value.trim();
    if(t.length<20) return toast('Add more source text first (20+ characters)');
    if(!confirm('Tidy the lesson text with AI? It rewrites for readability only — facts, code references and numbers are preserved. This replaces the current text.')) return;
    txtTidy.disabled=true; const lbl=txtTidy.textContent; txtTidy.textContent='Tidying…';
    try{
      const r=await fetch(CLEAN_EF,{method:'POST',
        headers:{'Content-Type':'application/json',
          apikey:SB_ANON,Authorization:'Bearer '+liveTok()},
        body:JSON.stringify({text:t})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
      if(d.text){ mTXT.value=d.text; syncTxt();
        const c=d.usage&&d.usage.cost_usd;
        toast('Lesson text tidied'+(c?(' · $'+Number(c).toFixed(4)):''));
      } else throw new Error('No text returned');
    }catch(e){ toast('Tidy failed: '+e.message); }
    txtTidy.disabled=false; txtTidy.textContent=lbl;
  };

  /* ─── Topic proposal → per-topic bank gen → review/prune → save ─── */
  let TOPICS=ed&&Array.isArray(ed.topics)?JSON.parse(JSON.stringify(ed.topics)):[];   /* [{name,rationale}] — seeded from module when editing */
  let BANK=ed&&Array.isArray(ed.question_bank)?JSON.parse(JSON.stringify(ed.question_bank)):[];     /* [{id,type,topic,...,status,ai_original}] */
  let bEdit=-1;
  function uid(){ return 'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  const srcText=()=>document.getElementById('mTXT').value.trim();
  function costStr(u){ const c=u&&u.cost_usd; return c?(' · $'+Number(c).toFixed(4)):''; }

  document.getElementById('propBtn').onclick=async()=>{
    const kw=document.getElementById('bkKw').value.trim();
    const txt=srcText();
    if(!kw&&!txt) return toast('Add a keyword and/or lesson source text first');
    const b=document.getElementById('propBtn');
    b.disabled=true; b.textContent='Proposing…';
    try{
      const out=await aiTopics(kw,txt,TOPICS.map(t=>t.name));
      out.topics.forEach(t=>{ if(!TOPICS.some(x=>x.name.toLowerCase()===t.name.toLowerCase()))
        TOPICS.push({name:t.name,rationale:t.rationale}); });
      renderTopics();
      toast('Proposed '+out.topics.length+' topics'+costStr(out.usage));
    }catch(e){ toast('Propose failed: '+e.message); }
    b.disabled=false; b.textContent='✨ Propose topics';
  };

  function renderTopics(){
    const w=document.getElementById('topWrap');
    if(!TOPICS.length){ w.innerHTML=''; document.getElementById('bankWrap').innerHTML=''; return; }
    let h='<div class="sec" style="margin:0 0 12px"><h2>Approved topics ('+TOPICS.length+')</h2>'+
      '<div class="note">Edit a name inline, remove any you don\'t want, then generate items per topic below. '+
      'Accurate gap analysis needs topics you approve — not AI-invented ones.</div>';
    TOPICS.forEach((t,ti)=>{
      h+=`<div class="item"><div class="gr">
        <input type="text" value="${esc(t.name)}" oninput="window.__tn(${ti},this.value)"
          style="font-weight:700;border:1px solid var(--border);border-radius:6px;padding:6px 10px;width:100%">
        <div class="m">${esc(t.rationale||'')}</div></div>
        <button class="btn dn sm" onclick="window.__tdel(${ti})">Remove</button></div>`;
    });
    h+='</div>';
    w.innerHTML=h;
    renderBank();
  }
  window.__tn=(i,v)=>{ TOPICS[i].name=v; };
  window.__tdel=(i)=>{ const nm=TOPICS[i].name; TOPICS.splice(i,1);
    BANK=BANK.filter(q=>q.topic!==nm); renderTopics(); };

  async function genFor(topic,n){
    const txt=srcText();
    const avoid=BANK.filter(q=>q.topic===topic).map(q=>q.type==='judgment'?q.scenario:q.q);
    const out=await aiItems({topic,sourceText:txt,count:n,avoid});
    let added=0;
    out.items.forEach(it=>{
      const base={id:uid(),topic,why:it.why||'',ai_original:JSON.stringify(it),
        instructor_note:'',code_ref:'',review_by:null,status:'active'};
      if(it.type==='judgment'){
        BANK.push(Object.assign(base,{type:'judgment',scenario:it.scenario||'',
          rubric:Array.isArray(it.rubric)?it.rubric:[]}));
      } else {
        BANK.push(Object.assign(base,{type:'fact',q:it.q||'',
          opts:(it.opts||[]).slice(0,4).map(String),
          answer:Math.max(0,Math.min(3,parseInt(it.answer)||0))}));
      }
      added++;
    });
    return {added,usage:out.usage};
  }

  function renderBank(){
    const w=document.getElementById('bankWrap');
    if(!TOPICS.length){ w.innerHTML=''; return; }
    let h='<div class="sec" style="margin:0"><h2>Question bank ('+BANK.length+' items)</h2>';
    TOPICS.forEach((t,ti)=>{
      const items=BANK.map((q,gi)=>({q,gi})).filter(o=>o.q.topic===t.name);
      h+=`<div style="border:1.5px solid var(--border);border-radius:10px;padding:14px;margin:10px 0">
        <div class="row" style="align-items:center;justify-content:space-between">
         <b>${esc(t.name)}</b>
         <span class="txtmeta">${items.length} item${items.length===1?'':'s'}</span></div>
        <div class="row" style="margin-top:8px;align-items:center">
         <label style="margin:0;text-transform:none">Generate
          <select id="gn_${ti}" style="width:auto;display:inline-block;margin:0 6px">
           <option>4</option><option selected>6</option><option>8</option><option>10</option></select>
          fact + judgment items</label>
         <button class="btn gh sm" id="gb_${ti}" onclick="window.__gen(${ti})">✨ Generate (≈1–2¢)</button></div>`;
      items.forEach(o=>{ h+=bankCard(o.q,o.gi); });
      h+='</div>';
    });
    h+='</div>';
    w.innerHTML=h;
  }

  function bankCard(q,gi){
    const tag=q.type==='judgment'?'<span class="tagp">judgment</span>':'<span class="tagp q">fact</span>';
    const ret=q.status==='retired'?' style="opacity:.5"':'';
    if(bEdit===gi){
      let h=`<div class="qprev"${ret}><label>${q.type==='judgment'?'Judgment':'Fact'} — editing</label>`;
      if(q.type==='judgment'){
        h+=`<label>Scenario</label>
          <textarea oninput="window.__be(${gi},'scenario',this.value)" style="min-height:70px">${esc(q.scenario)}</textarea>
          <label style="margin-top:8px">Rubric (one reasoning point per line)</label>
          <textarea oninput="window.__brub(${gi},this.value)" style="min-height:80px">${esc((q.rubric||[]).join('\n'))}</textarea>`;
      } else {
        h+=`<input type="text" value="${esc(q.q)}" oninput="window.__be(${gi},'q',this.value)">
          <div style="margin-top:8px">`;
        q.opts.forEach((o,j)=>{ h+=`<div class="row" style="margin:6px 0;align-items:center">
          <input type="text" value="${esc(o)}" style="flex:1" oninput="window.__bo(${gi},${j},this.value)">
          <label style="display:flex;align-items:center;gap:5px;text-transform:none;font-weight:600;color:var(--fg);margin:0">
           <input type="radio" name="ba${gi}" ${q.answer===j?'checked':''} onchange="window.__ba(${gi},${j})" style="width:auto"> correct</label></div>`; });
        h+=`</div>`;
      }
      h+=`<label style="margin-top:8px">Why / ARENCON position (shown after answering)</label>
        <textarea oninput="window.__be(${gi},'why',this.value)" style="min-height:56px">${esc(q.why||'')}</textarea>
        <div class="row" style="margin-top:8px">
         <div class="fld" style="flex:1;margin:0"><label>Code ref</label>
          <input type="text" value="${esc(q.code_ref||'')}" oninput="window.__be(${gi},'code_ref',this.value)"></div>
         <div class="fld" style="flex:1;margin:0"><label>Review by</label>
          <input type="date" value="${esc(q.review_by||'')}" oninput="window.__be(${gi},'review_by',this.value||null)"></div></div>
        <div class="fld" style="margin-top:8px"><label>Instructor note (private)</label>
         <input type="text" value="${esc(q.instructor_note||'')}" oninput="window.__be(${gi},'instructor_note',this.value)"></div>
        <div class="qbtns"><button class="btn pri sm" onclick="window.__bdone()">Done</button></div></div>`;
      return h;
    }
    let h=`<div class="qcard"${ret}><div class="qn">${tag} ${esc(q.topic)}</div>`;
    if(q.type==='judgment'){
      h+=`<div class="qq" onclick="window.__bedit(${gi})">${esc(q.scenario)}</div>`;
      (q.rubric||[]).forEach(r=>{ h+=`<div class="qopt" onclick="window.__bedit(${gi})"><span class="mk">•</span><span>${esc(r)}</span></div>`; });
    } else {
      h+=`<div class="qq" onclick="window.__bedit(${gi})">${esc(q.q)}</div>`;
      q.opts.forEach((o,j)=>{ const ok=q.answer===j;
        h+=`<div class="qopt${ok?' ok':''}" onclick="window.__bedit(${gi})"><span class="mk">${ok?'✓':String.fromCharCode(65+j)}</span><span>${esc(o)}</span></div>`; });
    }
    if(q.why) h+=`<div class="qwhy" onclick="window.__bedit(${gi})"><b>Why:</b> ${esc(q.why)}</div>`;
    h+=`<div class="qbtns">
      <button class="btn gh sm" onclick="window.__bedit(${gi})">✎ Edit</button>
      <button class="btn gh sm" onclick="window.__bret(${gi})">${q.status==='retired'?'Restore':'Retire'}</button>
      <button class="btn dn sm" onclick="window.__bdel(${gi})">✕ Delete</button></div></div>`;
    return h;
  }
  window.__be=(i,k,v)=>{ BANK[i][k]=v; };
  window.__bo=(i,j,v)=>{ BANK[i].opts[j]=v; };
  window.__ba=(i,j)=>{ BANK[i].answer=j; };
  window.__brub=(i,v)=>{ BANK[i].rubric=v.split('\n').map(s=>s.trim()).filter(Boolean); };
  window.__bedit=(i)=>{ bEdit=i; renderBank(); };
  window.__bdone=()=>{ bEdit=-1; renderBank(); };
  window.__bret=(i)=>{ BANK[i].status=BANK[i].status==='retired'?'active':'retired'; renderBank(); };
  window.__bdel=(i)=>{ if(!confirm('Delete this item permanently?'))return;
    BANK.splice(i,1); bEdit=-1; renderBank(); };
  window.__gen=async(ti)=>{
    const name=TOPICS[ti]&&TOPICS[ti].name; if(!name) return;
    const sel=document.getElementById('gn_'+ti); const n=parseInt(sel&&sel.value)||6;
    const b=document.getElementById('gb_'+ti);
    if(b){ b.disabled=true; b.textContent='Generating…'; }
    try{ const r=await genFor(name,n); renderBank();
      toast('Added '+r.added+' items to "'+name+'"'+costStr(r.usage)); }
    catch(e){ toast('Generate failed: '+e.message);
      if(b){ b.disabled=false; b.textContent='✨ Generate (≈1–2¢)'; } }
  };

  document.getElementById('addM').onclick=async()=>{
    const t=document.getElementById('mT').value.trim();
    if(!t) return toast('Module needs a title');
    const row={course_id:cid,title:t,
      description:document.getElementById('mD').value.trim(),
      source_type:document.getElementById('mSTYPE').value,
      source_url:document.getElementById('mSU').value.trim()||null,
      source_text:srcText()||null,
      topics:TOPICS,question_bank:BANK};
    const b=document.getElementById('addM'); b.disabled=true; const _bl=b.textContent;
    b.textContent=ed?'Updating…':'Saving…';
    try{
      if(ed){
        row.sort_order=(typeof ed.sort_order==='number')?ed.sort_order:ms.length;
        row.updated_at=new Date().toISOString();
        await sbPatch('tc_modules',EDIT_ID,row); EDIT_ID=null; await loadData();
        toast('Module updated — '+BANK.length+' bank items'); renderCourse(cid);
      } else {
        row.sort_order=ms.length;
        await sbIns('tc_modules',row); await loadData();
        toast('Module saved — '+BANK.length+' bank items'); renderCourse(cid);
      }
    }
    catch(e){ toast((ed?'Update':'Save')+' failed: '+e.message); console.error('SAVE MODULE FAIL',e);
      b.disabled=false; b.textContent=_bl; }
  };
  if(ed){ renderTopics(); const _ec=document.getElementById('edCard'); if(_ec) _ec.scrollIntoView({behavior:'smooth',block:'start'}); }
}
window.delMod=async id=>{
  if(!confirm('Delete this module?')) return;
  try{ await sbDel('tc_modules',id); await loadData();
    toast('Deleted'); route(); }catch(e){ toast('Delete failed: '+e.message); }
};
window.editMod=id=>{ EDIT_ID=id; const m=MODS.find(x=>x.id===id); if(m) renderCourse(m.course_id); };
window.cancelEdit=cid=>{ EDIT_ID=null; renderCourse(cid); };

/* ─── Topic + bank generation (Supabase Edge Functions) ─── */
const TOPICS_EF='https://xsemvinxsyphjiaqgywv.supabase.co/functions/v1/training-topics';
const QUIZ_EF='https://xsemvinxsyphjiaqgywv.supabase.co/functions/v1/training-quiz';
async function efPost(url,payload){
  /* Auth: the user's Supabase session JWT, read LIVE each call; on 401
     refresh once via sb-refresh-token and retry (borrowed Hub token is
     short-lived). Server holds the Anthropic key + prompt + style corpus. */
  function call(){ return fetch(url,{method:'POST',
    headers:{'Content-Type':'application/json',
      apikey:SB_ANON,Authorization:'Bearer '+(liveTok()||'')},
    body:JSON.stringify(payload)}); }
  let r=await call();
  if(r.status===401 && await refreshSession()) r=await call();
  const d=await r.json().catch(()=>({}));
  if(r.status===401) throw new Error('Session expired — reload this page (or re-sign in on the Hub), then retry');
  if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
  return d;
}
async function aiTopics(keyword,sourceText,avoid){
  const d=await efPost(TOPICS_EF,{keyword:keyword||'',sourceText:sourceText||'',
    avoid:Array.isArray(avoid)?avoid:[],context:{tool:'training'}});
  if(!Array.isArray(d.topics)||!d.topics.length) throw new Error('No topics returned');
  return {topics:d.topics.map(t=>({name:String(t.name||'').trim(),
    rationale:String(t.rationale||'').trim()})).filter(t=>t.name),
    usage:d.usage||{}};
}
async function aiItems(o){
  const d=await efPost(QUIZ_EF,{topic:o.topic||'',sourceText:o.sourceText||'',
    mode:'mixed',count:o.count||6,
    avoid:Array.isArray(o.avoid)?o.avoid:[],context:{tool:'training'}});
  if(!Array.isArray(d.quiz)||!d.quiz.length) throw new Error('No items returned');
  return {items:d.quiz,usage:d.usage||{}};
}
